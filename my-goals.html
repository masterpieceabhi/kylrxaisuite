<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My goals | Kylrx AI</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--bg:#f8fafc;--ok:#166534;--bad:#b91c1c}
*{box-sizing:border-box}body{margin:0;font:18px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#fff;border-bottom:1px solid var(--line);gap:8px}
h1{margin:0;font-size:22px}h2{margin:0 0 10px;font-size:19px}h3{margin:12px 0 4px;font-size:16px}
.lang button{padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}.lang button.on{background:var(--ink);color:#fff}
main{max-width:560px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.item{border-top:1px solid var(--line);padding:12px 0}.item:first-child{border-top:0;padding-top:0}
.hint{color:var(--muted);font-size:15px}.pre{white-space:pre-wrap;font-size:16px}
label{display:grid;gap:4px;font-size:15px;color:var(--muted);font-weight:600;margin:10px 0}
input,textarea{padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;width:100%;color:var(--ink);background:#fff}
input[type=range]{padding:0}
button.go{padding:12px 16px;border:0;border-radius:10px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button.soft{padding:10px 14px;border:0;border-radius:10px;background:#eef2ff;color:var(--blue);font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.tag{padding:2px 10px;border-radius:999px;font-size:14px;font-weight:700}.good{background:#dcfce7;color:var(--ok)}.wait{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:var(--bad)}.grey{background:#e2e8f0;color:#475569}
.bar{height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--blue)}
#msg{display:none;border-radius:10px;padding:12px}#msg.ok{display:block;background:#dcfce7;color:var(--ok)}#msg.err{display:block;background:#fee2e2;color:var(--bad)}
a.back{display:block;text-align:center;color:var(--blue);font-weight:700;padding:14px;text-decoration:none}
</style>
</head>
<body>
<header><h1 data-t="title"></h1><div class="lang"><button data-l="en">English</button> <button data-l="es">Español</button></div></header>
<main>
  <div id="msg" role="status"></div>
  <section class="card"><h2 data-t="goals"></h2><div id="goalList"></div>
    <form id="goalForm">
      <label><span data-t="newGoal"></span><input name="title" required minlength="3" maxlength="160"></label>
      <label><span data-t="due"></span><input name="dueDate" type="date"></label>
      <button class="go" type="submit" data-t="add"></button>
    </form>
  </section>
  <section class="card"><h2 data-t="reviews"></h2><div id="reviewList"></div></section>
  <a class="back" href="my-reviews.html" id="cyclesLink"></a>
  <a class="back" href="punch.html" data-t="back"></a>
</main>
<script type="module">
import { auth, onAuthStateChanged } from './firebase-config.js';
const $ = (id) => document.getElementById(id);
const T = {
  en: { title: 'My goals', back: 'Back to the clock', cycles: 'My self review and feedback for coworkers', cyclesWaiting: '{n} waiting for you', goals: 'My goals', noGoals: 'No goals yet. Add one below, or your manager can add one for you.', newGoal: 'A new goal', due: 'Finish by (optional)', add: 'Add goal', dueBy: 'Finish by {d}', late: 'late', done: 'Done', dropped: 'Dropped', markDone: 'I finished this', save: 'Save progress', from: 'From {n}', progress: 'How far along: {p}%',
        reviews: 'My reviews', noReviews: 'No reviews have been shared with you yet.', period: '{a} to {b}', by: 'Written by {n}', overall: 'Overall: {n} of 5', well: 'What went well', work: 'What to work on', next: 'Next steps', seen: 'You marked this as seen on {d}.', ackHint: 'Marking it as seen means you have read it. It does not mean you agree.', comment: 'Your comment (optional)', ack: 'I have read this', acked: 'Thank you. Your manager can see that you read it.', saved: 'Saved.', fail: 'Could not load. Try again.',
        r1: 'Does not meet expectations', r2: 'Partly meets expectations', r3: 'Meets expectations', r4: 'Exceeds expectations', r5: 'Outstanding' },
  es: { title: 'Mis metas', back: 'Volver al reloj', cycles: 'Mi autoevaluación y opiniones sobre compañeros', cyclesWaiting: '{n} por hacer', goals: 'Mis metas', noGoals: 'Todavía no hay metas. Agregue una abajo, o su supervisor puede agregarle una.', newGoal: 'Una meta nueva', due: 'Terminar antes de (opcional)', add: 'Agregar meta', dueBy: 'Terminar antes del {d}', late: 'atrasada', done: 'Lista', dropped: 'Descartada', markDone: 'Ya la terminé', save: 'Guardar avance', from: 'De {n}', progress: 'Avance: {p}%',
        reviews: 'Mis evaluaciones', noReviews: 'Todavía no le han compartido evaluaciones.', period: '{a} al {b}', by: 'Escrita por {n}', overall: 'General: {n} de 5', well: 'Lo que salió bien', work: 'En qué trabajar', next: 'Próximos pasos', seen: 'Usted la marcó como vista el {d}.', ackHint: 'Marcarla como vista significa que la leyó. No significa que esté de acuerdo.', comment: 'Su comentario (opcional)', ack: 'Ya la leí', acked: 'Gracias. Su supervisor puede ver que la leyó.', saved: 'Guardado.', fail: 'No se pudo cargar. Intente de nuevo.',
        r1: 'No cumple lo esperado', r2: 'Cumple en parte', r3: 'Cumple lo esperado', r4: 'Supera lo esperado', r5: 'Sobresaliente' }
};
let lang = (navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en';
try { lang = localStorage.getItem('kylrx_lang') || lang; } catch (_) {}
if (!T[lang]) lang = 'en';
const tr = (k, v = {}) => (T[lang][k] ?? T.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const say = (t, ok = true) => { const m = $('msg'); m.textContent = t; m.className = ok ? 'ok' : 'err'; window.scrollTo({ top: 0, behavior: 'smooth' }); };
// A plain date (2026-11-01) is shown as that day; a full timestamp is shown as the viewer's local day, not the UTC day
const day = (d) => (d ? new Date(String(d).length > 10 ? d : `${d}T12:00:00`).toLocaleDateString(lang === 'es' ? 'es-US' : 'en-US', { dateStyle: 'long' }) : '');
let goals = null; let reviews = null; let me = null; let cyclesWaiting = 0;

async function req(method, path, body) {
  const res = await fetch(`/api/us/performance${path}`, { method, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${await auth.currentUser.getIdToken()}` }, body: body ? JSON.stringify(body) : undefined });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((json.errors && json.errors.join('; ')) || (typeof json.error === 'string' ? json.error : '') || `Request failed (${res.status})`);
  return json;
}
function paint() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = tr(el.dataset.t); });
  document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.l === lang));
  $('cyclesLink').textContent = `${tr('cycles')}${cyclesWaiting ? ` (${tr('cyclesWaiting', { n: cyclesWaiting })})` : ''}`;
  if (!goals) return;
  $('goalList').innerHTML = goals.map((g) => `<div class="item"><b>${esc(g.title)}</b> ${g.status === 'done' ? `<span class="tag good">${esc(tr('done'))}</span>` : g.status === 'dropped' ? `<span class="tag grey">${esc(tr('dropped'))}</span>` : g.overdue ? `<span class="tag bad">${esc(tr('late'))}</span>` : ''}${g.detail ? `<br><span class="hint">${esc(g.detail)}</span>` : ''}<br><span class="hint">${g.dueDate ? esc(tr('dueBy', { d: day(g.dueDate) })) : ''}${g.createdByName && g.createdByName !== me ? ` · ${esc(tr('from', { n: g.createdByName }))}` : ''}</span>${g.status === 'open' ? `<label>${esc(tr('progress', { p: g.progress }))}<input type="range" min="0" max="100" step="5" value="${esc(g.progress)}" data-range="${esc(g.id)}"></label><div class="row"><button class="soft" data-save="${esc(g.id)}">${esc(tr('save'))}</button><button class="soft" data-done="${esc(g.id)}">${esc(tr('markDone'))}</button></div>` : `<div class="bar"><i style="width:${Number(g.progress) || 0}%"></i></div>`}</div>`).join('') || `<p class="hint">${esc(tr('noGoals'))}</p>`;
  $('reviewList').innerHTML = reviews.map((r) => `<div class="item"><b>${esc(tr('period', { a: day(r.periodStart), b: day(r.periodEnd) }))}</b><br><span class="hint">${esc(tr('by', { n: r.reviewerName || '' }))}</span>${r.overall ? `<p><b>${esc(tr('overall', { n: r.overall }))}</b> <span class="hint">${esc(tr(`r${r.overall}`))}</span></p>` : ''}${r.ratings.map((a) => `<div class="hint">${esc(a.area)}: ${esc(a.rating)}/5${a.comment ? `. ${esc(a.comment)}` : ''}</div>`).join('')}<h3>${esc(tr('well'))}</h3><p class="pre">${esc(r.strengths)}</p>${r.improvements ? `<h3>${esc(tr('work'))}</h3><p class="pre">${esc(r.improvements)}</p>` : ''}${r.nextSteps ? `<h3>${esc(tr('next'))}</h3><p class="pre">${esc(r.nextSteps)}</p>` : ''}${r.status === 'acknowledged' ? `<p class="hint">${esc(tr('seen', { d: day(r.acknowledgedAt) }))}${r.employeeComment ? ` "${esc(r.employeeComment)}"` : ''}</p>` : `<p class="hint">${esc(tr('ackHint'))}</p><label>${esc(tr('comment'))}<textarea rows="2" maxlength="2000" data-comment="${esc(r.id)}"></textarea></label><button class="go" data-ack="${esc(r.id)}">${esc(tr('ack'))}</button>`}</div>`).join('') || `<p class="hint">${esc(tr('noReviews'))}</p>`;
}
// how many self reviews and coworker forms are waiting (review rounds); the page works the same if this cannot be loaded
async function loadCycles() { try { const res = await fetch('/api/us/review-cycles/mine', { headers: { Authorization: `Bearer ${await auth.currentUser.getIdToken()}` } }); const j = res.ok ? await res.json() : {}; cyclesWaiting = Number(j.waiting) || 0; } catch (_) { cyclesWaiting = 0; } }
async function load() { const [g, r] = await Promise.all([req('GET', '/goals'), req('GET', '/reviews'), loadCycles()]); goals = g.data; reviews = r.data; me = g.name; paint(); }
$('goalForm').addEventListener('submit', async (e) => {
  e.preventDefault(); const f = e.target.elements;
  try { await req('POST', '/goals', { title: f.title.value, dueDate: f.dueDate.value || undefined }); e.target.reset(); await load(); say(tr('saved')); } catch (err) { say(err.message, false); }
});
document.addEventListener('input', (e) => { const r = e.target.closest('[data-range]'); if (r) r.parentElement.firstChild.textContent = tr('progress', { p: r.value }); });
document.addEventListener('click', async (e) => {
  const el = (k) => e.target.closest(`[data-${k}]`);
  let t;
  try {
    if ((t = el('l'))) { lang = t.dataset.l; try { localStorage.setItem('kylrx_lang', lang); } catch (_) {} paint(); } else if ((t = el('save'))) { await req('PUT', `/goals/${t.dataset.save}`, { progress: Number(document.querySelector(`[data-range="${CSS.escape(t.dataset.save)}"]`).value) }); await load(); say(tr('saved')); } else if ((t = el('done'))) { await req('PUT', `/goals/${t.dataset.done}`, { status: 'done' }); await load(); say(tr('saved')); } else if ((t = el('ack'))) { await req('POST', `/reviews/${t.dataset.ack}/acknowledge`, { comment: document.querySelector(`[data-comment="${CSS.escape(t.dataset.ack)}"]`).value }); await load(); say(tr('acked')); }
  } catch (err) { say(err.message, false); }
});
paint();
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'login.html'; return; }
  try { await load(); } catch (_) { say(tr('fail'), false); }
});
</script>
</body>
</html>
