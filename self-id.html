<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voluntary self-identification</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--bg:#f1f5f9}
*{box-sizing:border-box}body{margin:0;font:18px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#fff;border-bottom:1px solid var(--line)}
.lang button{font:inherit;font-weight:700;padding:6px 14px;border-radius:999px;border:2px solid #cbd5e1;background:#fff;margin-left:6px}.lang button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:640px;margin:0 auto;padding:16px 14px 60px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(15,23,42,.08)}h2{margin:0 0 8px;font-size:21px}p.s{margin:0 0 10px;color:var(--muted);font-size:16px}
fieldset{border:0;padding:0;margin:14px 0}legend{font-weight:700;margin-bottom:6px}
.opt{display:flex;gap:12px;align-items:center;padding:12px;border:2px solid var(--line);border-radius:12px;margin:6px 0;font-weight:600;cursor:pointer}.opt input{width:22px;height:22px}
button.go{width:100%;padding:18px;border:0;border-radius:14px;background:var(--blue);color:#fff;font:700 20px system-ui;cursor:pointer;margin-top:8px}
#msg{display:none;padding:14px;border-radius:12px;font-weight:600}#msg.ok{display:block;background:#dcfce7;color:#166534}#msg.err{display:block;background:#fee2e2;color:#b91c1c}
.note{background:#eff6ff;color:#1e3a8a;border-radius:12px;padding:12px;font-size:16px}.back{display:block;text-align:center;color:var(--muted);padding:10px}
</style>
</head>
<body>
<header><b id="title"></b><div class="lang"><button data-l="en">EN</button><button data-l="es">ES</button></div></header>
<main>
  <div id="msg" role="status"></div>
  <div class="card"><h2 id="h"></h2><p class="s" id="p"></p><div class="note" id="note"></div></div>
  <form class="card" id="f"></form>
  <a class="back" href="#" id="back"></a>
</main>
<script type="module">
import { auth, onAuthStateChanged } from './firebase-config.js';
const L = {
  en: { title: 'Voluntary self-identification', h: 'Tell us about yourself (optional)', p: 'The government asks employers to count their workforce. Answering is your choice and does not affect your job, pay or treatment in any way.', note: 'Your answers are kept apart from your personnel file. HR only ever sees totals for the whole company, never your individual answers.',
    sex: 'Sex', hispanic: 'Are you Hispanic or Latino?', races: 'Race (choose all that apply)', veteran: 'Protected veteran status', disability: 'Disability', yes: 'Yes', no: 'No', declined: 'I do not want to answer', male: 'Male', female: 'Female', non_binary: 'Non-binary',
    white: 'White', black: 'Black or African American', asian: 'Asian', nhopi: 'Native Hawaiian or Other Pacific Islander', aian: 'American Indian or Alaska Native', protected_veteran: 'I am a protected veteran', not_protected_veteran: 'I am not a protected veteran',
    agree: 'I understand this is voluntary.', send: 'Save my answers', done: 'Thank you. Your answers are saved.', already: 'You answered on {d}. You can answer again to change them.', back: 'Back', fail: 'Could not save. Please try again.' },
  es: { title: 'Autoidentificación voluntaria', h: 'Cuéntenos sobre usted (opcional)', p: 'El gobierno pide a los empleadores contar a su personal. Responder es su decisión y no afecta su trabajo, pago ni trato de ninguna manera.', note: 'Sus respuestas se guardan aparte de su expediente. Recursos Humanos solo ve totales de toda la empresa, nunca sus respuestas individuales.',
    sex: 'Sexo', hispanic: '¿Es hispano o latino?', races: 'Raza (elija todas las que apliquen)', veteran: 'Condición de veterano protegido', disability: 'Discapacidad', yes: 'Sí', no: 'No', declined: 'Prefiero no responder', male: 'Masculino', female: 'Femenino', non_binary: 'No binario',
    white: 'Blanco', black: 'Negro o afroamericano', asian: 'Asiático', nhopi: 'Nativo de Hawái u otras islas del Pacífico', aian: 'Indígena americano o nativo de Alaska', protected_veteran: 'Soy veterano protegido', not_protected_veteran: 'No soy veterano protegido',
    agree: 'Entiendo que esto es voluntario.', send: 'Guardar mis respuestas', done: 'Gracias. Sus respuestas están guardadas.', already: 'Respondió el {d}. Puede responder de nuevo para cambiarlas.', back: 'Volver', fail: 'No se pudo guardar. Intente de nuevo.' }
};
let lang = (navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en'; try { lang = localStorage.getItem('kylrx_lang') || lang; } catch (_) {}
const $ = (id) => document.getElementById(id); const tr = (k) => L[lang][k] || k; let answered = null;
const radios = (name, values) => values.map((v) => `<label class="opt"><input type="radio" name="${name}" value="${v}">${tr(v)}</label>`).join('');
function show(kind, text) { const m = $('msg'); m.textContent = text; m.className = kind; window.scrollTo({ top: 0, behavior: 'smooth' }); }
async function api(method, path, body) { const token = await auth.currentUser.getIdToken(); const res = await fetch(`/api/us/eeo${path}`, { method, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }, body: body ? JSON.stringify(body) : undefined }); const j = await res.json().catch(() => ({})); if (!res.ok) throw new Error((j.errors && j.errors.join('\n')) || j.error || tr('fail')); return j; }
function paint() {
  document.documentElement.lang = lang; document.title = tr('title'); $('title').textContent = tr('title'); $('h').textContent = tr('h'); $('p').textContent = tr('p'); $('note').textContent = tr('note'); $('back').textContent = tr('back');
  document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.l === lang));
  const keep = Object.fromEntries(new FormData($('f')).entries());
  $('f').innerHTML = `${answered ? `<p class="s">${tr('already').replace('{d}', String(answered).slice(0, 10))}</p>` : ''}
    <fieldset><legend>${tr('sex')}</legend>${radios('sex', ['male', 'female', 'non_binary', 'declined'])}</fieldset>
    <fieldset><legend>${tr('hispanic')}</legend>${radios('hispanic', ['yes', 'no', 'declined'])}</fieldset>
    <fieldset><legend>${tr('races')}</legend>${['white', 'black', 'asian', 'nhopi', 'aian'].map((r) => `<label class="opt"><input type="checkbox" name="races" value="${r}">${tr(r)}</label>`).join('')}</fieldset>
    <fieldset><legend>${tr('veteran')}</legend>${radios('veteran', ['protected_veteran', 'not_protected_veteran', 'declined'])}</fieldset>
    <fieldset><legend>${tr('disability')}</legend>${radios('disability', ['yes', 'no', 'declined'])}</fieldset>
    <label class="opt"><input type="checkbox" name="agree">${tr('agree')}</label><button class="go" type="submit">${tr('send')}</button>`;
  for (const [k, v] of Object.entries(keep)) { const el = $('f').querySelector(`[name="${k}"][value="${v}"]`); if (el) el.checked = true; }
}
$('f').addEventListener('submit', async (e) => {
  e.preventDefault(); const f = e.target; const val = (n) => (f.querySelector(`[name="${n}"]:checked`) || {}).value;
  try { await api('PUT', '/me', { voluntaryNoticeAccepted: f.agree.checked, sex: val('sex'), hispanic: val('hispanic'), races: [...f.querySelectorAll('[name=races]:checked')].map((c) => c.value), veteran: val('veteran'), disability: val('disability') }); show('ok', tr('done')); answered = new Date().toISOString(); paint(); }
  catch (err) { show('err', err.message); }
});
$('back').onclick = (e) => { e.preventDefault(); if (history.length > 1) history.back(); else location.href = 'punch.html'; };
document.querySelectorAll('.lang button').forEach((b) => { b.onclick = () => { lang = b.dataset.l; try { localStorage.setItem('kylrx_lang', lang); } catch (_) {} paint(); }; });
paint();
onAuthStateChanged(auth, async (user) => { if (!user) { window.location.replace('login.html'); return; } try { const r = await api('GET', '/me'); answered = r.answered ? r.answeredAt : null; paint(); } catch (_) {} });
</script>
</body>
</html>
