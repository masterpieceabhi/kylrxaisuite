<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My benefits | Kylrx AI</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--bg:#f8fafc;--ok:#166534;--bad:#b91c1c}
*{box-sizing:border-box}body{margin:0;font:18px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#fff;border-bottom:1px solid var(--line);gap:8px}
h1{margin:0;font-size:22px}h2{margin:0 0 10px;font-size:19px}h3{margin:0 0 6px;font-size:17px}
.lang button{padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}.lang button.on{background:var(--ink);color:#fff}
main{max-width:560px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.item{border-top:1px solid var(--line);padding:12px 0}.item:first-child{border-top:0;padding-top:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:16px}.kv span:first-child{color:var(--muted)}
.big{font-size:28px;font-weight:800}.hint{color:var(--muted);font-size:15px}
label{display:grid;gap:4px;font-size:15px;color:var(--muted);font-weight:600;margin:10px 0}
input,select,textarea{padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;width:100%;color:var(--ink);background:#fff}
button.go{padding:12px 16px;border:0;border-radius:10px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button.soft{padding:10px 14px;border:0;border-radius:10px;background:#eef2ff;color:var(--blue);font:inherit;font-size:16px;font-weight:700;cursor:pointer}
button.no{padding:8px 12px;border:0;border-radius:10px;background:#fee2e2;color:var(--bad);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.tag{padding:2px 10px;border-radius:999px;font-size:14px;font-weight:700}.good{background:#dcfce7;color:var(--ok)}.wait{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:var(--bad)}.grey{background:#e2e8f0;color:#475569}
.window{background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:12px}
.dep{border:1px dashed #cbd5e1;border-radius:10px;padding:10px;margin-top:8px}
#msg{display:none;border-radius:10px;padding:12px}#msg.ok{display:block;background:#dcfce7;color:var(--ok)}#msg.err{display:block;background:#fee2e2;color:var(--bad)}
a.back{display:block;text-align:center;color:var(--blue);font-weight:700;padding:14px;text-decoration:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1 data-t="title"></h1><div class="lang"><button data-l="en">English</button> <button data-l="es">Español</button></div></header>
<main>
  <div id="msg" role="status"></div>
  <section class="card"><h2 data-t="now"></h2><div id="nowBox"></div></section>
  <section class="card" id="winCard"><h2 data-t="change"></h2><div id="winBox"></div></section>
  <section class="card" id="formCard" hidden>
    <h2 data-t="choose"></h2>
    <p class="hint" data-t="chooseHint"></p>
    <div id="planBox"></div>
    <div class="row"><button class="go" id="enrollGo" data-t="saveChoices"></button><button class="soft" id="enrollCancel" data-t="cancel"></button></div>
  </section>
  <section class="card">
    <h2 data-t="life"></h2>
    <p class="hint" data-t="lifeHint"></p>
    <div id="lifeList"></div>
    <form id="lifeForm">
      <label><span data-t="what"></span><select name="typeKey" id="lifeType"></select></label>
      <label><span data-t="when"></span><input name="eventDate" type="date" required></label>
      <label><span id="proofLabel"></span><input name="proof" type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png"></label>
      <label><span data-t="noteOpt"></span><input name="note" maxlength="300"></label>
      <button class="go" type="submit" data-t="tellHr"></button>
    </form>
  </section>
  <a class="back" href="punch.html" data-t="back"></a>
</main>
<script type="module">
import { auth, onAuthStateChanged } from './firebase-config.js';
const $ = (id) => document.getElementById(id);
const T = {
  en: {
    title: 'My benefits', back: 'Back to the clock', now: 'What I have now', nothing: 'You are not enrolled in any benefits.', perCheck: 'Taken from each paycheck', company: 'Your employer also pays', declined: 'Declined', since: 'Since {d}', covers: 'Covers: {n}',
    change: 'Changing my benefits', closed: 'You cannot change your benefits right now. You can change them during open enrollment, or after a life event such as a marriage or a new baby (tell HR below).', w_open_enrollment: 'Open enrollment', w_new_hire: 'New-hire enrollment', w_life_event: 'Change after your life event', until: 'Open until {d}. Your choices start on {s}.', start: 'Choose my benefits',
    choose: 'My choices', chooseHint: 'Pick what you want for each plan. Plans you leave on "Keep as it is" do not change.', keep: 'Keep as it is', join: 'Enroll', decline: 'Decline', whyDecline: 'Why are you declining? (for example: covered by my spouse)', level: 'Who is covered', cost: '{e} from each paycheck. Your employer pays {c}.', notYet: 'You cannot join this plan yet: {r}', pct: 'Percent of each paycheck (0 to {m})', kind: 'Kind', pre: 'Before tax', roth: 'Roth (after tax)', yearAmt: 'Amount for the whole year ($)',
    addDep: 'Add a family member', dep: 'Family member', first: 'First name', last: 'Last name', rel: 'Relationship', spouse: 'Spouse', domestic_partner: 'Domestic partner', child: 'Child', dob: 'Date of birth', ssn: 'Social Security number (optional)', remove: 'Remove', saveChoices: 'Save my choices', cancel: 'Cancel', saved: 'Saved. Your choices start on {d}.', pickOne: 'Change at least one plan first.',
    life: 'Something changed in my life', lifeHint: 'Tell HR about a marriage, a new baby, losing other coverage and similar events. You have a limited number of days after the event.', what: 'What happened', when: 'Date it happened', proof: 'Proof (PDF or photo): {h}', proofOpt: 'Proof (optional, PDF or photo)', noteOpt: 'Note (optional)', tellHr: 'Tell HR', sent: 'Sent to HR. You can change your benefits after HR approves it.',
    s_pending: 'Waiting for HR', s_approved: 'Approved', s_rejected: 'Not approved', hr: 'HR said:', fail: 'Could not load your benefits. Try again.', noRecord: 'Benefits are not set up for your login. Ask HR.',
    t_employee_only: 'Just me', t_employee_spouse: 'Me and my spouse', t_employee_children: 'Me and my children', t_family: 'My whole family',
    f_weekly: 'week', f_biweekly: 'two weeks', f_semimonthly: 'half month', f_monthly: 'month'
  },
  es: {
    title: 'Mis beneficios', back: 'Volver al reloj', now: 'Lo que tengo ahora', nothing: 'Usted no está inscrito en ningún beneficio.', perCheck: 'Se descuenta de cada pago', company: 'Su empleador también paga', declined: 'Rechazado', since: 'Desde el {d}', covers: 'Cubre a: {n}',
    change: 'Cambiar mis beneficios', closed: 'Ahora no puede cambiar sus beneficios. Puede cambiarlos durante la inscripción abierta, o después de un evento de vida como un matrimonio o un bebé (avise a Recursos Humanos abajo).', w_open_enrollment: 'Inscripción abierta', w_new_hire: 'Inscripción de nuevo empleado', w_life_event: 'Cambio por su evento de vida', until: 'Abierto hasta el {d}. Sus opciones empiezan el {s}.', start: 'Elegir mis beneficios',
    choose: 'Mis opciones', chooseHint: 'Elija lo que quiere en cada plan. Los planes que deje en "Dejar como está" no cambian.', keep: 'Dejar como está', join: 'Inscribirme', decline: 'Rechazar', whyDecline: '¿Por qué lo rechaza? (por ejemplo: me cubre mi cónyuge)', level: 'A quién cubre', cost: '{e} de cada pago. Su empleador paga {c}.', notYet: 'Todavía no puede entrar a este plan: {r}', pct: 'Porcentaje de cada pago (0 a {m})', kind: 'Tipo', pre: 'Antes de impuestos', roth: 'Roth (después de impuestos)', yearAmt: 'Cantidad para todo el año ($)',
    addDep: 'Agregar un familiar', dep: 'Familiar', first: 'Nombre', last: 'Apellido', rel: 'Relación', spouse: 'Cónyuge', domestic_partner: 'Pareja doméstica', child: 'Hijo o hija', dob: 'Fecha de nacimiento', ssn: 'Número de Seguro Social (opcional)', remove: 'Quitar', saveChoices: 'Guardar mis opciones', cancel: 'Cancelar', saved: 'Guardado. Sus opciones empiezan el {d}.', pickOne: 'Cambie al menos un plan primero.',
    life: 'Algo cambió en mi vida', lifeHint: 'Avise a Recursos Humanos de un matrimonio, un bebé, la pérdida de otra cobertura y eventos parecidos. Tiene un número limitado de días después del evento.', what: 'Qué pasó', when: 'Fecha en que pasó', proof: 'Prueba (PDF o foto): {h}', proofOpt: 'Prueba (opcional, PDF o foto)', noteOpt: 'Nota (opcional)', tellHr: 'Avisar a Recursos Humanos', sent: 'Enviado a Recursos Humanos. Podrá cambiar sus beneficios cuando lo aprueben.',
    s_pending: 'Esperando a Recursos Humanos', s_approved: 'Aprobado', s_rejected: 'No aprobado', hr: 'Recursos Humanos dijo:', fail: 'No se pudieron cargar sus beneficios. Intente de nuevo.', noRecord: 'Los beneficios no están configurados para su usuario. Pregunte a Recursos Humanos.',
    t_employee_only: 'Solo yo', t_employee_spouse: 'Mi cónyuge y yo', t_employee_children: 'Mis hijos y yo', t_family: 'Toda mi familia',
    f_weekly: 'semana', f_biweekly: 'dos semanas', f_semimonthly: 'quincena', f_monthly: 'mes'
  }
};
const HEALTH = ['medical', 'dental', 'vision']; const FLAT = ['life', 'disability']; const PPY = { weekly: 52, biweekly: 26, semimonthly: 24, monthly: 12 };
let lang = (navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en';
try { lang = localStorage.getItem('kylrx_lang') || lang; } catch (_) {}
if (!T[lang]) lang = 'en';
const tr = (k, v = {}) => (T[lang][k] ?? T.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const say = (t, ok = true) => { const m = $('msg'); m.textContent = t; m.className = ok ? 'ok' : 'err'; window.scrollTo({ top: 0, behavior: 'smooth' }); };
const money = (n) => `$${Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
const day = (d) => (d ? new Date(`${d}T12:00:00`).toLocaleDateString(lang === 'es' ? 'es-US' : 'en-US', { dateStyle: 'long' }) : '');
let data = null; let win = null; // win: the enrollment window the form is open for

async function req(method, path, body, form) {
  const token = await auth.currentUser.getIdToken();
  const res = await fetch(`/api/us/benefits${path}`, { method, headers: { ...(form ? {} : { 'Content-Type': 'application/json' }), Authorization: `Bearer ${token}` }, body: form || (body ? JSON.stringify(body) : undefined) });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error((json.errors && json.errors.join('; ')) || (typeof json.error === 'string' ? json.error : '') || `Request failed (${res.status})`); e.status = res.status; throw e; }
  return json;
}
/** A plan's cost for this person's own pay frequency */
const perCheck = (plan, tier) => { const c = plan.costs && plan.costs[tier]; const ppy = PPY[data.payFrequency]; if (!c || !ppy) return null; return { e: (c.employee * plan.payPeriodsPerYear) / ppy, c: (c.employer * plan.payPeriodsPerYear) / ppy }; };

function paintStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = tr(el.dataset.t); });
  document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.l === lang));
}
function paint() {
  paintStatic(); if (!data) return;
  const en = data.enrollment; const lines = Object.fromEntries(data.perPayPeriod.lines.map((l) => [l.planId, l]));
  $('nowBox').innerHTML = en ? `<div class="kv"><span>${esc(tr('perCheck'))}</span><b class="big">${money(data.perPayPeriod.employee)}</b></div><div class="kv"><span>${esc(tr('company'))}</span><b>${money(data.perPayPeriod.employer)}</b></div><p class="hint">${esc(tr('since', { d: day(en.effectiveDate) }))}</p>` + en.elections.map((e) => { const l = lines[e.planId]; return `<div class="item"><b>${esc(e.planName)}</b> ${e.waived ? `<span class="tag grey">${esc(tr('declined'))}</span>` : ''}${e.waived ? '' : `<div class="kv"><span>${esc(e.tier ? tr(`t_${e.tier}`) : e.deferralPercent !== null ? `${e.deferralPercent}%` : e.annualAmount !== null ? money(e.annualAmount) : '')}</span><b>${l ? money(l.employeeAmount) : ''}</b></div>${e.dependents.length ? `<span class="hint">${esc(tr('covers', { n: e.dependents.map((d) => `${d.firstName} ${d.lastName}`).join(', ') }))}</span>` : ''}`}</div>`; }).join('') : `<p class="hint">${esc(tr('nothing'))}</p>`;
  $('winBox').innerHTML = data.windows.length ? data.windows.map((w, i) => `<div class="window" style="margin-bottom:8px"><b>${esc(tr(`w_${w.type}`))}</b><br><span class="hint">${esc(tr('until', { d: day(w.end), s: day(w.effectiveDate) }))}</span><div class="row"><button class="go" data-win="${i}">${esc(tr('start'))}</button></div></div>`).join('') : `<p class="hint">${esc(tr('closed'))}</p>`;
  const st = { pending: 'wait', approved: 'good', rejected: 'bad' };
  $('lifeList').innerHTML = data.lifeEvents.slice(0, 5).map((e) => `<div class="item"><b>${esc(lang === 'es' ? (data.lifeEventTypes.find((t) => t.key === e.typeKey) || {}).labelEs || e.typeLabel : e.typeLabel)}</b> <span class="tag ${st[e.status] || 'grey'}">${esc(tr(`s_${e.status}`))}</span><br><span class="hint">${esc(day(e.eventDate))}${e.decisionNote ? ` · ${esc(tr('hr'))} ${esc(e.decisionNote)}` : ''}</span></div>`).join('');
  const keep = $('lifeType').value;
  $('lifeType').innerHTML = data.lifeEventTypes.map((t) => `<option value="${esc(t.key)}">${esc(lang === 'es' ? t.labelEs || t.label : t.label)}</option>`).join(''); if (keep) $('lifeType').value = keep;
  paintProof();
}
function paintProof() { const t = data.lifeEventTypes.find((x) => x.key === $('lifeType').value); $('proofLabel').textContent = t && t.requiresProof ? tr('proof', { h: t.proofHint || '' }) : tr('proofOpt'); }
$('lifeType').addEventListener('change', paintProof);

// ------------------------------------------------------------ choosing plans
function depHtml() { return `<div class="dep" data-dep><b>${esc(tr('dep'))}</b><label>${esc(tr('first'))}<input data-d="firstName" maxlength="60"></label><label>${esc(tr('last'))}<input data-d="lastName" maxlength="60"></label><label>${esc(tr('rel'))}<select data-d="relationship"><option value="spouse">${esc(tr('spouse'))}</option><option value="domestic_partner">${esc(tr('domestic_partner'))}</option><option value="child">${esc(tr('child'))}</option></select></label><label>${esc(tr('dob'))}<input data-d="dateOfBirth" type="date"></label><label>${esc(tr('ssn'))}<input data-d="ssn" inputmode="numeric" autocomplete="off" maxlength="11"></label><button type="button" class="no" data-deprm="1">${esc(tr('remove'))}</button></div>`; }
function openForm(w) {
  win = w; $('formCard').hidden = false;
  const el = Object.fromEntries(data.eligibility.map((e) => [e.planId, e]));
  $('planBox').innerHTML = data.plans.map((p) => {
    const e = el[p.id] || { reasons: [] };
    const blocked = (e.reasons || []).filter((r) => !/^Waiting period ends/.test(r) || (e.eligibleOn && e.eligibleOn > w.effectiveDate));
    let detail = '';
    if (HEALTH.includes(p.type)) detail = `<label>${esc(tr('level'))}<select data-f="tier">${Object.keys(p.costs || {}).map((t) => `<option value="${t}">${esc(tr(`t_${t}`))}</option>`).join('')}</select></label><p class="hint" data-costline></p><div data-deps></div><button type="button" class="soft" data-depadd="1">${esc(tr('addDep'))}</button>`;
    else if (FLAT.includes(p.type)) detail = '<p class="hint" data-costline></p>';
    else if (p.type === '401k') detail = `<label>${esc(tr('pct', { m: p.maxPercent }))}<input data-f="pct" type="number" min="0" max="${esc(p.maxPercent)}" step="0.5" inputmode="decimal"></label>${p.allowRoth ? `<label>${esc(tr('kind'))}<select data-f="kind"><option value="pre_tax">${esc(tr('pre'))}</option><option value="roth">${esc(tr('roth'))}</option></select></label>` : ''}`;
    else detail = `<label>${esc(tr('yearAmt'))}<input data-f="amt" type="number" min="0" step="1" inputmode="decimal"></label>`;
    return `<div class="item" data-plan="${esc(p.id)}"><h3>${esc(p.name)}</h3>${p.carrier ? `<span class="hint">${esc(p.carrier)}</span>` : ''}${blocked.length ? `<p class="hint">${esc(tr('notYet', { r: blocked.join('; ') }))}</p>` : ''}<label><select data-f="choice"><option value="">${esc(tr('keep'))}</option>${blocked.length ? '' : `<option value="in">${esc(tr('join'))}</option>`}<option value="out">${esc(tr('decline'))}</option></select></label><div data-in hidden>${detail}</div><div data-out hidden><label>${esc(tr('whyDecline'))}<input data-f="why" maxlength="200"></label></div></div>`;
  }).join('');
  document.querySelectorAll('[data-plan]').forEach(costLine);
  $('formCard').scrollIntoView({ behavior: 'smooth' });
}
function costLine(box) {
  const p = data.plans.find((x) => x.id === box.dataset.plan); const line = box.querySelector('[data-costline]'); if (!line) return;
  const tierEl = box.querySelector('[data-f="tier"]'); const c = perCheck(p, tierEl ? tierEl.value : 'employee_only');
  line.textContent = c ? tr('cost', { e: money(c.e), c: money(c.c) }) : '';
}
$('planBox').addEventListener('change', (e) => {
  const box = e.target.closest('[data-plan]'); if (!box) return;
  if (e.target.dataset.f === 'choice') { box.querySelector('[data-in]').hidden = e.target.value !== 'in'; box.querySelector('[data-out]').hidden = e.target.value !== 'out'; }
  if (e.target.dataset.f === 'tier') costLine(box);
});
$('enrollCancel').addEventListener('click', () => { $('formCard').hidden = true; win = null; });
$('enrollGo').addEventListener('click', async () => {
  const elections = [];
  document.querySelectorAll('[data-plan]').forEach((box) => {
    const g = (k) => { const el = box.querySelector(`[data-f="${k}"]`); return el ? el.value : ''; }; const choice = g('choice'); if (!choice) return;
    const e = { planId: box.dataset.plan };
    if (choice === 'out') { e.waived = true; e.waiveReason = g('why'); } else {
      if (box.querySelector('[data-f="tier"]')) { e.tier = g('tier'); e.dependents = [...box.querySelectorAll('[data-dep]')].map((d) => Object.fromEntries([...d.querySelectorAll('[data-d]')].map((i) => [i.dataset.d, i.value.trim()]))); }
      if (box.querySelector('[data-f="pct"]')) { e.deferralPercent = Number(g('pct')); e.contributionType = g('kind') || 'pre_tax'; }
      if (box.querySelector('[data-f="amt"]')) e.annualAmount = Number(g('amt'));
    }
    elections.push(e);
  });
  if (!elections.length) { say(tr('pickOne'), false); return; }
  try {
    const r = await req('POST', '/me/enroll', { windowType: win.type, eventId: win.eventId, elections });
    $('formCard').hidden = true; win = null; await load(); say(tr('saved', { d: day(r.enrollment.effectiveDate) }));
  } catch (err) { say(err.message, false); }
});
$('lifeForm').addEventListener('submit', async (e) => {
  e.preventDefault(); const f = e.target.elements; const fd = new FormData();
  fd.append('typeKey', f.typeKey.value); fd.append('eventDate', f.eventDate.value); fd.append('note', f.note.value); if (f.proof.files[0]) fd.append('proof', f.proof.files[0]);
  try { await req('POST', '/me/life-events', null, fd); e.target.reset(); await load(); say(tr('sent')); } catch (err) { say(err.message, false); }
});
document.addEventListener('click', (e) => {
  const el = (k) => e.target.closest(`[data-${k}]`);
  let t;
  if ((t = el('l'))) { lang = t.dataset.l; try { localStorage.setItem('kylrx_lang', lang); } catch (_) {} const w = win; paint(); if (w) openForm(w); } else if ((t = el('win'))) openForm(data.windows[Number(t.dataset.win)]);
  else if ((t = el('depadd'))) t.closest('[data-plan]').querySelector('[data-deps]').insertAdjacentHTML('beforeend', depHtml());
  else if ((t = el('deprm'))) t.closest('[data-dep]').remove();
});
async function load() { data = await req('GET', '/me'); paint(); }
paintStatic();
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'login.html'; return; }
  try { await load(); } catch (err) { say(tr(err.status === 404 ? 'noRecord' : 'fail'), false); }
});
</script>
</body>
</html>
