<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My equipment | Kylrx AI</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--bg:#f8fafc;--ok:#166534;--bad:#b91c1c}
*{box-sizing:border-box}body{margin:0;font:18px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#fff;border-bottom:1px solid var(--line);gap:8px}
h1{margin:0;font-size:22px}h2{margin:0 0 4px;font-size:19px}
.lang button{padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}.lang button.on{background:var(--ink);color:#fff}
main{max-width:560px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.hint{color:var(--muted);font-size:15px}.pre{white-space:pre-wrap}
label{display:grid;gap:4px;font-size:15px;color:var(--muted);font-weight:600;margin:10px 0}
textarea{padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;width:100%;min-height:80px;color:var(--ink);background:#fff}
button.go{padding:12px 16px;border:0;border-radius:10px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button.soft{padding:10px 14px;border:0;border-radius:10px;background:#eef2ff;color:var(--blue);font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.tag{padding:2px 10px;border-radius:999px;font-size:14px;font-weight:700}.good{background:#dcfce7;color:var(--ok)}.wait{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:var(--bad)}
#msg{display:none;border-radius:10px;padding:12px}#msg.ok{display:block;background:#dcfce7;color:var(--ok)}#msg.err{display:block;background:#fee2e2;color:var(--bad)}
a.back{display:block;text-align:center;color:var(--blue);font-weight:700;padding:14px;text-decoration:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1 data-t="title"></h1><div class="lang"><button data-l="en">English</button> <button data-l="es">Español</button></div></header>
<main>
  <div id="msg" role="status"></div>
  <p class="hint" data-t="intro" style="margin:0"></p>
  <div id="list"></div>
  <a class="back" href="punch.html" data-t="back"></a>
</main>
<script type="module">
import { auth, onAuthStateChanged } from './firebase-config.js';
const $ = (id) => document.getElementById(id);
const T = {
  en: { title: 'My equipment', back: 'Back to the clock', intro: 'These are the company items recorded as being with you. Please give them back when asked, or when you leave.', none: 'No company equipment is recorded as being with you.', since: 'With you since {d}', due: 'Due back {d}', late: 'late', tagNo: 'Tag {t}', serial: 'Serial {s}', confirm: 'Yes, I have this', confirmed: 'You confirmed this on {d}', toConfirm: 'Please confirm', okConfirm: 'Thank you. It is confirmed.', report: 'Something is wrong with it', what: 'What is wrong? (lost, broken, missing a part, not mine)', send: 'Tell HR', sent: 'Thank you. HR has been told.', reported: 'You reported on {d}:', fail: 'Could not load. Try again.',
        c: {} },
  es: { title: 'Mi equipo', back: 'Volver al reloj', intro: 'Estos son los artículos de la empresa registrados a su nombre. Por favor devuélvalos cuando se los pidan, o cuando deje la empresa.', none: 'No hay equipo de la empresa registrado a su nombre.', since: 'Con usted desde el {d}', due: 'Devolver antes del {d}', late: 'atrasado', tagNo: 'Etiqueta {t}', serial: 'Serie {s}', confirm: 'Sí, lo tengo', confirmed: 'Usted lo confirmó el {d}', toConfirm: 'Por favor confirme', okConfirm: 'Gracias. Quedó confirmado.', report: 'Hay un problema con esto', what: '¿Cuál es el problema? (perdido, roto, le falta una pieza, no es mío)', send: 'Avisar a Recursos Humanos', sent: 'Gracias. Recursos Humanos ya fue avisado.', reported: 'Usted reportó el {d}:', fail: 'No se pudo cargar. Intente de nuevo.',
        c: { 'Laptop or computer': 'Computadora', Phone: 'Teléfono', Tablet: 'Tableta', Keys: 'Llaves', 'Badge or access card': 'Gafete o tarjeta de acceso', Uniform: 'Uniforme', Tools: 'Herramientas', Vehicle: 'Vehículo', 'Company card': 'Tarjeta de la empresa', Other: 'Otro' } }
};
let lang = (navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en';
try { lang = localStorage.getItem('kylrx_lang') || lang; } catch (_) {}
if (!T[lang]) lang = 'en';
const tr = (k, v = {}) => (T[lang][k] ?? T.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const say = (t, ok = true) => { const m = $('msg'); m.textContent = t; m.className = ok ? 'ok' : 'err'; window.scrollTo({ top: 0, behavior: 'smooth' }); };
// A plain date (2026-11-01) is shown as that day; a full timestamp is shown as the viewer's local day, not the UTC day
const day = (d) => (d ? new Date(String(d).length > 10 ? d : `${d}T12:00:00`).toLocaleDateString(lang === 'es' ? 'es-US' : 'en-US', { dateStyle: 'long' }) : '');
let items = null; const openBox = new Set();

async function req(method, path, body) {
  const res = await fetch(`/api/us/assets${path}`, { method, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${await auth.currentUser.getIdToken()}` }, body: body ? JSON.stringify(body) : undefined });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((json.errors && json.errors.join('; ')) || (typeof json.error === 'string' ? json.error : '') || `Request failed (${res.status})`);
  return json;
}
function paint() {
  const typed = Object.fromEntries([...document.querySelectorAll('textarea[data-text]')].map((el) => [el.dataset.text, el.value]));
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = tr(el.dataset.t); });
  document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.l === lang));
  if (!items) return;
  $('list').innerHTML = items.map((a) => `<section class="card"><h2>${esc(a.name)} ${a.acknowledgedAt ? '' : `<span class="tag wait">${esc(tr('toConfirm'))}</span>`}</h2>
    <p class="hint" style="margin:0">${esc([T[lang].c[a.category] || a.category, a.tag && tr('tagNo', { t: a.tag }), a.serial && tr('serial', { s: a.serial })].filter(Boolean).join(' · '))}</p>
    <p style="margin:8px 0 0">${esc(tr('since', { d: day(a.assignedAt) }))}${a.dueBack ? `<br>${esc(tr('due', { d: day(a.dueBack) }))}${a.overdue ? ` <span class="tag bad">${esc(tr('late'))}</span>` : ''}` : ''}</p>
    ${a.acknowledgedAt ? `<p class="hint" style="margin:8px 0 0">${esc(tr('confirmed', { d: day(a.acknowledgedAt) }))}</p>` : ''}
    ${a.problem ? `<p class="hint" style="margin:8px 0 0">${esc(tr('reported', { d: day(a.problem.at) }))}</p><p class="pre" style="margin:2px 0 0">${esc(a.problem.text)}</p>` : ''}
    <div class="row">${a.acknowledgedAt ? '' : `<button class="go" data-ack="${esc(a.id)}">${esc(tr('confirm'))}</button>`}<button class="soft" data-toggle="${esc(a.id)}">${esc(tr('report'))}</button></div>
    <form data-problem="${esc(a.id)}"${openBox.has(a.id) ? '' : ' hidden'}><label>${esc(tr('what'))}<textarea data-text="${esc(a.id)}" required minlength="5" maxlength="500"></textarea></label><button class="go" type="submit">${esc(tr('send'))}</button></form>
  </section>`).join('') || `<section class="card"><p class="hint" style="margin:0">${esc(tr('none'))}</p></section>`;
  for (const [id, v] of Object.entries(typed)) { const el = document.querySelector(`textarea[data-text="${CSS.escape(id)}"]`); if (el) el.value = v; }
}
async function load() { items = (await req('GET', '/mine')).data; paint(); }
document.addEventListener('click', async (e) => {
  let t;
  try {
    if ((t = e.target.closest('[data-l]'))) { lang = t.dataset.l; try { localStorage.setItem('kylrx_lang', lang); } catch (_) {} paint(); }
    else if ((t = e.target.closest('[data-toggle]'))) { const id = t.dataset.toggle; if (openBox.has(id)) openBox.delete(id); else openBox.add(id); paint(); if (openBox.has(id)) document.querySelector(`textarea[data-text="${CSS.escape(id)}"]`).focus(); }
    else if ((t = e.target.closest('[data-ack]'))) { t.disabled = true; await req('POST', `/${t.dataset.ack}/acknowledge`, {}); await load(); say(tr('okConfirm')); }
  } catch (err) { say(err.message, false); }
});
document.addEventListener('submit', async (e) => {
  const f = e.target.closest('form[data-problem]'); if (!f) return;
  e.preventDefault(); const id = f.dataset.problem;
  try { await req('POST', `/${id}/problem`, { text: f.querySelector('textarea').value }); openBox.delete(id); f.querySelector('textarea').value = ''; await load(); say(tr('sent')); } catch (err) { say(err.message, false); }
});
paint();
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'login.html'; return; }
  try { await load(); } catch (_) { say(tr('fail'), false); }
});
</script>
</body>
</html>
