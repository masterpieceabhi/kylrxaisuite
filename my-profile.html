<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My details | Kylrx AI</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--bg:#f8fafc;--ok:#166534;--bad:#b91c1c}
*{box-sizing:border-box}body{margin:0;font:18px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#fff;border-bottom:1px solid var(--line);gap:8px}
h1{margin:0;font-size:22px}h2{margin:0 0 10px;font-size:19px}
.lang button{padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}.lang button.on{background:var(--ink);color:#fff}
main{max-width:560px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:grid;gap:4px;font-size:15px;color:var(--muted);font-weight:600;margin-bottom:10px}
input,select{padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;width:100%;color:var(--ink);background:#fff}
button.go{padding:12px 16px;border:0;border-radius:10px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button.soft{padding:10px 14px;border:0;border-radius:10px;background:#eef2ff;color:var(--blue);font:inherit;font-weight:700;cursor:pointer}
button.no{padding:10px 14px;border:0;border-radius:10px;background:#fee2e2;color:var(--bad);font:inherit;font-weight:700;cursor:pointer}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:16px}.kv span:first-child{color:var(--muted)}.kv:last-of-type{border-bottom:0}
.hint{color:var(--muted);font-size:15px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tag{padding:2px 10px;border-radius:999px;font-size:14px;font-weight:700}.good{background:#dcfce7;color:var(--ok)}.wait{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:var(--bad)}.grey{background:#e2e8f0;color:#475569}
#msg{display:none;border-radius:10px;padding:12px}#msg.ok{display:block;background:#dcfce7;color:var(--ok)}#msg.err{display:block;background:#fee2e2;color:var(--bad)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--ink);font-weight:500}.chk input{width:22px;height:22px;flex:none;margin-top:2px}
.item{border-top:1px solid var(--line);padding:10px 0}.item:first-child{border-top:0}
a.back{display:block;text-align:center;color:var(--blue);font-weight:700;padding:14px;text-decoration:none}
form[hidden]{display:none}
</style>
</head>
<body>
<header><h1 data-t="title"></h1><div class="lang"><button data-l="en">English</button> <button data-l="es">Español</button></div></header>
<main>
  <div id="msg" role="status"></div>

  <section class="card">
    <h2 data-t="basics"></h2>
    <form id="basicForm">
      <label><span data-t="preferred"></span><input name="preferredName" maxlength="60" autocomplete="nickname"></label>
      <label><span data-t="phone"></span><input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(555) 555-1234"></label>
      <label><span data-t="marital"></span><select name="maritalStatus" id="marital"></select></label>
      <button class="go" type="submit" data-t="save"></button>
    </form>
  </section>

  <section class="card">
    <h2 data-t="contacts"></h2>
    <p class="hint" data-t="contactsHint"></p>
    <div id="contactList"></div>
    <div class="row"><button class="soft" id="contactAdd" data-t="addContact"></button></div>
    <form id="contactForm" hidden style="margin-top:12px">
      <label><span data-t="cName"></span><input name="name" required maxlength="80"></label>
      <label><span data-t="cRel"></span><input name="relationship" required maxlength="40"></label>
      <label><span data-t="phone"></span><input name="phone" type="tel" inputmode="tel" required></label>
      <label><span data-t="cEmail"></span><input name="email" type="email"></label>
      <label class="chk"><input type="checkbox" name="isPrimary"> <span data-t="cPrimary"></span></label>
      <div class="row"><button class="go" type="submit" data-t="save"></button><button class="soft" type="button" id="contactCancel" data-t="cancel"></button></div>
    </form>
  </section>

  <section class="card">
    <h2 data-t="guarded"></h2>
    <p class="hint" data-t="guardedHint"></p>
    <div class="kv"><span data-t="legal"></span><b id="vLegal"></b></div>
    <div class="row"><button class="soft" data-open="legalForm" data-t="askChange"></button></div>
    <form id="legalForm" hidden style="margin-top:12px">
      <label><span data-t="first"></span><input name="legalFirstName" required maxlength="60"></label>
      <label><span data-t="middle"></span><input name="legalMiddleName" maxlength="60"></label>
      <label><span data-t="last"></span><input name="legalLastName" required maxlength="60"></label>
      <label><span data-t="reason"></span><input name="reason" required minlength="3" maxlength="500"></label>
      <div class="row"><button class="go" type="submit" data-t="send"></button><button class="soft" type="button" data-close="legalForm" data-t="cancel"></button></div>
    </form>

    <div class="kv" style="margin-top:14px"><span data-t="address"></span><b id="vAddress" style="text-align:right"></b></div>
    <div class="row"><button class="soft" data-open="addressForm" data-t="askChange"></button></div>
    <form id="addressForm" hidden style="margin-top:12px">
      <label><span data-t="street"></span><input name="line1" required autocomplete="address-line1"></label>
      <label><span data-t="unit"></span><input name="line2" autocomplete="address-line2"></label>
      <label><span data-t="city"></span><input name="city" required autocomplete="address-level2"></label>
      <label><span data-t="state"></span><input name="state" required maxlength="2" autocomplete="address-level1"></label>
      <label><span data-t="zip"></span><input name="zip" required inputmode="numeric" autocomplete="postal-code"></label>
      <label><span data-t="reason"></span><input name="reason" required minlength="3" maxlength="500"></label>
      <div class="row"><button class="go" type="submit" data-t="send"></button><button class="soft" type="button" data-close="addressForm" data-t="cancel"></button></div>
    </form>

    <div class="kv" style="margin-top:14px"><span data-t="bank"></span><b id="vBank" style="text-align:right"></b></div>
    <div class="row"><button class="soft" data-open="bankForm" data-t="askChange"></button></div>
    <form id="bankForm" hidden style="margin-top:12px" autocomplete="off">
      <p class="hint" data-t="bankHint"></p>
      <label><span data-t="bankName"></span><input name="bankName" required></label>
      <label><span data-t="routing"></span><input name="routingNumber" required inputmode="numeric" maxlength="9"></label>
      <label><span data-t="account"></span><input name="accountNumber" required inputmode="numeric" maxlength="17"></label>
      <label><span data-t="account2"></span><input name="accountNumber2" required inputmode="numeric" maxlength="17"></label>
      <label><span data-t="acctType"></span><select name="accountType"><option value="checking" data-t="checking"></option><option value="savings" data-t="savings"></option></select></label>
      <label><span data-t="reason"></span><input name="reason" required minlength="3" maxlength="500"></label>
      <label class="chk"><input type="checkbox" name="authorization" required> <span data-t="authorize"></span></label>
      <div class="row"><button class="go" type="submit" data-t="send"></button><button class="soft" type="button" data-close="bankForm" data-t="cancel"></button></div>
    </form>
  </section>

  <section class="card" id="extraCard" hidden>
    <h2 data-t="extra"></h2>
    <form id="extraForm"><div id="extraFields"></div><button class="go" type="submit" id="extraSave" data-t="save"></button></form>
  </section>

  <section class="card">
    <h2 data-t="requests"></h2>
    <div id="reqList"></div>
  </section>
  <a class="back" href="punch.html" data-t="back"></a>
</main>
<script type="module">
import { auth, onAuthStateChanged } from './firebase-config.js';
const $ = (id) => document.getElementById(id);
const T = {
  en: {
    title: 'My details', back: 'Back to the clock', basics: 'Name, phone and status', preferred: 'Name you like to be called', phone: 'Phone', marital: 'Marital status', save: 'Save', cancel: 'Cancel', saved: 'Saved.',
    contacts: 'Emergency contacts', contactsHint: 'Who we call if something happens to you at work.', addContact: 'Add a contact', cName: 'Full name', cRel: 'How you know them (wife, brother, friend)', cEmail: 'Email (optional)', cPrimary: 'Call this person first', noContacts: 'No emergency contacts yet.', first1: 'call first', edit: 'Edit', remove: 'Remove', removeAsk: 'Remove this contact?',
    guarded: 'Legal name, address and bank', guardedHint: 'HR checks these changes before they are saved, because they affect your pay and tax forms.', legal: 'Legal name', address: 'Home address', bank: 'Bank account for pay', askChange: 'Ask to change', none: 'Not on file',
    first: 'First name', middle: 'Middle name (optional)', last: 'Last name', street: 'Street address', unit: 'Apartment or unit (optional)', city: 'City', state: 'State (2 letters)', zip: 'ZIP code', reason: 'Why is this changing?', send: 'Send to HR',
    bankHint: 'Never send bank details by text or email. Enter them only here.', bankName: 'Bank name', routing: 'Routing number (9 digits)', account: 'Account number', account2: 'Account number again', acctType: 'Account type', checking: 'Checking', savings: 'Savings', authorize: 'I allow my employer to deposit my pay into this account.', mismatch: 'The two account numbers are not the same.',
    sent: 'Sent to HR. You will see the answer below.', applied: 'Saved. This change did not need a review.', extra: 'More about you', requests: 'My change requests', noReq: 'No requests yet.', cancelReq: 'Cancel request', cancelled: 'Request cancelled.',
    f_legalName: 'Legal name', f_homeAddress: 'Home address', f_bankDetails: 'Bank account', s_pending: 'Waiting for HR', s_approved: 'Approved', s_rejected: 'Not approved', s_cancelled: 'Cancelled', hrNote: 'HR said:', fail: 'Could not load your details. Try again.', yes: 'Yes', no: 'No', choose: 'Choose',
    m_: 'Choose', m_single: 'Single', m_married: 'Married', m_married_separate: 'Married, filing separately', m_head_of_household: 'Head of household', m_divorced: 'Divorced', m_widowed: 'Widowed', m_domestic_partner: 'Domestic partner', m_prefer_not_to_say: 'Prefer not to say'
  },
  es: {
    title: 'Mis datos', back: 'Volver al reloj', basics: 'Nombre, teléfono y estado', preferred: 'Nombre que prefiere usar', phone: 'Teléfono', marital: 'Estado civil', save: 'Guardar', cancel: 'Cancelar', saved: 'Guardado.',
    contacts: 'Contactos de emergencia', contactsHint: 'A quién llamamos si le pasa algo en el trabajo.', addContact: 'Agregar un contacto', cName: 'Nombre completo', cRel: 'Relación (esposa, hermano, amigo)', cEmail: 'Correo electrónico (opcional)', cPrimary: 'Llamar primero a esta persona', noContacts: 'Todavía no hay contactos de emergencia.', first1: 'llamar primero', edit: 'Editar', remove: 'Quitar', removeAsk: '¿Quitar este contacto?',
    guarded: 'Nombre legal, dirección y banco', guardedHint: 'Recursos Humanos revisa estos cambios antes de guardarlos, porque afectan su pago y sus formularios de impuestos.', legal: 'Nombre legal', address: 'Dirección de casa', bank: 'Cuenta de banco para su pago', askChange: 'Pedir un cambio', none: 'No registrado',
    first: 'Nombre', middle: 'Segundo nombre (opcional)', last: 'Apellido', street: 'Calle y número', unit: 'Apartamento o unidad (opcional)', city: 'Ciudad', state: 'Estado (2 letras)', zip: 'Código postal', reason: '¿Por qué cambia esto?', send: 'Enviar a Recursos Humanos',
    bankHint: 'Nunca envíe datos de banco por mensaje de texto o correo. Escríbalos solo aquí.', bankName: 'Nombre del banco', routing: 'Número de ruta (9 dígitos)', account: 'Número de cuenta', account2: 'Número de cuenta otra vez', acctType: 'Tipo de cuenta', checking: 'Cheques', savings: 'Ahorros', authorize: 'Autorizo a mi empleador a depositar mi pago en esta cuenta.', mismatch: 'Los dos números de cuenta no son iguales.',
    sent: 'Enviado a Recursos Humanos. Verá la respuesta abajo.', applied: 'Guardado. Este cambio no necesitó revisión.', extra: 'Más sobre usted', requests: 'Mis solicitudes de cambio', noReq: 'Todavía no hay solicitudes.', cancelReq: 'Cancelar solicitud', cancelled: 'Solicitud cancelada.',
    f_legalName: 'Nombre legal', f_homeAddress: 'Dirección de casa', f_bankDetails: 'Cuenta de banco', s_pending: 'Esperando a Recursos Humanos', s_approved: 'Aprobado', s_rejected: 'No aprobado', s_cancelled: 'Cancelado', hrNote: 'Recursos Humanos dijo:', fail: 'No se pudieron cargar sus datos. Intente de nuevo.', yes: 'Sí', no: 'No', choose: 'Elegir',
    m_: 'Elegir', m_single: 'Soltero/a', m_married: 'Casado/a', m_married_separate: 'Casado/a, declara por separado', m_head_of_household: 'Cabeza de familia', m_divorced: 'Divorciado/a', m_widowed: 'Viudo/a', m_domestic_partner: 'Pareja doméstica', m_prefer_not_to_say: 'Prefiero no decir'
  }
};
const MARITAL = ['', 'single', 'married', 'married_separate', 'head_of_household', 'divorced', 'widowed', 'domestic_partner', 'prefer_not_to_say'];
let lang = (navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en';
try { lang = localStorage.getItem('kylrx_lang') || lang; } catch (_) {}
if (!T[lang]) lang = 'en';
const tr = (k) => T[lang][k] ?? T.en[k] ?? k;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const say = (t, ok = true) => { const m = $('msg'); m.textContent = t; m.className = ok ? 'ok' : 'err'; window.scrollTo({ top: 0, behavior: 'smooth' }); };
let data = null; let contactEdit = null;

async function req(method, path, body) {
  const token = await auth.currentUser.getIdToken();
  const res = await fetch(`/api/us${path}`, { method, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }, body: body ? JSON.stringify(body) : undefined });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((json.errors && json.errors.join('; ')) || (typeof json.error === 'string' ? json.error : '') || `Request failed (${res.status})`);
  return json;
}
const addressText = (a) => (a ? `${[a.line1, a.line2].filter(Boolean).join(', ')}, ${a.city}, ${a.state} ${a.zip}` : tr('none'));
const bankText = (b) => (b ? `${b.bankName} ••••${b.accountLast4}` : tr('none'));
const changeText = (r, v) => {
  if (!v) return tr('none');
  if (r.field === 'legalName') return [v.legalFirstName, v.legalMiddleName, v.legalLastName].filter(Boolean).join(' ');
  return r.field === 'homeAddress' ? addressText(v) : bankText(v);
};
const stamp = (iso) => (iso ? new Date(iso).toLocaleDateString(lang === 'es' ? 'es-US' : 'en-US', { dateStyle: 'medium' }) : '');

function paintStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = tr(el.dataset.t); });
  document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.l === lang));
  const cur = $('marital').value;
  $('marital').innerHTML = MARITAL.map((m) => `<option value="${m}">${esc(tr(`m_${m}`))}</option>`).join(''); $('marital').value = cur;
}
function paint() {
  paintStatic(); if (!data) return;
  const p = data.profile;
  $('vLegal').textContent = [p.legalFirstName, p.legalMiddleName, p.legalLastName].filter(Boolean).join(' ') || p.name || tr('none');
  $('vAddress').textContent = addressText(p.homeAddress); $('vBank').textContent = bankText(p.bank);
  $('contactList').innerHTML = p.emergencyContacts.map((c) => `<div class="item"><b>${esc(c.name)}</b> ${c.isPrimary ? `<span class="tag good">${esc(tr('first1'))}</span>` : ''}<br><span class="hint">${esc(c.relationship)} · ${esc(c.phone)}${c.email ? ` · ${esc(c.email)}` : ''}</span><div class="row"><button class="soft" data-cedit="${esc(c.id)}">${esc(tr('edit'))}</button><button class="no" data-cdel="${esc(c.id)}">${esc(tr('remove'))}</button></div></div>`).join('') || `<p class="hint">${esc(tr('noContacts'))}</p>`;
  $('reqList').innerHTML = data.requests.map((r) => {
    const cls = { pending: 'wait', approved: 'good', rejected: 'bad', cancelled: 'grey' }[r.status] || 'grey';
    return `<div class="item"><b>${esc(tr(`f_${r.field}`))}</b> <span class="tag ${cls}">${esc(tr(`s_${r.status}`))}</span><br><span class="hint">${esc(stamp(r.createdAt))} · ${esc(changeText(r, r.after))}</span>${r.decisionNote && !r.autoApproved ? `<br><span class="hint">${esc(tr('hrNote'))} ${esc(r.decisionNote)}</span>` : ''}${r.status === 'pending' ? `<div class="row"><button class="no" data-rcancel="${esc(r.id)}">${esc(tr('cancelReq'))}</button></div>` : ''}</div>`;
  }).join('') || `<p class="hint">${esc(tr('noReq'))}</p>`;
  const fields = data.customFields || [];
  $('extraCard').hidden = fields.length === 0; $('extraSave').hidden = !fields.some((f) => f.canEdit);
  $('extraFields').innerHTML = fields.map((f) => {
    const v = f.value ?? ''; const name = `cf_${f.key}`; const help = f.helpText ? `<span class="hint">${esc(f.helpText)}</span>` : '';
    if (!f.canEdit) return `<div class="kv"><span>${esc(f.label)}</span><b>${esc(f.type === 'boolean' ? (f.hasValue ? tr(v ? 'yes' : 'no') : '') : v)}</b></div>`;
    let input;
    if (f.type === 'select') input = `<select name="${esc(name)}"><option value="">${esc(tr('choose'))}</option>${f.options.map((o) => `<option${o === v ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    else if (f.type === 'boolean') input = `<select name="${esc(name)}"><option value="">${esc(tr('choose'))}</option><option value="true"${v === true ? ' selected' : ''}>${esc(tr('yes'))}</option><option value="false"${v === false ? ' selected' : ''}>${esc(tr('no'))}</option></select>`;
    else input = `<input name="${esc(name)}" type="${f.type === 'date' ? 'date' : f.type === 'number' && !f.sensitive ? 'number' : 'text'}" ${f.sensitive ? `placeholder="${esc(v)}" autocomplete="off"` : `value="${esc(v)}"`}>`;
    return `<label><span>${esc(f.label)}</span>${input}${help}</label>`;
  }).join('');
}
function fillBasics() { const p = data.profile; const f = $('basicForm').elements; f.preferredName.value = p.preferredName; f.phone.value = p.phone; f.maritalStatus.value = p.maritalStatus; }
async function load() { data = await req('GET', '/me/profile'); paint(); }
const closeForms = () => ['legalForm', 'addressForm', 'bankForm'].forEach((id) => { $(id).hidden = true; $(id).reset(); });

$('basicForm').addEventListener('submit', async (e) => {
  e.preventDefault(); const f = new FormData(e.target);
  try { await req('PUT', '/me/profile', { preferredName: f.get('preferredName'), phone: f.get('phone'), maritalStatus: f.get('maritalStatus') }); await load(); fillBasics(); say(tr('saved')); } catch (err) { say(err.message, false); }
});
$('contactAdd').addEventListener('click', () => { contactEdit = null; $('contactForm').reset(); $('contactForm').hidden = false; $('contactForm').elements.name.focus(); });
$('contactCancel').addEventListener('click', () => { $('contactForm').hidden = true; });
$('contactForm').addEventListener('submit', async (e) => {
  e.preventDefault(); const f = new FormData(e.target);
  const body = { name: f.get('name'), relationship: f.get('relationship'), phone: f.get('phone'), email: f.get('email'), isPrimary: f.get('isPrimary') === 'on' };
  try { await req(contactEdit ? 'PUT' : 'POST', `/me/emergency-contacts${contactEdit ? `/${contactEdit}` : ''}`, body); $('contactForm').hidden = true; await load(); say(tr('saved')); } catch (err) { say(err.message, false); }
});
async function sendRequest(body) {
  const r = await req('POST', '/me/change-requests', body); closeForms(); await load(); say(tr(r.applied ? 'applied' : 'sent'));
}
$('legalForm').addEventListener('submit', (e) => { e.preventDefault(); const f = new FormData(e.target); sendRequest({ field: 'legalName', legalFirstName: f.get('legalFirstName'), legalMiddleName: f.get('legalMiddleName'), legalLastName: f.get('legalLastName'), reason: f.get('reason') }).catch((err) => say(err.message, false)); });
$('addressForm').addEventListener('submit', (e) => { e.preventDefault(); const f = new FormData(e.target); sendRequest({ field: 'homeAddress', homeAddress: { line1: f.get('line1'), line2: f.get('line2'), city: f.get('city'), state: f.get('state'), zip: f.get('zip') }, reason: f.get('reason') }).catch((err) => say(err.message, false)); });
$('bankForm').addEventListener('submit', (e) => {
  e.preventDefault(); const f = new FormData(e.target);
  if (f.get('accountNumber') !== f.get('accountNumber2')) { say(tr('mismatch'), false); return; }
  sendRequest({ field: 'bankDetails', bankName: f.get('bankName'), routingNumber: f.get('routingNumber'), accountNumber: f.get('accountNumber'), accountType: f.get('accountType'), authorization: f.get('authorization') === 'on', reason: f.get('reason') }).catch((err) => say(err.message, false));
});
$('extraForm').addEventListener('submit', async (e) => {
  e.preventDefault(); const f = new FormData(e.target); const values = {};
  for (const d of data.customFields.filter((x) => x.canEdit)) {
    const raw = f.get(`cf_${d.key}`);
    if (d.sensitive && raw === '') continue; // an empty box keeps the value on file
    values[d.key] = raw === '' ? null : d.type === 'boolean' ? raw === 'true' : d.type === 'number' ? Number(raw) : raw;
  }
  if (!Object.keys(values).length) return;
  try { await req('PUT', `/employees/${data.profile.id}/custom-fields`, { values }); await load(); say(tr('saved')); } catch (err) { say(err.message, false); }
});
document.addEventListener('click', async (e) => {
  const hit = (k) => { const el = e.target.closest(`[data-${k}]`); return el ? el.dataset[k] : null; };
  let v;
  try {
    if ((v = hit('l'))) { lang = v; try { localStorage.setItem('kylrx_lang', lang); } catch (_) {} paint(); } else if ((v = hit('open'))) {
      closeForms(); const form = $(v); form.hidden = false; const p = data.profile;
      if (v === 'legalForm') { form.elements.legalFirstName.value = p.legalFirstName; form.elements.legalMiddleName.value = p.legalMiddleName; form.elements.legalLastName.value = p.legalLastName; }
      if (v === 'addressForm' && p.homeAddress) ['line1', 'line2', 'city', 'state', 'zip'].forEach((k) => { form.elements[k].value = p.homeAddress[k] || ''; });
      form.scrollIntoView({ behavior: 'smooth', block: 'center' });
    } else if ((v = hit('close'))) $(v).hidden = true;
    else if ((v = hit('cedit'))) {
      const c = data.profile.emergencyContacts.find((x) => x.id === v); const f = $('contactForm').elements; contactEdit = c.id;
      f.name.value = c.name; f.relationship.value = c.relationship; f.phone.value = c.phone; f.email.value = c.email || ''; f.isPrimary.checked = Boolean(c.isPrimary); $('contactForm').hidden = false;
