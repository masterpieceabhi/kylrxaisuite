<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My hours</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--green:#16a34a;--red:#dc2626;--amber:#d97706;--bg:#f1f5f9}
*{box-sizing:border-box}body{margin:0;font:18px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#fff;border-bottom:1px solid var(--line)}
.lang button{font:inherit;font-weight:700;padding:6px 14px;border-radius:999px;border:2px solid #cbd5e1;background:#fff;margin-left:6px}.lang button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:640px;margin:0 auto;padding:16px 14px 70px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px}.nav button{width:52px;height:52px;border-radius:14px;border:0;background:#e2e8f0;font:700 24px system-ui;cursor:pointer}
.nav b{text-align:center;font-size:19px}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.totals div{background:#f8fafc;border-radius:12px;padding:10px 4px}.totals b{display:block;font-size:26px}.totals span{font-size:13px;color:var(--muted)}
.chip{display:inline-block;padding:3px 12px;border-radius:999px;font-weight:700;font-size:15px}.open{background:#e2e8f0}.submitted{background:#fef3c7;color:#92400e}.approved{background:#dcfce7;color:#166534}.rejected{background:#fee2e2;color:#b91c1c}
.day{padding:12px 0;border-top:1px solid var(--line)}.day:first-child{border-top:0}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.dh b{font-size:19px}.dh span{font-weight:700}
.pun{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pun button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font:600 15px system-ui;cursor:pointer}
.ot{color:var(--amber);font-size:14px;font-weight:700}.flag{color:var(--red);font-size:14px;font-weight:700}
button.go{width:100%;padding:18px;border:0;border-radius:14px;background:var(--blue);color:#fff;font:700 20px system-ui;cursor:pointer}button.go:disabled{opacity:.5}
button.link{border:0;background:none;color:var(--blue);font:700 16px system-ui;padding:8px 0;cursor:pointer}
label.f{display:grid;gap:6px;margin:10px 0;font-weight:600}
input,select{width:100%;padding:14px;border:2px solid var(--line);border-radius:12px;font:inherit;background:#fff}
#msg{display:none;padding:14px;border-radius:12px;font-weight:600}#msg.ok{display:block;background:#dcfce7;color:#166534}#msg.err{display:block;background:#fee2e2;color:#b91c1c}
.note{background:#fef3c7;color:#92400e;border-radius:12px;padding:10px 12px;font-weight:600;font-size:16px}
.back{display:block;text-align:center;color:var(--muted);padding:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.s{color:var(--muted);font-size:15px}
</style>
</head>
<body>
<header><b id="title"></b><div class="lang"><button data-l="en">EN</button><button data-l="es">ES</button></div></header>
<main>
  <div id="msg" role="status"></div>
  <section class="card">
    <div class="nav"><button id="prev" aria-label="Previous week">‹</button><b id="range"></b><button id="next" aria-label="Next week">›</button></div>
    <p style="text-align:center;margin:10px 0 0"><span class="chip" id="chip"></span></p>
    <p class="note" id="decision" style="display:none;margin:10px 0 0"></p>
  </section>
  <section class="card"><div class="totals"><div><b id="tTot">0</b><span id="lTot"></span></div><div><b id="tReg">0</b><span id="lReg"></span></div><div><b id="tOt">0</b><span id="lOt"></span></div></div></section>
  <section class="card" id="days"></section>
  <section class="card"><button class="go" id="submit"></button><p class="s" id="submitHelp" style="margin:10px 0 0;text-align:center"></p></section>

  <section class="card" id="fixCard" style="display:none">
    <h2 id="fixT" style="margin:0 0 6px;font-size:20px"></h2><p class="s" id="fixP" style="margin:0"></p>
    <form id="fix">
      <input type="hidden" name="kind"><input type="hidden" name="punchId"><input type="hidden" name="type">
      <label class="f" id="fDateL"><span id="lDate"></span><input type="date" name="localDate"></label>
      <label class="f" id="fTypeL"><span id="lType"></span><select name="typeSel"><option value="in" id="oIn"></option><option value="out" id="oOut"></option><option value="break_start" id="oBs"></option><option value="break_end" id="oBe"></option></select></label>
      <label class="f"><span id="lTime"></span><input type="time" name="localTime" required></label>
      <label class="f"><span id="lWhy"></span><input type="text" name="reason" required minlength="5" maxlength="200"></label>
      <button class="go" type="submit" id="fixGo"></button><button class="link" type="button" id="fixCancel"></button>
    </form>
  </section>
  <section class="card"><button class="link" id="forgot"></button><h2 id="hCor" style="margin:10px 0 4px;font-size:20px"></h2><div id="cors"></div></section>
  <a class="back" href="#" id="back"></a>
</main>

<script type="module">
import { auth, onAuthStateChanged } from './firebase-config.js';

const T = {
  en: { title: 'My hours', prev: 'Previous week', week: 'Week of', open: 'Open', submitted: 'Sent to your manager', approved: 'Approved', rejected: 'Needs a fix', tot: 'hours', reg: 'regular', ot: 'overtime', worked: 'worked',
    submit: 'Send my hours for approval', submitHelp: 'Clock out first. Your manager will check your hours.', sentOk: 'Hours sent.', locked: 'This week is approved and cannot be changed.', openShift: 'You are still clocked in.',
    noPunch: 'No punches this day.', brk: 'break', fixThis: 'Wrong time? Tap a punch to fix it.', forgot: 'I forgot to punch', fixT: 'Fix a punch', fixAdd: 'Add a missing punch', fixPunch: 'Change the time of this punch: {p}',
    lDate: 'Day', lType: 'What did you forget?', lTime: 'Right time', lWhy: 'What happened?', go: 'Send to my manager', cancel: 'Never mind', hCor: 'My fix requests', none: 'None yet.', cancelReq: 'Cancel',
    in: 'Clock in', out: 'Clock out', break_start: 'Start break', break_end: 'End break', pending: 'Waiting', denied: 'Not approved', cancelled: 'Cancelled', corSent: 'Fix request sent.',
    missed_meal_break: 'No full meal break', fail: 'Could not reach the server.', back: 'Back', change: 'change', add: 'add', remove: 'remove', rejNote: 'Your manager says: {n}' },
  es: { title: 'Mis horas', prev: 'Semana anterior', week: 'Semana del', open: 'Abierta', submitted: 'Enviada a su supervisor', approved: 'Aprobada', rejected: 'Necesita corrección', tot: 'horas', reg: 'regulares', ot: 'extra', worked: 'trabajadas',
    submit: 'Enviar mis horas para aprobación', submitHelp: 'Primero registre su salida. Su supervisor revisará sus horas.', sentOk: 'Horas enviadas.', locked: 'Esta semana está aprobada y no se puede cambiar.', openShift: 'Todavía está registrado como adentro.',
    noPunch: 'Sin registros este día.', brk: 'descanso', fixThis: '¿Hora incorrecta? Toque un registro para corregirlo.', forgot: 'Olvidé registrar', fixT: 'Corregir un registro', fixAdd: 'Agregar un registro que falta', fixPunch: 'Cambiar la hora de este registro: {p}',
    lDate: 'Día', lType: '¿Qué olvidó?', lTime: 'Hora correcta', lWhy: '¿Qué pasó?', go: 'Enviar a mi supervisor', cancel: 'Cancelar', hCor: 'Mis solicitudes de corrección', none: 'Ninguna todavía.', cancelReq: 'Cancelar',
    in: 'Entrada', out: 'Salida', break_start: 'Inicio de descanso', break_end: 'Fin de descanso', pending: 'En espera', denied: 'No aprobado', cancelled: 'Cancelado', corSent: 'Solicitud enviada.',
    missed_meal_break: 'Sin descanso de comida completo', fail: 'No se pudo conectar.', back: 'Volver', change: 'cambiar', add: 'agregar', remove: 'quitar', rejNote: 'Su supervisor dice: {n}' }
};
let lang = (navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en';
try { lang = localStorage.getItem('kylrx_lang') || lang; } catch (_) {}
const $ = (id) => document.getElementById(id);
const tr = (k, v = {}) => (T[lang][k] || k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
let week = null, weekStart = null, cors = [];

const addDays = (iso, n) => { const d = new Date(`${iso}T00:00:00Z`); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const mondayOf = (iso) => { const d = new Date(`${iso}T00:00:00Z`); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7)); return d.toISOString().slice(0, 10); };
const fmtDay = (iso) => new Date(`${iso}T12:00:00Z`).toLocaleDateString(lang === 'es' ? 'es-US' : 'en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
const hm = (h) => { const m = Math.round(h * 60); return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`; };
const hhmm12 = (t) => { const [h, m] = t.split(':').map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; };

function show(kind, text) { const m = $('msg'); m.textContent = text; m.className = kind; window.scrollTo({ top: 0, behavior: 'smooth' }); }
async function api(method, path, body) {
  const token = await auth.currentUser.getIdToken();
  const res = await fetch(`/api/time${path}`, { method, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }, body: body ? JSON.stringify(body) : undefined });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((json.errors && json.errors.join('\n')) || json.error || tr('fail'));
  return json;
}

function paint() {
  document.documentElement.lang = lang; document.title = tr('title'); $('title').textContent = tr('title');
  document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.l === lang));
  $('lTot').textContent = tr('tot'); $('lReg').textContent = tr('reg'); $('lOt').textContent = tr('ot'); $('back').textContent = tr('back');
  $('submit').textContent = tr('submit'); $('submitHelp').textContent = tr('submitHelp'); $('forgot').textContent = tr('forgot'); $('hCor').textContent = tr('hCor');
  ['lDate', 'lType', 'lTime', 'lWhy'].forEach((k) => { $(k).textContent = tr(k); }); $('fixGo').textContent = tr('go'); $('fixCancel').textContent = tr('cancel');
  $('oIn').textContent = tr('in'); $('oOut').textContent = tr('out'); $('oBs').textContent = tr('break_start'); $('oBe').textContent = tr('break_end');
  if (weekStart) $('range').textContent = `${tr('week')} ${fmtDay(weekStart)}`;
  $('cors').innerHTML = cors.length ? cors.map((c) => `<div class="row"><div>${tr(c.kind === 'add' ? 'add' : c.kind === 'change' ? 'change' : 'remove')}: ${tr(c.type)} ${c.localDate} ${c.localTime ? hhmm12(c.localTime) : ''}<div class="s">${c.reason}</div></div><div><span class="chip ${c.status === 'approved' ? 'approved' : c.status === 'pending' ? 'submitted' : 'rejected'}">${tr(c.status)}</span>${c.status === 'pending' ? ` <button class="link" data-cc="${c.id}">${tr('cancelReq')}</button>` : ''}</div></div>`).join('') : `<p class="s">${tr('none')}</p>`;
  if (!week) return;
  const st = week.status; $('chip').textContent = tr(st); $('chip').className = `chip ${st}`;
  const dn = $('decision'); dn.style.display = st === 'rejected' && week.decisionNote ? 'block' : 'none'; dn.textContent = tr('rejNote', { n: week.decisionNote || '' });
  $('tTot').textContent = hm(week.totals.workedHours); $('tReg').textContent = hm(week.totals.regularHours); $('tOt').textContent = hm(week.totals.overtimeHours + week.totals.doubleTimeHours);
  const lockedWeek = st === 'approved';
  $('days').innerHTML = week.days.length ? week.days.map((d) => `<div class="day"><div class="dh"><b>${fmtDay(d.date)}</b><span>${hm(d.workedHours)} ${tr('tot')}</span></div>
    ${d.overtimeHours || d.doubleTimeHours ? `<div class="ot">+${hm(d.overtimeHours + d.doubleTimeHours)} ${tr('ot')}</div>` : ''}${d.flags.map((f) => `<div class="flag">⚠ ${tr(f)}</div>`).join('')}
    <div class="pun">${d.punches.map((p) => `<button data-p="${p.id}" data-t="${p.type}" data-d="${d.date}" data-h="${p.time}" ${lockedWeek ? 'disabled' : ''}>${tr(p.type)} ${hhmm12(p.time)}</button>`).join('') || `<span class="s">${tr('noPunch')}</span>`}</div></div>`).join('') + (lockedWeek ? '' : `<p class="s" style="margin:10px 0 0">${tr('fixThis')}</p>`) : `<p class="s">${tr('noPunch')}</p>`;
  const canSend = ['open', 'rejected'].includes(st) && !week.openShift && week.days.length > 0;
  $('submit').disabled = !canSend; $('submit').style.display = st === 'approved' || st === 'submitted' ? 'none' : 'block';
  $('submitHelp').textContent = week.openShift ? tr('openShift') : tr('submitHelp'); $('submitHelp').style.display = st === 'approved' || st === 'submitted' ? 'none' : 'block';
  $('forgot').style.display = lockedWeek ? 'none' : 'inline-block';
}

async function load() {
  week = await api('GET', `/weeks/${weekStart}`);
  cors = (await api('GET', '/corrections?scope=mine')).data;
  paint();
}

function openFix(mode, p) {
  const f = $('fix'); f.reset();
  f.kind.value = mode; f.punchId.value = p ? p.id : ''; f.type.value = p ? p.type : '';
  $('fixT').textContent = tr('fixT');
  $('fixP').textContent = mode === 'change' ? tr('fixPunch', { p: `${tr(p.type)} ${hhmm12(p.time)}` }) : tr('fixAdd');
  $('fTypeL').style.display = mode === 'add' ? 'grid' : 'none';
  f.localDate.value = p ? p.date : weekStart; f.localDate.min = weekStart; f.localDate.max = addDays(weekStart, 6);
  if (p) f.localTime.value = p.time;
  $('fixCard').style.display = 'block'; $('fixCard').scrollIntoView({ behavior: 'smooth' });
}

$('days').addEventListener('click', (e) => { const b = e.target.closest('[data-p]'); if (b) openFix('change', { id: b.dataset.p, type: b.dataset.t, date: b.dataset.d, time: b.dataset.h }); });
$('forgot').onclick = () => openFix('add', null);
$('fixCancel').onclick = () => { $('fixCard').style.display = 'none'; };
$('fix').addEventListener('submit', async (e) => {
  e.preventDefault(); const f = e.target; const kind = f.kind.value;
  const body = kind === 'add' ? { kind, type: f.typeSel.value, localDate: f.localDate.value, localTime: f.localTime.value, reason: f.reason.value }
    : { kind, punchId: f.punchId.value, localDate: f.localDate.value, localTime: f.localTime.value, reason: f.reason.value };
  try { await api('POST', '/corrections', body); $('fixCard').style.display = 'none'; show('ok', tr('corSent')); await load(); } catch (err) { show('err', err.message); }
});
$('cors').addEventListener('click', async (e) => { const b = e.target.closest('[data-cc]'); if (!b) return; try { await api('POST', `/corrections/${b.dataset.cc}/cancel`); await load(); } catch (err) { show('err', err.message); } });
$('submit').onclick = async () => { try { await api('POST', `/weeks/${weekStart}/submit`); show('ok', tr('sentOk')); await load(); } catch (err) { show('err', err.message); } };
$('prev').onclick = async () => { weekStart = addDays(weekStart, -7); await load().catch((e) => show('err', e.message)); };
$('next').onclick = async () => { const next = addDays(weekStart, 7); if (next > mondayOf(week.today)) return; weekStart = next; await load().catch((e) => show('err', e.message)); };
$('back').onclick = (e) => { e.preventDefault(); if (history.length > 1) history.back(); else location.href = 'punch.html'; };
document.querySelectorAll('.lang button').forEach((b) => { b.onclick = () => { lang = b.dataset.l; try { localStorage.setItem('kylrx_lang', lang); } catch (_) {} paint(); }; });
paint();
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.replace('login.html'); return; }
  try {
    const today = new Intl.DateTimeFormat('en-CA').format(new Date());
    weekStart = mondayOf(today);
    const first = await api('GET', `/weeks/${weekStart}`); weekStart = mondayOf(first.today); await load();
  } catch (err) { show('err', err.message); }
});
</script>
</body>
</html>
