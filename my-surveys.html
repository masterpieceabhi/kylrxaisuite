<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surveys | Kylrx AI</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--bg:#f8fafc;--ok:#166534;--bad:#b91c1c}
*{box-sizing:border-box}body{margin:0;font:18px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#fff;border-bottom:1px solid var(--line);gap:8px}
h1{margin:0;font-size:22px}h2{margin:0 0 8px;font-size:20px}
.lang button{padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}.lang button.on{background:var(--ink);color:#fff}
main{max-width:560px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.hint{color:var(--muted);font-size:15px}.pre{white-space:pre-wrap}
fieldset{border:0;border-top:1px solid var(--line);margin:14px 0 0;padding:14px 0 0;min-width:0}
legend{font-weight:700;padding:0;float:left;width:100%;margin-bottom:10px}legend+*{clear:both}
.opt{position:relative;display:block;margin:6px 0}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:block;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:17px}
.opt input:checked+span{border-color:var(--blue);background:#eff6ff;font-weight:700}
.opt input:focus-visible+span{outline:3px solid #93c5fd}
.nums{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.nums .opt{margin:0}.nums .opt span{text-align:center;padding:12px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.two .opt{margin:0}.two .opt span{text-align:center}
.ends{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:6px}
textarea{padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;width:100%;min-height:90px;color:var(--ink);background:#fff}
button.go{width:100%;margin-top:16px;padding:14px 16px;border:0;border-radius:10px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.tag{padding:2px 10px;border-radius:999px;font-size:14px;font-weight:700}.good{background:#dcfce7;color:var(--ok)}
#msg{display:none;border-radius:10px;padding:12px}#msg.ok{display:block;background:#dcfce7;color:var(--ok)}#msg.err{display:block;background:#fee2e2;color:var(--bad)}
a.back{display:block;text-align:center;color:var(--blue);font-weight:700;padding:14px;text-decoration:none}
</style>
</head>
<body>
<header><h1 data-t="title"></h1><div class="lang"><button data-l="en">English</button> <button data-l="es">Español</button></div></header>
<main>
  <div id="msg" role="status"></div>
  <p class="hint" data-t="privacy" style="margin:0"></p>
  <div id="list"></div>
  <a class="back" href="punch.html" data-t="back"></a>
</main>
<script type="module">
import { auth, onAuthStateChanged } from './firebase-config.js';
const $ = (id) => document.getElementById(id);
const T = {
  en: { title: 'Surveys', back: 'Back to the clock', privacy: 'Your answers are saved without your name. The company sees results only after the survey has closed and enough people have answered. Please do not write names in comments.', none: 'There is no survey to answer right now.', until: 'Open until {d}', optional: '(optional)', send: 'Send my answers', sending: 'Sending...', thanks: 'Thank you. Your answers were saved without your name.', answered: 'You answered this. Thank you.', done: 'Answered', yes: 'Yes', no: 'No', notLikely: '0 = not likely', veryLikely: '10 = very likely', fail: 'Could not load. Try again.', once: 'You can answer once. You cannot change your answers after sending.',
        s1: 'Strongly disagree', s2: 'Disagree', s3: 'Neither', s4: 'Agree', s5: 'Strongly agree' },
  es: { title: 'Encuestas', back: 'Volver al reloj', privacy: 'Sus respuestas se guardan sin su nombre. La empresa ve los resultados solo después de que la encuesta se cierra y suficientes personas han respondido. Por favor no escriba nombres en los comentarios.', none: 'No hay ninguna encuesta para responder en este momento.', until: 'Abierta hasta el {d}', optional: '(opcional)', send: 'Enviar mis respuestas', sending: 'Enviando...', thanks: 'Gracias. Sus respuestas se guardaron sin su nombre.', answered: 'Usted ya respondió. Gracias.', done: 'Respondida', yes: 'Sí', no: 'No', notLikely: '0 = nada probable', veryLikely: '10 = muy probable', fail: 'No se pudo cargar. Intente de nuevo.', once: 'Puede responder una sola vez. No puede cambiar sus respuestas después de enviarlas.',
        s1: 'Muy en desacuerdo', s2: 'En desacuerdo', s3: 'Ni de acuerdo ni en desacuerdo', s4: 'De acuerdo', s5: 'Muy de acuerdo' }
};
let lang = (navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en';
try { lang = localStorage.getItem('kylrx_lang') || lang; } catch (_) {}
if (!T[lang]) lang = 'en';
const tr = (k, v = {}) => (T[lang][k] ?? T.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const say = (t, ok = true) => { const m = $('msg'); m.textContent = t; m.className = ok ? 'ok' : 'err'; window.scrollTo({ top: 0, behavior: 'smooth' }); };
const day = (d) => (d ? new Date(`${String(d).slice(0, 10)}T12:00:00`).toLocaleDateString(lang === 'es' ? 'es-US' : 'en-US', { dateStyle: 'long' }) : '');
let surveys = null;

async function req(method, path, body) {
  const res = await fetch(`/api/us/surveys${path}`, { method, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${await auth.currentUser.getIdToken()}` }, body: body ? JSON.stringify(body) : undefined });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((json.errors && json.errors.join('; ')) || (typeof json.error === 'string' ? json.error : '') || `Request failed (${res.status})`);
  return json;
}
const opt = (name, value, label, required) => `<label class="opt"><input type="radio" name="${esc(name)}" value="${esc(value)}"${required ? ' required' : ''}><span>${esc(label)}</span></label>`;
function field(q) {
  const legend = `<legend>${esc(q.text)}${q.required ? '' : ` <span class="hint">${esc(tr('optional'))}</span>`}</legend>`;
  if (q.type === 'scale') return `<fieldset>${legend}<div>${[5, 4, 3, 2, 1].map((n) => opt(q.id, n, `${n}  ${tr(`s${n}`)}`, q.required)).join('')}</div></fieldset>`;
  if (q.type === 'enps') return `<fieldset>${legend}<div><div class="nums">${Array.from({ length: 11 }, (_, n) => opt(q.id, n, String(n), q.required)).join('')}</div><div class="ends"><span>${esc(tr('notLikely'))}</span><span>${esc(tr('veryLikely'))}</span></div></div></fieldset>`;
  if (q.type === 'yesno') return `<fieldset>${legend}<div class="two">${opt(q.id, 'yes', tr('yes'), q.required)}${opt(q.id, 'no', tr('no'), q.required)}</div></fieldset>`;
  return `<fieldset>${legend}<div><textarea name="${esc(q.id)}" maxlength="1000"${q.required ? ' required' : ''}></textarea></div></fieldset>`;
}
// keep what the person has picked so far when the language is switched
function picked() {
  const out = {};
  document.querySelectorAll('form[data-survey]').forEach((f) => { out[f.dataset.survey] = Object.fromEntries(new FormData(f).entries()); });
  return out;
}
function paint() {
  const keep = picked();
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = tr(el.dataset.t); });
  document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.l === lang));
  if (!surveys) return;
  $('list').innerHTML = surveys.map((s) => (s.answered
    ? `<section class="card"><h2>${esc(s.title)} <span class="tag good">${esc(tr('done'))}</span></h2><p class="hint" style="margin:0">${esc(tr('answered'))}</p></section>`
    : `<section class="card"><h2>${esc(s.title)}</h2>${s.intro ? `<p class="pre" style="margin:0 0 6px">${esc(s.intro)}</p>` : ''}${s.closesOn ? `<p class="hint" style="margin:0">${esc(tr('until', { d: day(s.closesOn) }))}</p>` : ''}<form data-survey="${esc(s.id)}">${s.questions.map(field).join('')}<button class="go" type="submit">${esc(tr('send'))}</button><p class="hint" style="margin:8px 0 0;text-align:center">${esc(tr('once'))}</p></form></section>`)).join('') || `<section class="card"><p class="hint" style="margin:0">${esc(tr('none'))}</p></section>`;
  for (const [id, vals] of Object.entries(keep)) {
    const f = document.querySelector(`form[data-survey="${CSS.escape(id)}"]`); if (!f) continue;
    for (const [name, value] of Object.entries(vals)) { const el = f.elements[name]; if (!el) continue; if (el instanceof RadioNodeList) el.value = value; else el.value = value; }
  }
}
async function load() { surveys = (await req('GET', '/mine')).data; paint(); }
document.addEventListener('submit', async (e) => {
  const f = e.target.closest('form[data-survey]'); if (!f) return;
  e.preventDefault();
  const s = surveys.find((x) => x.id === f.dataset.survey); const raw = Object.fromEntries(new FormData(f).entries()); const answers = {};
  for (const q of s.questions) { const v = raw[q.id]; if (v === undefined || String(v).trim() === '') continue; answers[q.id] = q.type === 'scale' || q.type === 'enps' ? Number(v) : v; }
  const btn = f.querySelector('button.go'); btn.disabled = true; btn.textContent = tr('sending');
  try { await req('POST', `/${s.id}/answers`, { answers }); f.remove(); await load(); say(tr('thanks')); } catch (err) { btn.disabled = false; btn.textContent = tr('send'); say(err.message, false); }
});
document.addEventListener('click', (e) => { const t = e.target.closest('[data-l]'); if (!t) return; lang = t.dataset.l; try { localStorage.setItem('kylrx_lang', lang); } catch (_) {} paint(); });
paint();
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'login.html'; return; }
  try { await load(); } catch (_) { say(tr('fail'), false); }
});
</script>
</body>
</html>
