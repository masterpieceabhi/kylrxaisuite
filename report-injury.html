<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report an injury</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--bg:#f1f5f9}
*{box-sizing:border-box}body{margin:0;font:18px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#fff;border-bottom:1px solid var(--line)}
.lang button{font:inherit;font-weight:700;padding:6px 14px;border-radius:999px;border:2px solid #cbd5e1;background:#fff;margin-left:6px}.lang button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:640px;margin:0 auto;padding:16px 14px 60px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
h2{margin:0 0 8px;font-size:22px}p.s{margin:0 0 10px;color:var(--muted);font-size:16px}
label.f{display:grid;gap:6px;margin:14px 0;font-weight:600}
input,select,textarea{width:100%;padding:14px;border:2px solid var(--line);border-radius:12px;font:inherit;background:#fff}textarea{min-height:110px}
.opt{display:flex;gap:12px;align-items:center;padding:12px;border:2px solid var(--line);border-radius:12px;margin:8px 0;font-weight:600}.opt input{width:24px;height:24px}
button.go{width:100%;padding:18px;border:0;border-radius:14px;background:#dc2626;color:#fff;font:700 20px system-ui;cursor:pointer;margin-top:8px}
#msg{display:none;padding:14px;border-radius:12px;font-weight:600}#msg.ok{display:block;background:#dcfce7;color:#166534}#msg.err{display:block;background:#fee2e2;color:#b91c1c}
.safe{background:#eff6ff;color:#1e3a8a;border-radius:12px;padding:12px;font-weight:600;font-size:16px}
.row{padding:10px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.back{display:block;text-align:center;color:var(--muted);padding:10px}
</style>
</head>
<body>
<header><b id="title"></b><div class="lang"><button data-l="en">EN</button><button data-l="es">ES</button></div></header>
<main>
  <div id="msg" role="status"></div>
  <div class="safe" id="safe"></div>
  <form class="card" id="f">
    <h2 id="h"></h2><p class="s" id="p"></p>
    <label class="f"><span id="lDate"></span><input type="date" name="dateOfIncident" required></label>
    <label class="f"><span id="lWhere"></span><input type="text" name="location" maxlength="120" required></label>
    <label class="f"><span id="lWhat"></span><textarea name="description" required minlength="5" maxlength="1000"></textarea></label>
    <label class="f"><span id="lBody"></span><input type="text" name="bodyPart" maxlength="80"></label>
    <label class="opt"><input type="checkbox" name="receivedMedicalTreatment"><span id="lMed"></span></label>
    <label class="opt"><input type="checkbox" name="missedWork"><span id="lMissed"></span></label>
    <button class="go" type="submit" id="go"></button>
  </form>
  <section class="card"><h2 id="hMine" style="font-size:20px"></h2><div id="mine"></div></section>
  <a class="back" href="#" id="back"></a>
</main>
<script type="module">
import { auth, onAuthStateChanged } from './firebase-config.js';
const T = {
  en: { title: 'Report an injury', safe: 'If this is an emergency, call 911 first. Tell your supervisor too.', h: 'Tell us what happened', p: 'HR will look at your report and follow up with you.', lDate: 'Day it happened', lWhere: 'Where did it happen?', lWhat: 'What happened?', lBody: 'Which part of your body was hurt? (optional)', lMed: 'I got medical treatment', lMissed: 'I missed work because of it', go: 'Send report', hMine: 'My reports', none: 'No reports yet.', ok: 'Thank you. HR has your report. You will not be treated differently for reporting this.', fail: 'Could not send. Please try again.', back: 'Back', status_reported: 'HR is reviewing', status_classified: 'HR has reviewed it' },
  es: { title: 'Reportar una lesión', safe: 'Si es una emergencia, llame primero al 911. Avise también a su supervisor.', h: 'Cuéntenos qué pasó', p: 'Recursos Humanos revisará su reporte y se comunicará con usted.', lDate: 'Día en que ocurrió', lWhere: '¿Dónde ocurrió?', lWhat: '¿Qué pasó?', lBody: '¿Qué parte del cuerpo se lastimó? (opcional)', lMed: 'Recibí atención médica', lMissed: 'Falté al trabajo por esto', go: 'Enviar reporte', hMine: 'Mis reportes', none: 'Aún no hay reportes.', ok: 'Gracias. Recursos Humanos tiene su reporte. No será tratado de forma diferente por reportarlo.', fail: 'No se pudo enviar. Intente de nuevo.', back: 'Volver', status_reported: 'RR. HH. lo está revisando', status_classified: 'RR. HH. lo revisó' }
};
let lang = (navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en';
try { lang = localStorage.getItem('kylrx_lang') || lang; } catch (_) {}
const $ = (id) => document.getElementById(id); const tr = (k) => T[lang][k] || k;
let mine = [];
function show(kind, text) { const m = $('msg'); m.textContent = text; m.className = kind; window.scrollTo({ top: 0, behavior: 'smooth' }); }
async function api(method, path, body) { const token = await auth.currentUser.getIdToken(); const res = await fetch(`/api/us/osha${path}`, { method, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }, body: body ? JSON.stringify(body) : undefined }); const j = await res.json().catch(() => ({})); if (!res.ok) throw new Error((j.errors && j.errors.join('\n')) || j.error || tr('fail')); return j; }
function paint() {
  document.documentElement.lang = lang; document.title = tr('title'); $('title').textContent = tr('title'); document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.l === lang));
  ['safe', 'h', 'p', 'lDate', 'lWhere', 'lWhat', 'lBody', 'lMed', 'lMissed', 'hMine'].forEach((k) => { $(k).textContent = tr(k); }); $('go').textContent = tr('go'); $('back').textContent = tr('back');
  $('mine').innerHTML = mine.length ? mine.map((i) => `<div class="row"><b>${i.dateOfIncident}</b> · ${i.location}<p class="s" style="margin:4px 0 0">${tr('status_' + i.status)}</p></div>`).join('') : `<p class="s">${tr('none')}</p>`;
}
async function load() { mine = (await api('GET', '/incidents')).data; paint(); }
$('f').addEventListener('submit', async (e) => { e.preventDefault(); const f = e.target; try { await api('POST', '/report', { dateOfIncident: f.dateOfIncident.value, location: f.location.value, description: f.description.value, bodyPart: f.bodyPart.value, receivedMedicalTreatment: f.receivedMedicalTreatment.checked, missedWork: f.missedWork.checked }); f.reset(); show('ok', tr('ok')); await load(); } catch (err) { show('err', err.message); } });
$('back').onclick = (e) => { e.preventDefault(); if (history.length > 1) history.back(); else location.href = 'punch.html'; };
document.querySelectorAll('.lang button').forEach((b) => { b.onclick = () => { lang = b.dataset.l; try { localStorage.setItem('kylrx_lang', lang); } catch (_) {} paint(); }; });
paint();
onAuthStateChanged(auth, async (user) => { if (!user) { window.location.replace('login.html'); return; } try { await load(); } catch (err) { show('err', err.message); } });
</script>
</body>
</html>
