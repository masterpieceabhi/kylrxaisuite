<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Choose a new password | Onn HR</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--bg:#f8fafc;--ok:#166534;--bad:#b91c1c}
*{box-sizing:border-box}body{margin:0;font:18px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#fff;border-bottom:1px solid var(--line);gap:8px}
h1{margin:0;font-size:22px}h2{margin:0 0 6px;font-size:20px}p{margin:8px 0}
.lang button{padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}.lang button.on{background:var(--ink);color:#fff}
main{max-width:520px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
label.f{display:grid;gap:6px;margin:14px 0;font-size:16px;font-weight:600}
input{width:100%;padding:14px 12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;color:var(--ink);background:#fff}
input:focus{outline:3px solid #bfdbfe;border-color:var(--blue)}
.hint{color:var(--muted);font-size:15px;font-weight:400}
button.go{width:100%;padding:16px;border:0;border-radius:10px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer;margin-top:6px}button.go:disabled{opacity:.5}
button.soft{width:100%;padding:12px;border:0;border-radius:10px;background:#eef2ff;color:var(--blue);font:inherit;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}
label.show{display:flex;gap:10px;align-items:center;font-size:16px;margin:4px 0 10px}label.show input{width:22px;height:22px}
#msg{display:none;border-radius:10px;padding:12px}#msg.ok{display:block;background:#dcfce7;color:var(--ok)}#msg.err{display:block;background:#fee2e2;color:var(--bad)}
.who{background:#eff6ff;border-radius:10px;padding:10px 12px;overflow-wrap:anywhere}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1 data-t="title"></h1><div class="lang"><button type="button" data-l="en">English</button> <button type="button" data-l="es">Español</button></div></header>
<main>
  <div id="msg" role="status"></div>
  <form class="card" id="form" hidden novalidate>
    <h2 data-t="head"></h2>
    <p id="why"></p>
    <p class="who"><span data-t="signedIn"></span> <b id="email"></b></p>
    <label class="f"><span id="curLabel"></span><input type="password" id="cur" autocomplete="current-password" maxlength="200" required></label>
    <label class="f"><span data-t="pw"></span><input type="password" id="pw" autocomplete="new-password" maxlength="72" required><span class="hint" data-t="rules"></span></label>
    <label class="f"><span data-t="pw2"></span><input type="password" id="pw2" autocomplete="new-password" maxlength="72" required></label>
    <label class="show"><input type="checkbox" id="show"><span data-t="show"></span></label>
    <button class="go" type="submit" id="go" data-t="save"></button>
    <button class="soft" type="button" id="out" data-t="signOut"></button>
  </form>
  <section class="card" id="done" hidden><h2 data-t="doneT"></h2><p data-t="doneP"></p><p><a href="login.html" data-t="toLogin"></a></p></section>
</main>
<script type="module">
import { auth, onAuthStateChanged } from './firebase-config.js';
import { signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js';

const $ = (id) => document.getElementById(id);
const T = {
  en: { title: 'Choose a new password', head: 'Choose your own password', whyTemp: 'You signed in with a temporary password. Before you can use anything else, choose a password only you know.', whyOwn: 'Change the password you sign in with.',
    signedIn: 'Signed in as', curTemp: 'The temporary password you were given', curOwn: 'Your current password', pw: 'New password', pw2: 'Type the new password again', show: 'Show the passwords', save: 'Save my new password', signOut: 'Sign out',
    rules: 'At least 14 characters, with an uppercase letter, a lowercase letter, a number and a special character (like ! # $ % & * ?).',
    noMatch: 'The two new passwords are not the same.', need: 'Please fill in every field.', fail: 'Something went wrong. Try again.', doneT: 'Your new password is saved', doneP: 'One moment...', toLogin: 'Go to the sign-in page',
    again: 'Your new password is saved. Sign in again with it.' },
  es: { title: 'Elija una contraseña nueva', head: 'Elija su propia contraseña', whyTemp: 'Usted entró con una contraseña temporal. Antes de usar cualquier otra cosa, elija una contraseña que solo usted conozca.', whyOwn: 'Cambie la contraseña con la que entra.',
    signedIn: 'Entró como', curTemp: 'La contraseña temporal que le dieron', curOwn: 'Su contraseña actual', pw: 'Contraseña nueva', pw2: 'Escriba la contraseña nueva otra vez', show: 'Mostrar las contraseñas', save: 'Guardar mi contraseña nueva', signOut: 'Salir',
    rules: 'Al menos 14 caracteres, con una letra mayúscula, una minúscula, un número y un carácter especial (como ! # $ % & * ?).',
    noMatch: 'Las dos contraseñas nuevas no son iguales.', need: 'Por favor llene todos los campos.', fail: 'Algo salió mal. Intente de nuevo.', doneT: 'Su contraseña nueva quedó guardada', doneP: 'Un momento...', toLogin: 'Ir a la página de acceso',
    again: 'Su contraseña nueva quedó guardada. Entre otra vez con ella.' }
};
const ES_ERRORS = [
  [/at least 14 characters/, 'La contraseña debe tener al menos 14 caracteres'], [/at most 72/, 'La contraseña puede tener 72 caracteres como máximo'], [/< or >/, 'La contraseña no puede tener los caracteres < o >'],
  [/uppercase/, 'La contraseña debe tener una letra mayúscula'], [/lowercase/, 'La contraseña debe tener una letra minúscula'], [/contain a number/, 'La contraseña debe tener un número'],
  [/special character/, 'La contraseña debe tener un carácter especial, como ! # $ % & * ?'], [/too common/, 'Esa contraseña es muy común. Elija otra.'], [/email name/, 'La contraseña no puede contener el nombre de su correo'],
  [/current password is not right/, 'La contraseña actual no es correcta'], [/different from the current/, 'Elija una contraseña distinta de la actual'], [/Too many tries/, 'Demasiados intentos. Espere 15 minutos e intente de nuevo.']
];
let lang = (navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en';
try { lang = localStorage.getItem('kylrx_lang') || lang; } catch (_) {}
if (!T[lang]) lang = 'en';
const tr = (k) => T[lang][k] ?? T.en[k] ?? k;
const local = (text) => { if (lang !== 'es') return text; const hit = ES_ERRORS.find(([re]) => re.test(text)); return hit ? hit[1] : text; };
const say = (t, ok = false) => { const m = $('msg'); m.textContent = t; m.className = t ? (ok ? 'ok' : 'err') : ''; if (t) window.scrollTo({ top: 0, behavior: 'smooth' }); };
let temporary = true; let email = '';

function paint() {
  document.documentElement.lang = lang; document.title = tr('title');
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = tr(el.dataset.t); });
  document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.l === lang));
  $('why').textContent = tr(temporary ? 'whyTemp' : 'whyOwn'); $('curLabel').textContent = tr(temporary ? 'curTemp' : 'curOwn'); $('email').textContent = email;
}
document.querySelectorAll('.lang button').forEach((b) => b.addEventListener('click', () => { lang = b.dataset.l; try { localStorage.setItem('kylrx_lang', lang); } catch (_) {} paint(); }));
$('show').addEventListener('change', (e) => { ['cur', 'pw', 'pw2'].forEach((id) => { $(id).type = e.target.checked ? 'text' : 'password'; }); });
$('out').addEventListener('click', async () => { try { await signOut(auth); } catch (_) {} window.location.replace('login.html'); });

async function call(method, path, body) {
  const res = await fetch(`/api/auth/${path}`, { method, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${await auth.currentUser.getIdToken()}` }, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(local(typeof json.error === 'string' ? json.error : tr('fail')));
  return json;
}

$('form').addEventListener('submit', async (ev) => {
  ev.preventDefault(); say('');
  const cur = $('cur').value; const pw = $('pw').value;
  if (!cur || !pw) return say(tr('need'));
  if (pw !== $('pw2').value) return say(tr('noMatch'));
  $('go').disabled = true;
  try {
    const r = await call('POST', 'change-password', { currentPassword: cur, newPassword: pw });
    $('form').hidden = true; $('done').hidden = false;
    // changing the password ends every session, this one too: sign in again with the new password
    try { await signInWithEmailAndPassword(auth, r.email || email, pw); window.location.replace(temporary && r.next === 'us-onboarding.html' ? 'us-onboarding.html' : 'login.html'); }
    catch (_) { say(tr('again'), true); }
  } catch (e) { say(e.message); $('go').disabled = false; }
});

paint();
onAuthStateChanged(auth, async (user) => {
  if (!user) { if ($('done').hidden) window.location.replace('login.html'); return; }
  if (!$('form').hidden || !$('done').hidden) return;
  try { const s = await call('GET', 'password-status'); temporary = s.mustChangePassword === true; email = s.email || user.email || ''; paint(); $('form').hidden = false; }
  catch (e) { say(e.message); }
});
</script>
<script type="module" src="us-nav.js?v=3"></script>
</body>
</html>
