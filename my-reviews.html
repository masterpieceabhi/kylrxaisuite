<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My reviews | Kylrx AI</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--bg:#f8fafc;--ok:#166534;--bad:#b91c1c}
*{box-sizing:border-box}body{margin:0;font:18px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#fff;border-bottom:1px solid var(--line);gap:8px}
h1{margin:0;font-size:22px}h2{margin:0 0 6px;font-size:19px}h3{margin:14px 0 4px;font-size:16px}
.lang{white-space:nowrap}.lang button{padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}.lang button.on{background:var(--ink);color:#fff}
main{max-width:560px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.item{border-top:1px solid var(--line);padding:14px 0}.item:first-of-type{border-top:0;padding-top:4px}
.hint{color:var(--muted);font-size:15px}.pre{white-space:pre-wrap;font-size:16px;margin:2px 0 10px;overflow-wrap:anywhere}
label{display:grid;gap:4px;font-size:15px;color:var(--ink);font-weight:600;margin:12px 0}
textarea,select{padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;width:100%;color:var(--ink);background:#fff}
textarea{min-height:96px}
button.go{width:100%;padding:14px 16px;border:0;border-radius:10px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button.soft{width:100%;padding:12px 14px;border:0;border-radius:10px;background:#eef2ff;color:var(--blue);font:inherit;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
.stack{display:grid;gap:8px;margin-top:10px}
.tag{padding:2px 10px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap}.good{background:#dcfce7;color:var(--ok)}.wait{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:var(--bad)}.grey{background:#e2e8f0;color:#475569}
.quote{border-left:3px solid var(--line);padding:2px 10px;margin:6px 0;white-space:pre-wrap;font-size:16px;overflow-wrap:anywhere}
.private{background:#eff6ff;border-radius:10px;padding:10px 12px;font-size:15px}
#msg{display:none;border-radius:10px;padding:12px}#msg.ok{display:block;background:#dcfce7;color:var(--ok)}#msg.err{display:block;background:#fee2e2;color:var(--bad)}
a.back{display:block;text-align:center;color:var(--blue);font-weight:700;padding:14px;text-decoration:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1 data-t="title"></h1><div class="lang"><button data-l="en">English</button> <button data-l="es">Español</button></div></header>
<main>
  <div id="msg" role="status"></div>
  <section class="card" id="selfCard"><h2 data-t="selfTitle"></h2><div id="selfList"></div></section>
  <section class="card" id="askCard"><h2 data-t="askTitle"></h2><div id="askList"></div></section>
  <section class="card" id="pastCard" hidden><h2 data-t="pastTitle"></h2><div id="pastList"></div></section>
  <a class="back" href="my-goals.html" data-t="goals"></a>
  <a class="back" href="punch.html" data-t="back"></a>
</main>
<script type="module">
import { auth, onAuthStateChanged } from './firebase-config.js';
const $ = (id) => document.getElementById(id);
const T = {
  en: { title: 'My reviews', back: 'Back to the clock', goals: 'My goals and my manager\'s reviews', fail: 'Could not load. Try again.',
        selfTitle: 'My self review', noSelf: 'Nobody is asking you for a self review right now.', period: '{a} to {b}', dueBy: 'Please finish by {d}', late: 'past the date', sent: 'Sent', notSent: 'Not sent yet', sentOn: 'You sent this on {d}. You can still change it until the review closes.',
        selfHint: 'Write about your own work in this period. Your manager and HR read it after you send it.', saveLater: 'Save and finish later', send: 'Send to my manager', sendAgain: 'Send my changes', saved: 'Saved. Your manager cannot see it until you send it.', sentMsg: 'Sent. Your manager and HR can read it now.',
        askTitle: 'Feedback I was asked to give', noAsk: 'Nobody is asking you for feedback about a coworker right now.', about: 'About {n}', write: 'Write feedback', done: 'Done, thank you', askHint: 'Answer at least one question. Write about the work, and say it as you would to the person.',
        privacy: 'Your name is not stored with your answers. {n} and their manager only see everyone\'s answers mixed together, and only after at least a few coworkers have answered. After you send it you cannot read it or change it.', rating: 'Overall, working with this person is (optional)', noRating: 'I would rather not rate', sendFeedback: 'Send my feedback', cancel: 'Not now', thanks: 'Thank you. Your feedback was sent without your name.', confirmSend: 'Send your feedback now? You cannot change it afterwards.',
        pastTitle: 'Closed reviews', mySelf: 'What I wrote', noSelfPast: 'You did not send a self review.', mgr: 'Your manager\'s review is under "My goals", once it has been shared with you.', coTitle: 'What coworkers said', coHidden: 'Too few coworkers answered, so nothing is shown. This keeps their answers private.', coNote: 'Comments are mixed together, in alphabetical order, without names.', avg: 'Average rating: {n} of 5', noneHere: 'Nobody answered this one.',
        r1: 'Very hard', r2: 'Hard', r3: 'Fine', r4: 'Good', r5: 'Great', q: {} },
  es: { title: 'Mis evaluaciones', back: 'Volver al reloj', goals: 'Mis metas y las evaluaciones de mi supervisor', fail: 'No se pudo cargar. Intente de nuevo.',
        selfTitle: 'Mi autoevaluación', noSelf: 'Por ahora nadie le pide una autoevaluación.', period: '{a} al {b}', dueBy: 'Por favor termine antes del {d}', late: 'fecha vencida', sent: 'Enviada', notSent: 'Aún no enviada', sentOn: 'Usted la envió el {d}. Todavía puede cambiarla hasta que cierre la evaluación.',
        selfHint: 'Escriba sobre su propio trabajo en este periodo. Su supervisor y Recursos Humanos la leen después de que usted la envíe.', saveLater: 'Guardar y terminar después', send: 'Enviar a mi supervisor', sendAgain: 'Enviar mis cambios', saved: 'Guardado. Su supervisor no puede verla hasta que usted la envíe.', sentMsg: 'Enviada. Su supervisor y Recursos Humanos ya pueden leerla.',
        askTitle: 'Opiniones que me pidieron', noAsk: 'Por ahora nadie le pide su opinión sobre un compañero.', about: 'Sobre {n}', write: 'Escribir mi opinión', done: 'Listo, gracias', askHint: 'Conteste al menos una pregunta. Escriba sobre el trabajo, y dígalo como se lo diría a la persona.',
        privacy: 'Su nombre no se guarda con sus respuestas. {n} y su supervisor solo ven las respuestas de todos mezcladas, y solo cuando varios compañeros hayan contestado. Después de enviarla no podrá leerla ni cambiarla.', rating: 'En general, trabajar con esta persona es (opcional)', noRating: 'Prefiero no calificar', sendFeedback: 'Enviar mi opinión', cancel: 'Ahora no', thanks: 'Gracias. Su opinión se envió sin su nombre.', confirmSend: '¿Enviar su opinión ahora? Después no podrá cambiarla.',
        pastTitle: 'Evaluaciones cerradas', mySelf: 'Lo que escribí', noSelfPast: 'Usted no envió una autoevaluación.', mgr: 'La evaluación de su supervisor está en "Mis metas", cuando se la hayan compartido.', coTitle: 'Lo que dijeron los compañeros', coHidden: 'Muy pocos compañeros contestaron, así que no se muestra nada. Así sus respuestas quedan privadas.', coNote: 'Los comentarios están mezclados, en orden alfabético y sin nombres.', avg: 'Calificación promedio: {n} de 5', noneHere: 'Nadie contestó esta.',
        r1: 'Muy difícil', r2: 'Difícil', r3: 'Normal', r4: 'Bueno', r5: 'Excelente',
        q: { 'What went well for you in this period?': '¿Qué le salió bien en este periodo?', 'What was hard, or did not go as planned?': '¿Qué fue difícil o no salió como esperaba?', 'What do you want to learn or do next?': '¿Qué quiere aprender o hacer ahora?', 'What does this person do well?': '¿Qué hace bien esta persona?', 'What could this person do better?': '¿Qué podría hacer mejor esta persona?', 'Anything else that would help them?': '¿Algo más que le ayudaría?' } }
};
let lang = (navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en';
try { lang = localStorage.getItem('kylrx_lang') || lang; } catch (_) {}
if (!T[lang]) lang = 'en';
const tr = (k, v = {}) => (T[lang][k] ?? T.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const say = (t, ok = true) => { const m = $('msg'); m.textContent = t; m.className = ok ? 'ok' : 'err'; window.scrollTo({ top: 0, behavior: 'smooth' }); };
// A plain date (2026-11-01) is shown as that day; a full timestamp is shown as the viewer's local day, not the UTC day
const day = (d) => (d ? new Date(String(d).length > 10 ? d : `${d}T12:00:00`).toLocaleDateString(lang === 'es' ? 'es-US' : 'en-US', { dateStyle: 'long' }) : '');
// the standard questions are shown in Spanish; questions the company wrote itself are shown as written
const qText = (t) => T[lang].q[t] || t;
let data = null; let writing = null; // writing: the request (cycleId + subjectId) whose form is open
const typed = {}; // text typed but not saved yet, kept when the page repaints (language switch)
const reqKey = (r) => `${r.cycleId}|${r.subjectId}`;

async function req(method, path, body) {
  const res = await fetch(`/api/us/review-cycles${path}`, { method, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${await auth.currentUser.getIdToken()}` }, body: body ? JSON.stringify(body) : undefined });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((json.errors && json.errors.join('; ')) || (typeof json.error === 'string' ? json.error : '') || `Request failed (${res.status})`);
  return json;
}
const keep = () => document.querySelectorAll('textarea[data-k], select[data-k]').forEach((el) => { typed[el.dataset.k] = el.value; });
const val = (k, fallback = '') => (typed[k] !== undefined ? typed[k] : fallback);
const head = (c) => `<b>${esc(c.name || c.cycleName)}</b>${c.late ? ` <span class="tag bad">${esc(tr('late'))}</span>` : ''}`;

function paint() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = tr(el.dataset.t); });
  document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.l === lang));
  if (!data) return;
  const open = data.cycles.filter((c) => c.status === 'open' && c.self); const past = data.cycles.filter((c) => c.status === 'closed');
  $('selfList').innerHTML = open.map((c) => `<div class="item">${head(c)} <span class="tag ${c.self.submittedAt ? 'good' : 'wait'}">${esc(tr(c.self.submittedAt ? 'sent' : 'notSent'))}</span><br><span class="hint">${esc(tr('period', { a: day(c.periodStart), b: day(c.periodEnd) }))} · ${esc(tr('dueBy', { d: day(c.dueDate) }))}</span>
      <p class="hint" style="margin:8px 0 0">${esc(c.self.submittedAt ? tr('sentOn', { d: day(c.self.submittedAt) }) : tr('selfHint'))}</p>
      ${c.self.questions.map((q) => `<label>${esc(qText(q.text))}<textarea maxlength="3000" data-k="self|${esc(c.id)}|${esc(q.id)}" data-self="${esc(c.id)}" data-q="${esc(q.id)}">${esc(val(`self|${c.id}|${q.id}`, c.self.answers[q.id] || ''))}</textarea></label>`).join('')}
      <div class="stack"><button class="go" data-send="${esc(c.id)}">${esc(tr(c.self.submittedAt ? 'sendAgain' : 'send'))}</button>${c.self.submittedAt ? '' : `<button class="soft" data-save="${esc(c.id)}">${esc(tr('saveLater'))}</button>`}</div></div>`).join('') || `<p class="hint" style="margin:0">${esc(tr('noSelf'))}</p>`;

  $('askList').innerHTML = data.requests.map((r) => {
    const k = reqKey(r); const name = r.subjectName || '';
    if (r.answered) return `<div class="item"><b>${esc(tr('about', { n: name }))}</b> <span class="tag good">${esc(tr('done'))}</span><br><span class="hint">${esc(r.cycleName)}</span></div>`;
    if (writing !== k) return `<div class="item"><b>${esc(tr('about', { n: name }))}</b>${r.late ? ` <span class="tag bad">${esc(tr('late'))}</span>` : ''}<br><span class="hint">${esc(r.cycleName)} · ${esc(tr('dueBy', { d: day(r.dueDate) }))}</span><div class="stack"><button class="go" data-write="${esc(k)}">${esc(tr('write'))}</button></div></div>`;
    return `<div class="item"><b>${esc(tr('about', { n: name }))}</b><br><span class="hint">${esc(r.cycleName)}</span><p class="private">${esc(tr('privacy', { n: name }))}</p><p class="hint" style="margin:0">${esc(tr('askHint'))}</p>
      ${r.questions.map((q) => `<label>${esc(qText(q.text))}<textarea maxlength="1500" data-k="peer|${esc(k)}|${esc(q.id)}" data-peer="${esc(q.id)}">${esc(val(`peer|${k}|${q.id}`))}</textarea></label>`).join('')}
      <label>${esc(tr('rating'))}<select data-k="rate|${esc(k)}" id="peerRating"><option value="">${esc(tr('noRating'))}</option>${[5, 4, 3, 2, 1].map((n) => `<option value="${n}"${val(`rate|${k}`) === String(n) ? ' selected' : ''}>${n} - ${esc(tr(`r${n}`))}</option>`).join('')}</select></label>
      <div class="stack"><button class="go" data-give="${esc(k)}">${esc(tr('sendFeedback'))}</button><button class="soft" data-cancel>${esc(tr('cancel'))}</button></div></div>`;
  }).join('') || `<p class="hint" style="margin:0">${esc(tr('noAsk'))}</p>`;

  $('pastCard').hidden = !past.length;
  $('pastList').innerHTML = past.map((c) => {
    const f = c.coworkerFeedback;
    return `<div class="item">${head(c)}<br><span class="hint">${esc(tr('period', { a: day(c.periodStart), b: day(c.periodEnd) }))}</span>
      ${c.self ? `<h3>${esc(tr('mySelf'))}</h3>${c.self.submittedAt ? c.self.questions.map((q) => `<span class="hint">${esc(qText(q.text))}</span><div class="pre">${esc(c.self.answers[q.id] || '')}</div>`).join('') : `<p class="hint">${esc(tr('noSelfPast'))}</p>`}` : ''}
      ${f && f.willBeShared ? `<h3>${esc(tr('coTitle'))}</h3>${f.hidden ? `<p class="hint">${esc(tr('coHidden'))}</p>` : `<p class="hint">${esc(tr('coNote'))}</p>${f.rating ? `<p><b>${esc(tr('avg', { n: f.rating.average }))}</b></p>` : ''}${f.questions.map((q) => `<span class="hint">${esc(qText(q.text))}</span>${q.comments.map((t) => `<div class="quote">${esc(t)}</div>`).join('') || `<p class="hint">${esc(tr('noneHere'))}</p>`}`).join('')}`}` : ''}
      ${c.managerReview ? `<p class="hint">${esc(tr('mgr'))}</p>` : ''}</div>`;
  }).join('');
}
async function load() { data = await req('GET', '/mine'); paint(); }
const forget = (prefix) => Object.keys(typed).forEach((k) => { if (k.startsWith(prefix)) delete typed[k]; });

async function saveSelf(id, submit) {
  const answers = {}; document.querySelectorAll(`textarea[data-self="${CSS.escape(id)}"]`).forEach((t) => { answers[t.dataset.q] = t.value; });
  await req('PUT', `/${id}/self`, { answers, submit });
  keep(); forget(`self|${id}|`); await load(); say(tr(submit ? 'sentMsg' : 'saved'));
}
document.addEventListener('click', async (e) => {
  let t; const el = (k) => e.target.closest(`[data-${k}]`);
  try {
    if ((t = el('l'))) { keep(); lang = t.dataset.l; try { localStorage.setItem('kylrx_lang', lang); } catch (_) {} paint(); }
    else if ((t = el('save'))) { t.disabled = true; try { await saveSelf(t.dataset.save, false); } finally { t.disabled = false; } }
    else if ((t = el('send'))) { t.disabled = true; try { await saveSelf(t.dataset.send, true); } finally { t.disabled = false; } }
    else if ((t = el('write'))) { keep(); writing = t.dataset.write; $('msg').className = ''; paint(); }
    else if (el('cancel')) { keep(); writing = null; paint(); }
    else if ((t = el('give'))) {
      const r = data.requests.find((x) => reqKey(x) === t.dataset.give); if (!r) return;
      const answers = {}; document.querySelectorAll('textarea[data-peer]').forEach((a) => { answers[a.dataset.peer] = a.value; });
      if (!Object.values(answers).some((v) => v.trim())) { say(tr('askHint'), false); return; }
      if (!window.confirm(tr('confirmSend'))) return;
      t.disabled = true;
      try { await req('POST', `/${r.cycleId}/peer-answers/${encodeURIComponent(r.subjectId)}`, { answers, rating: $('peerRating').value || null }); } finally { t.disabled = false; }
      keep(); forget(`peer|${t.dataset.give}|`); forget(`rate|${t.dataset.give}`); writing = null; await load(); say(tr('thanks'));
    }
  } catch (err) { say(err.message, false); }
});
paint();
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'login.html'; return; }
  try { await load(); } catch (_) { say(tr('fail'), false); }
});
</script>
</body>
</html>
