<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home | Kylrx AI</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--bg:#f8fafc}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px}
h1{margin:0;font-size:20px}h2{margin:0 0 10px;font-size:16px}.hint{color:var(--muted);font-size:13px}
main{max-width:1100px;margin:0 auto;padding:24px;display:grid;gap:22px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
a.tile{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;text-decoration:none;color:var(--ink)}a.tile:hover,a.tile:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 2px #dbeafe}
a.tile b{display:block;font-size:15px}a.tile span{color:var(--muted);font-size:13px}
button{padding:8px 14px;border:0;border-radius:8px;background:#e2e8f0;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
#msg{display:none;background:#fee2e2;color:#b91c1c;border-radius:8px;padding:10px 14px}
</style>
</head>
<body>
<header><div><h1 id="hello">Home</h1><span class="hint" id="role"></span></div><button id="out">Sign out</button></header>
<main>
  <div id="msg" role="alert"></div>
  <section id="workSec" hidden><h2>Company work</h2><div class="cards" id="work"></div></section>
  <section><h2>My own</h2><div class="cards" id="mine"></div></section>
</main>
<script type="module">
import { auth, onAuthStateChanged } from './firebase-config.js';
const $ = (id) => document.getElementById(id);
// Each company page with the permissions that open it (any one is enough), matching the server routes
const PAGES = [
  ['admin-dashboard.html', 'Owner dashboard', 'Every menu in one place', ['security.manage']],
  ['admin-us-people.html', 'People', 'Add people, profiles, tax and pay forms', ['people.read']],
  ['admin-us-org.html', 'Company structure', 'Locations, departments, pay schedules, holidays', ['people.read', 'org.settings']],
  ['admin-us-changes.html', 'Profile changes', 'Approve name, address and bank changes', ['people.read']],
  ['admin-us-hiring.html', 'Hiring', 'Job openings and candidates', ['hiring.view']],
  ['admin-us-hiring-compliance.html', 'Hiring checks', 'Background checks, E-Verify, new-hire reporting', ['background.manage', 'compliance.view']],
  ['admin-us-esign.html', 'Documents to sign', 'Send documents and see what is signed', ['compliance.view', 'onboarding.manage']],
  ['admin-us-time.html', 'Time', 'Timesheets, approvals, corrections', ['time.approve', 'time.approve_team', 'time.view_all']],
  ['admin-us-schedule.html', 'Schedule', 'Shifts, swaps, jobs', ['time.approve', 'time.approve_team']],
  ['admin-us-clock.html', 'Time clock rules', 'Photos, work site area, notices', ['time.manage_rules']],
  ['admin-us-wages.html', 'Wages and tips', 'Minimum wage checks and tip pools', ['time.manage_rules', 'people.read_pay']],
  ['admin-us-leave.html', 'Time off', 'Policies, requests, balances', ['leave.decide', 'leave.decide_team', 'leave.view_all']],
  ['admin-us-leave-cases.html', 'Leave cases', 'Medical, family and other longer leave', ['leave.decide', 'leave.view_all']],
  ['admin-us-benefits.html', 'Benefits', 'Plans, enrollment, life events', ['benefits.view']],
  ['admin-us-pay.html', 'Pay and contractors', 'Pay changes, direct deposit, 1099', ['people.read_pay']],
  ['admin-us-payroll.html', 'Payroll', 'Run payroll through Gusto', ['payroll.view']],
  ['admin-us-reports.html', 'Reports', 'Headcount, hours, time off, paperwork', ['reports.view']],
  ['admin-us-compliance.html', 'Compliance', 'Documents, notices, EEO, injury log', ['compliance.view']],
  ['admin-us-calendar.html', 'Compliance calendar', 'Every dated duty in one list', ['compliance.view', 'people.read']],
  ['admin-us-checklists.html', 'Checklists', 'New-hire and leaving tasks', ['people.write']],
  ['admin-us-i9-report.html', 'I-9 audit report', 'Printable list of every form', ['reports.view']],
  ['admin-us-performance.html', 'Goals and reviews', 'Team goals and performance reviews', ['people.read', 'people.read_team', 'people.write']],
  ['admin-us-surveys.html', 'Surveys', 'Ask the team short questions and see the results', ['people.read', 'people.write', 'reports.view']],
  ['admin-us-assets.html', 'Equipment', 'Laptops, keys, uniforms: who has what', ['people.read', 'people.read_team', 'people.write']],
  ['admin-us-policies.html', 'Policies', 'Write company policies and see who has read them', ['people.read', 'people.write']],
  ['admin-us-review-cycles.html', 'Review rounds', 'Self reviews, manager reviews and coworker feedback', ['people.read', 'people.read_team', 'people.write']],
  ['admin-us-recognition.html', 'News and thanks', 'Company announcements and thank-you notes', ['people.read', 'people.write']],
  ['admin-us-pay-schedule.html', 'Pay schedule', 'Pay periods and pay dates', ['payroll.view', 'org.settings']],
  ['admin-us-payroll-import.html', 'Bring in past payroll', 'Load pay history from before this system', ['payroll.run']],
  ['admin-us-exit-interviews.html', 'Exit interviews', 'Why people leave', ['people.write']],
  ['admin-us-report-builder.html', 'Report builder', 'Make your own lists and download them', ['reports.view']],
  ['admin-us-offboarding.html', 'Offboarding', 'Terminations and final steps', ['people.write']],
  ['admin-us-privacy.html', 'Privacy requests', 'Data copies and deletions', ['privacy.manage']],
  ['admin-us-integrations.html', 'Integrations', 'API keys, webhooks, connected apps', ['integrations.view', 'integrations.manage']],
  ['admin-us-owner.html', 'Owner settings', 'Activity log, roles, billing', ['security.manage', 'audit.view', 'billing.manage']],
  ['admin-us-security.html', 'Security and sign-in', 'Single sign-on and sign-in rules', ['security.manage']]
];
const MINE = [
  ['punch.html', 'Clock in and out', 'Start and end your day'], ['timesheet.html', 'My hours', 'Check and send your week'], ['my-schedule.html', 'My schedule', 'Shifts, swaps, availability'],
  ['leave.html', 'Time off', 'Ask for days off'], ['my-pay.html', 'My pay stubs', 'What you were paid'], ['my-goals.html', 'My goals', 'Goals and reviews'], ['my-surveys.html', 'Surveys', 'Short questions from the company'], ['my-assets.html', 'My equipment', 'Company items you have'], ['my-policies.html', 'Company policies', 'Read the rules and confirm you read them'], ['my-news.html', 'Company news', 'Announcements and thanks'], ['my-reviews.html', 'My reviews', 'Your review and feedback for coworkers'], ['my-exit-interview.html', 'Exit interview', 'If you are leaving the company'], ['my-benefits.html', 'My benefits', 'Coverage and enrollment'],
  ['my-documents.html', 'My documents', 'Files and things to sign'], ['my-profile.html', 'My details', 'Phone, address, bank, contacts'], ['my-privacy.html', 'My privacy', 'Ask about your data']
];
const tile = ([href, name, text]) => { const a = document.createElement('a'); a.className = 'tile'; a.href = href; const b = document.createElement('b'); b.textContent = name; const s = document.createElement('span'); s.textContent = text; a.append(b, s); return a; };

$('out').addEventListener('click', async () => { try { await auth.signOut(); } catch (_) { /* go to login either way */ } window.location.replace('login.html'); });
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.replace('login.html'); return; }
  $('mine').replaceChildren(...MINE.map(tile));
  try {
    const res = await fetch('/api/us/me/permissions', { headers: { Authorization: `Bearer ${await user.getIdToken()}` } });
    const me = await res.json();
    if (!res.ok) throw new Error(me.error || 'failed');
    $('hello').textContent = user.displayName ? `Hello, ${user.displayName.split(' ')[0]}` : 'Home'; $('role').textContent = me.roleLabel || '';
    const has = new Set(me.permissions || []);
    const open = PAGES.filter((p) => p[3].some((x) => has.has(x)));
    $('workSec').hidden = open.length === 0; $('work').replaceChildren(...open.map(tile));
  } catch (_) { $('msg').textContent = 'Could not load your menu. Your own pages below still work.'; $('msg').style.display = 'block'; }
});
</script>
</body>
</html>
