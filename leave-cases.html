<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family and medical leave</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--green:#16a34a;--red:#dc2626;--amber:#d97706;--bg:#f1f5f9}
*{box-sizing:border-box}body{margin:0;font:18px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#fff;border-bottom:1px solid var(--line)}
.lang button{font:inherit;font-weight:700;padding:6px 14px;border-radius:999px;border:2px solid #cbd5e1;background:#fff;margin-left:6px}.lang button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:640px;margin:0 auto;padding:18px 14px 60px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
h2{margin:0 0 8px;font-size:20px}p.s{margin:4px 0 0;color:var(--muted);font-size:15px}
label.f{display:grid;gap:6px;margin:12px 0;font-weight:600}
input,select,textarea{width:100%;max-width:100%;padding:14px;border:2px solid var(--line);border-radius:12px;font:inherit;background:#fff}
button.go{width:100%;padding:18px;border:0;border-radius:14px;background:var(--blue);color:#fff;font:700 20px system-ui;margin-top:8px;cursor:pointer}
.case{padding:14px 0;border-top:1px solid var(--line)}.case:first-of-type{border-top:0}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:14px;font-weight:700;background:#fef3c7;color:#92400e}.chip.good{background:#dcfce7;color:#166534}.chip.bad{background:#fee2e2;color:#b91c1c}
.cancel{border:0;background:#fee2e2;color:#b91c1c;border-radius:10px;padding:8px 12px;font:700 15px system-ui;cursor:pointer;margin-top:8px}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--blue)}
#msg{display:none;padding:14px;border-radius:12px;font-weight:600;white-space:pre-line}#msg.ok{display:block;background:#dcfce7;color:#166534}#msg.err{display:block;background:#fee2e2;color:#b91c1c}
.note{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:12px;padding:12px;font-size:15px}
.back{display:block;text-align:center;color:var(--muted);padding:10px}
.dl{font-size:15px;margin-top:4px}.dl.over{color:var(--red);font-weight:700}
</style>
</head>
<body>
<header><b id="title"></b><div class="lang"><button data-l="en">EN</button><button data-l="es">ES</button></div></header>
<main>
  <div id="msg" role="status"></div>
  <section class="card" id="balCard" hidden><h2 id="hBal"></h2><div id="bal"></div></section>
  <section class="card">
    <h2 id="hReq"></h2>
    <form id="form">
      <label class="f"><span id="lType"></span><select name="typeKey" id="type"></select></label>
      <div id="fmlaBox" hidden>
        <label class="f"><span id="lReason"></span><select name="fmlaReason" id="reason"></select></label>
        <label class="f"><span id="lPattern"></span><select name="pattern" id="pattern"></select></label>
      </div>
      <label class="f"><span id="lFrom"></span><input type="date" name="startDate" required></label>
      <label class="f"><span id="lTo"></span><input type="date" name="endDate"></label>
      <label class="f"><span id="lNote"></span><textarea name="reason" rows="2" maxlength="500"></textarea></label>
      <button class="go" type="submit" id="send"></button>
    </form>
    <p class="s" id="legal"></p>
  </section>
  <section class="card"><h2 id="hMine"></h2><div id="mine"></div></section>
  <a class="back" href="#" id="back"></a>
</main>

<script type="module">
import { auth, onAuthStateChanged } from './firebase-config.js';

const STATUS = {
  en: { requested: 'Request received', eligibility_noticed: 'HR sent you an eligibility notice', certification_requested: 'We need a medical certification from you', certification_received: 'Certification received, HR is reviewing', designated: 'Approved', on_leave: 'On leave', returned: 'Back at work', closed: 'Closed', denied: 'Not approved', cancelled: 'Cancelled' },
  es: { requested: 'Solicitud recibida', eligibility_noticed: 'RR. HH. le envió un aviso de elegibilidad', certification_requested: 'Necesitamos un certificado médico suyo', certification_received: 'Certificado recibido, RR. HH. lo revisa', designated: 'Aprobado', on_leave: 'De licencia', returned: 'De regreso al trabajo', closed: 'Cerrado', denied: 'No aprobado', cancelled: 'Cancelado' }
};
const T = {
  en: { title: 'Family and medical leave', hBal: 'My family and medical leave', hReq: 'Ask for leave', hMine: 'My requests', lType: 'What kind of leave?', lReason: 'Reason', lPattern: 'How will you be off?', lFrom: 'First day', lTo: 'Last day (leave empty if you do not know yet)', lNote: 'Tell HR more (optional)', send: 'Send request',
    own_health: 'My own health condition', family_care: 'Caring for a family member', bonding: 'New child (birth, adoption, foster)', military_exigency: 'Military family need', military_caregiver: 'Caring for a service member',
    continuous: 'Away for a block of days', intermittent: 'Off and on (appointments, flare-ups)', reduced: 'Fewer hours each week',
    legal: 'HR decides every request. Leave rules differ by state: HR will tell you what applies to you.', none: 'No requests yet.', cancel: 'Cancel request', sent: 'Request sent. HR will contact you.', cancelled_ok: 'Request cancelled.', back: 'Back', fail: 'Could not reach the server.',
    eligible: 'You meet the requirements for federal family and medical leave.', notEligible: 'You do not meet every requirement right now. HR will explain.',
    protectedJob: 'Your job is protected during this leave.', remaining: '{h} hours left of {t} in this year', used: '{h} hours used', due: 'Due {d}', overdue: 'Overdue: {d}', noteWarn: 'Note: {w}', confirmCancel: 'Cancel this request?', until: 'to', checks: 'Checks' },
  es: { title: 'Licencia familiar y médica', hBal: 'Mi licencia familiar y médica', hReq: 'Pedir licencia', hMine: 'Mis solicitudes', lType: '¿Qué tipo de licencia?', lReason: 'Motivo', lPattern: '¿Cómo estará ausente?', lFrom: 'Primer día', lTo: 'Último día (déjelo vacío si aún no lo sabe)', lNote: 'Cuéntele más a RR. HH. (opcional)', send: 'Enviar solicitud',
    own_health: 'Mi propia condición de salud', family_care: 'Cuidar a un familiar', bonding: 'Hijo nuevo (nacimiento, adopción, acogida)', military_exigency: 'Necesidad de familia militar', military_caregiver: 'Cuidar a un miembro del servicio',
    continuous: 'Ausente varios días seguidos', intermittent: 'De vez en cuando (citas, crisis)', reduced: 'Menos horas por semana',
    legal: 'RR. HH. decide cada solicitud. Las reglas de licencia cambian según el estado: RR. HH. le dirá cuáles le aplican.', none: 'Aún no hay solicitudes.', cancel: 'Cancelar solicitud', sent: 'Solicitud enviada. RR. HH. se comunicará con usted.', cancelled_ok: 'Solicitud cancelada.', back: 'Volver', fail: 'No se pudo conectar.',
    eligible: 'Usted cumple los requisitos de la licencia familiar y médica federal.', notEligible: 'Por ahora no cumple todos los requisitos. RR. HH. se lo explicará.',
    protectedJob: 'Su empleo está protegido durante esta licencia.', remaining: 'Le quedan {h} horas de {t} este año', used: '{h} horas usadas', due: 'Fecha límite {d}', overdue: 'Vencido: {d}', noteWarn: 'Nota: {w}', confirmCancel: '¿Cancelar esta solicitud?', until: 'a', checks: 'Requisitos' }
};
let lang = (navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en';
try { lang = localStorage.getItem('kylrx_lang') || lang; } catch (_) {}
const $ = (id) => document.getElementById(id);
const tr = (k, v = {}) => (T[lang][k] || k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let types = []; let cases = []; let elig = null;
const FMLA_REASONS = ['own_health', 'family_care', 'bonding', 'military_exigency', 'military_caregiver'];
const PATTERNS = ['continuous', 'intermittent', 'reduced'];

function show(kind, text) { const m = $('msg'); m.textContent = text; m.className = kind; window.scrollTo({ top: 0, behavior: 'smooth' }); }
async function api(method, path, body) {
  const token = await auth.currentUser.getIdToken();
  const res = await fetch(`/api/us/leave-cases${path}`, { method, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }, body: body ? JSON.stringify(body) : undefined });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((json.errors && json.errors.join('\n')) || json.error || tr('fail'));
  return json;
}

function paint() {
  document.documentElement.lang = lang; document.title = tr('title'); $('title').textContent = tr('title');
  document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.l === lang));
  ['hBal', 'hReq', 'hMine', 'lType', 'lReason', 'lPattern', 'lFrom', 'lTo', 'lNote'].forEach((k) => { $(k).textContent = tr(k); });
  $('send').textContent = tr('send'); $('back').textContent = tr('back'); $('legal').textContent = tr('legal');
  const cur = $('type').value;
  $('type').innerHTML = types.map((t) => `<option value="${esc(t.key)}">${esc(lang === 'es' ? t.labelEs : t.label)}</option>`).join(''); if (cur) $('type').value = cur;
  const r0 = $('reason').value; $('reason').innerHTML = FMLA_REASONS.map((k) => `<option value="${k}">${tr(k)}</option>`).join(''); if (r0) $('reason').value = r0;
  const p0 = $('pattern').value; $('pattern').innerHTML = PATTERNS.map((k) => `<option value="${k}">${tr(k)}</option>`).join(''); if (p0) $('pattern').value = p0;
  $('fmlaBox').hidden = $('type').value !== 'fmla';

  const fm = cases.find((c) => c.balance && !['denied', 'cancelled'].includes(c.status));
  $('balCard').hidden = !(elig || fm);
  let html = '';
  if (elig) html += `<p class="s"><span class="chip ${elig.eligible ? 'good' : ''}">${tr(elig.eligible ? 'eligible' : 'notEligible')}</span></p>`;
  if (fm) { const b = fm.balance; const pct = Math.min(100, Math.round((b.usedHours / b.entitlementHours) * 100)); html += `<div class="bar"><i style="width:${pct}%"></i></div><p class="s">${tr('used', { h: b.usedHours })}. ${tr('remaining', { h: b.remainingHours, t: b.entitlementHours })}</p>`; }
  $('bal').innerHTML = html;

  $('mine').innerHTML = cases.map((c) => {
    const label = (types.find((t) => t.key === c.typeKey) || {})[lang === 'es' ? 'labelEs' : 'label'] || c.typeLabel;
    const good = ['designated', 'on_leave', 'returned'].includes(c.status); const bad = ['denied', 'cancelled'].includes(c.status);
    const dls = (c.deadlineList || []).filter((d) => !d.done && ['certification', 'recertification'].includes(d.key)).map((d) => `<div class="dl ${d.overdue ? 'over' : ''}">${esc(d.label)}: ${tr(d.overdue ? 'overdue' : 'due', { d: d.due })}</div>`).join('');
    const canCancel = ['requested', 'eligibility_noticed', 'certification_requested', 'certification_received', 'designated'].includes(c.status);
    return `<div class="case"><b>${esc(label)}</b> <p class="s">${esc(c.startDate)}${c.endDate ? ` ${tr('until')} ${esc(c.endDate)}` : ''}</p><p><span class="chip ${good ? 'good' : bad ? 'bad' : ''}">${esc(STATUS[lang][c.status] || c.status)}</span></p>${c.jobProtected ? `<p class="s">${tr('protectedJob')}</p>` : ''}${dls}${canCancel ? `<button class="cancel" data-cancel="${esc(c.id)}">${tr('cancel')}</button>` : ''}</div>`;
  }).join('') || `<p class="s">${tr('none')}</p>`;
}
async function load() {
  const [t, m, e] = await Promise.all([api('GET', '/types'), api('GET', '/mine'), api('GET', '/eligibility/me').catch(() => null)]);
  types = t.data; cases = m.data; elig = e ? e.data : null; paint();
}
document.querySelectorAll('.lang button').forEach((b) => b.addEventListener('click', () => { lang = b.dataset.l; try { localStorage.setItem('kylrx_lang', lang); } catch (_) {} paint(); }));
$('type').addEventListener('change', () => { $('fmlaBox').hidden = $('type').value !== 'fmla'; });
$('form').addEventListener('submit', async (e) => {
  e.preventDefault(); const f = new FormData(e.target);
  const body = { typeKey: f.get('typeKey'), startDate: f.get('startDate'), endDate: f.get('endDate') || undefined, reason: f.get('reason'), pattern: f.get('typeKey') === 'fmla' ? f.get('pattern') : 'continuous' };
  if (body.typeKey === 'fmla') body.fmlaReason = f.get('fmlaReason');
  try { const r = await api('POST', '/requests', body); show('ok', [tr('sent'), ...(r.warnings || []).map((w) => tr('noteWarn', { w }))].join('\n')); e.target.reset(); await load(); } catch (err) { show('err', err.message); }
});
$('mine').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-cancel]'); if (!b || !window.confirm(tr('confirmCancel'))) return;
  try { await api('POST', `/${b.dataset.cancel}/cancel`, {}); show('ok', tr('cancelled_ok')); await load(); } catch (err) { show('err', err.message); }
});
$('back').addEventListener('click', (e) => { e.preventDefault(); window.history.back(); });
paint();
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.replace('login.html'); return; }
  try { await load(); } catch (err) { show('err', err.message); }
});
</script>
</body>
</html>
