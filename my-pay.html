<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My pay | Kylrx AI</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--bg:#f8fafc}
*{box-sizing:border-box}body{margin:0;font:18px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#fff;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:22px}.lang button{padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-size:15px;cursor:pointer}.lang button.on{background:var(--ink);color:#fff}
main{max-width:560px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.date{font-size:15px;color:var(--muted)}.net{font-size:30px;font-weight:800;margin:4px 0}.line{display:flex;justify-content:space-between;font-size:16px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
#msg{display:none;background:#fee2e2;color:#b91c1c;border-radius:10px;padding:12px}
h2{margin:6px 0 0;font-size:19px}.form{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.form b{font-size:18px}
.form button{min-height:48px;padding:10px 16px;border:0;border-radius:10px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer}.form button:disabled{opacity:.5}
a.back{display:block;text-align:center;color:var(--blue);font-weight:700;padding:14px;text-decoration:none}
</style>
</head>
<body>
<header><h1 id="title"></h1><div class="lang"><button data-l="en">English</button> <button data-l="es">Español</button></div></header>
<main>
  <div id="msg" role="alert"></div>
  <div id="list"></div>
  <section id="formsWrap" hidden><h2 id="formsTitle"></h2><p class="date" id="formsHelp"></p><div id="forms"></div></section>
  <a class="back" href="punch.html" id="back"></a>
</main>
<script type="module">
import { auth, onAuthStateChanged } from './firebase-config.js';
const $ = (id) => document.getElementById(id);
const T = {
  en: { title: 'My pay', back: 'Back to the clock', none: 'No pay stubs yet. They show here after your first payday.', net: 'You received', gross: 'Total earned before taxes', period: 'Work from {a} to {b}', paid: 'Paid on {d}', fail: 'Could not load your pay. Try again.', loading: 'Loading...', formsTitle: 'My tax forms', formsHelp: 'Your W-2 for each year, once it is ready.', formsNone: 'No tax forms yet. Your W-2 shows here in January after the year ends.', w2: 'W-2 for {y}', w2NoYear: 'W-2', download: 'Download', notReady: 'Not ready yet', dlFail: 'Could not download the form. Try again.' },
  es: { title: 'Mi pago', back: 'Volver al reloj', none: 'Todavía no hay recibos de pago. Aparecen aquí después de su primer día de pago.', net: 'Usted recibió', gross: 'Total ganado antes de impuestos', period: 'Trabajo del {a} al {b}', paid: 'Pagado el {d}', fail: 'No se pudo cargar su pago. Intente de nuevo.', loading: 'Cargando...', formsTitle: 'Mis formularios de impuestos', formsHelp: 'Su W-2 de cada año, cuando esté listo.', formsNone: 'Todavía no hay formularios. Su W-2 aparece aquí en enero, después de terminar el año.', w2: 'W-2 de {y}', w2NoYear: 'W-2', download: 'Descargar', notReady: 'Aún no está listo', dlFail: 'No se pudo descargar el formulario. Intente de nuevo.' }
};
let lang = (navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en';
try { lang = localStorage.getItem('kylrx_lang') || lang; } catch (_) {}
if (!T[lang]) lang = 'en';
const tr = (k, v = {}) => (T[lang][k] || k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => `$${Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
const day = (d) => (d ? new Date(`${d}T12:00:00`).toLocaleDateString(lang === 'es' ? 'es-US' : 'en-US', { dateStyle: 'long' }) : '');
let stubs = null; let failed = false; let forms = null; let formFailed = false;

function paint() {
  document.documentElement.lang = lang;
  $('title').textContent = tr('title'); $('back').textContent = tr('back');
  document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.l === lang));
  $('msg').style.display = failed ? 'block' : 'none'; $('msg').textContent = failed ? tr('fail') : '';
  // tax forms: shown once the list has loaded (also when there are none, so people know where to look)
  $('formsWrap').hidden = forms === null;
  $('formsTitle').textContent = tr('formsTitle'); $('formsHelp').textContent = tr('formsHelp');
  if (forms !== null) {
    $('forms').innerHTML = (formFailed ? `<div class="card" style="margin-bottom:12px;color:#b91c1c" role="alert">${esc(tr('dlFail'))}</div>` : '') + (forms.length ? forms.map((f) => `<div class="card form"><b>${esc(f.year ? tr('w2', { y: f.year }) : tr('w2NoYear'))}</b>${f.draft ? `<span class="date">${esc(tr('notReady'))}</span>` : `<button type="button" data-form="${esc(f.id)}">${esc(tr('download'))}</button>`}</div>`).join('') : `<div class="card empty">${esc(tr('formsNone'))}</div>`);
  }
  if (stubs === null) { $('list').innerHTML = failed ? '' : `<div class="empty">${esc(tr('loading'))}</div>`; return; }
  $('list').innerHTML = stubs.length ? stubs.map((s) => {
    const p = s.pay_period || {};
    return `<div class="card" style="margin-bottom:14px"><div class="date">${esc(tr('paid', { d: day(s.check_date) }))}</div><div class="line"><span>${esc(tr('net'))}</span></div><div class="net">${money(s.net_pay)}</div><div class="line"><span>${esc(tr('gross'))}</span><span>${money(s.gross_pay)}</span></div>${p.start_date ? `<div class="date" style="margin-top:6px">${esc(tr('period', { a: day(p.start_date), b: day(p.end_date) }))}</div>` : ''}</div>`;
  }).join('') : `<div class="card empty">${esc(tr('none'))}</div>`;
}
document.querySelectorAll('.lang button').forEach((b) => b.addEventListener('click', () => { lang = b.dataset.l; try { localStorage.setItem('kylrx_lang', lang); } catch (_) {} paint(); }));
// The PDF comes through our own server with the person's sign-in; no outside link is ever opened.
$('forms').addEventListener('click', async (ev) => {
  const b = ev.target.closest('button[data-form]'); if (!b) return;
  b.disabled = true; formFailed = false;
  try {
    const res = await fetch(`/api/us/gusto/my/tax-forms/${encodeURIComponent(b.dataset.form)}/pdf`, { headers: { Authorization: `Bearer ${await auth.currentUser.getIdToken()}` } });
    if (!res.ok) throw new Error('failed');
    const name = (/filename="([^"]+)"/.exec(res.headers.get('Content-Disposition') || '') || [])[1] || 'W-2.pdf';
    const a = document.createElement('a'); a.href = URL.createObjectURL(await res.blob()); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 30000);
    b.disabled = false;
  } catch (_) { formFailed = true; paint(); }
});
paint();
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'login.html'; return; }
  try {
    const res = await fetch('/api/us/gusto/my/pay-stubs', { headers: { Authorization: `Bearer ${await user.getIdToken()}` } });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error || 'failed');
    stubs = (json.data || []).slice().sort((a, b) => String(b.check_date).localeCompare(String(a.check_date)));
  } catch (_) { failed = true; }
  paint();
  // tax forms load on their own: a problem here never hides the pay stubs, the section just stays away
  try {
    const res = await fetch('/api/us/gusto/my/tax-forms', { headers: { Authorization: `Bearer ${await user.getIdToken()}` } });
    const json = await res.json().catch(() => ({}));
    if (res.ok) forms = json.data || [];
  } catch (_) { forms = null; }
  paint();
});
</script>
</body>
</html>
