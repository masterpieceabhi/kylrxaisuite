<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My tips</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--green:#16a34a;--red:#dc2626;--amber:#d97706;--bg:#f1f5f9}
*{box-sizing:border-box}body{margin:0;font:18px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#fff;border-bottom:1px solid var(--line)}
.lang button{font:inherit;font-weight:700;padding:6px 14px;border-radius:999px;border:2px solid #cbd5e1;background:#fff;margin-left:6px}.lang button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:640px;margin:0 auto;padding:18px 14px 60px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
h2{margin:0 0 8px;font-size:20px}p.s{margin:0;color:var(--muted);font-size:15px}
.big{font-size:38px;font-weight:800}
label.f{display:grid;gap:6px;margin:12px 0;font-weight:600}
input,textarea{width:100%;max-width:100%;padding:14px;border:2px solid var(--line);border-radius:12px;font:inherit;background:#fff}
button.go{width:100%;padding:18px;border:0;border-radius:14px;background:var(--blue);color:#fff;font:700 20px system-ui;margin-top:8px;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.chip{padding:3px 10px;border-radius:999px;font-size:14px;font-weight:700;background:#fef3c7;color:#92400e}
.del{border:0;background:#fee2e2;color:#b91c1c;border-radius:10px;padding:8px 12px;font:700 15px system-ui;cursor:pointer}
#msg{display:none;padding:14px;border-radius:12px;font-weight:600}#msg.ok{display:block;background:#dcfce7;color:#166534}#msg.err{display:block;background:#fee2e2;color:#b91c1c}
.back{display:block;text-align:center;color:var(--muted);padding:10px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}.mnav button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 16px;font:700 18px system-ui;cursor:pointer}
</style>
</head>
<body>
<header><b id="title">My tips</b><div class="lang"><button data-l="en">EN</button><button data-l="es">ES</button></div></header>
<main>
  <div id="msg" role="status"></div>
  <section class="card" id="notTipped" hidden><h2 id="hNot"></h2><p class="s" id="pNot"></p></section>
  <section class="card" id="summary"><h2 id="hSum"></h2>
    <div class="mnav"><button id="prev" aria-label="previous">&lt;</button><b id="monthName"></b><button id="next" aria-label="next">&gt;</button></div>
    <div class="big" id="total"></div><p class="s" id="split"></p><p class="s" id="flag"></p>
  </section>
  <section class="card" id="formCard"><h2 id="hAdd"></h2>
    <form id="form">
      <label class="f"><span id="lDate"></span><input type="date" name="date" required></label>
      <label class="f"><span id="lCash"></span><input type="number" name="cashTips" inputmode="decimal" step="0.01" min="0.01" max="10000" required></label>
      <label class="f"><span id="lNote"></span><input type="text" name="note" maxlength="200"></label>
      <button class="go" type="submit" id="send"></button>
    </form>
    <p class="s" id="hint"></p>
  </section>
  <section class="card"><h2 id="hList"></h2><div id="list"></div></section>
  <a class="back" href="#" id="back"></a>
</main>

<script type="module">
import { auth, onAuthStateChanged } from './firebase-config.js';

const T = {
  en: { title: 'My tips', hSum: 'This month', hAdd: 'Write down cash tips', lDate: 'Day', lCash: 'Cash tips you got ($)', lNote: 'Note (optional)', send: 'Save', hList: 'Days this month', none: 'Nothing written down yet.',
    cash: 'Cash', card: 'Card (added by your manager)', total: 'Total', del: 'Remove', saved: 'Saved.', removed: 'Removed.', back: 'Back', fail: 'Could not reach the server.',
    flagYes: 'Over {t}: you must report your tips to your employer for this month.', flagNo: 'Under {t} this month. Tips below this amount are not reported to your employer.',
    hNot: 'Tips are not turned on for you', pNot: 'Ask HR if you receive tips at work.', hint: 'Card tips are added for you. You only write down cash tips.', confirmDel: 'Remove the cash tips for this day?' },
  es: { title: 'Mis propinas', hSum: 'Este mes', hAdd: 'Anote propinas en efectivo', lDate: 'Día', lCash: 'Propinas en efectivo ($)', lNote: 'Nota (opcional)', send: 'Guardar', hList: 'Días de este mes', none: 'Aún no ha anotado nada.',
    cash: 'Efectivo', card: 'Tarjeta (las agrega su supervisor)', total: 'Total', del: 'Quitar', saved: 'Guardado.', removed: 'Quitado.', back: 'Volver', fail: 'No se pudo conectar.',
    flagYes: 'Pasó de {t}: debe reportar sus propinas a su empleador este mes.', flagNo: 'Menos de {t} este mes. Las propinas por debajo de esta cantidad no se reportan al empleador.',
    hNot: 'Las propinas no están activadas para usted', pNot: 'Pregunte a Recursos Humanos si recibe propinas en el trabajo.', hint: 'Las propinas de tarjeta se agregan por usted. Usted solo anota las de efectivo.', confirmDel: '¿Quitar las propinas en efectivo de este día?' }
};
let lang = (navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en';
try { lang = localStorage.getItem('kylrx_lang') || lang; } catch (_) {}
const $ = (id) => document.getElementById(id);
const tr = (k, v = {}) => (T[lang][k] || k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => `$${Number(n || 0).toFixed(2)}`;
let data = null; let month = null;

function show(kind, text) { const m = $('msg'); m.textContent = text; m.className = kind; window.scrollTo({ top: 0, behavior: 'smooth' }); }
async function api(method, path, body) {
  const token = await auth.currentUser.getIdToken();
  const res = await fetch(`/api/us/tips${path}`, { method, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }, body: body ? JSON.stringify(body) : undefined });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((json.errors && json.errors.join('\n')) || json.error || tr('fail'));
  return json;
}
const shiftMonth = (m, n) => { const [y, mo] = m.split('-').map(Number); const d = new Date(Date.UTC(y, mo - 1 + n, 1)); return d.toISOString().slice(0, 7); };
const monthLabel = (m) => new Date(`${m}-01T00:00:00Z`).toLocaleDateString(lang === 'es' ? 'es-US' : 'en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' });

function paint() {
  document.documentElement.lang = lang; document.title = tr('title'); $('title').textContent = tr('title');
  document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.l === lang));
  ['hSum', 'hAdd', 'lDate', 'lCash', 'lNote', 'hList', 'hNot', 'pNot'].forEach((k) => { $(k).textContent = tr(k); });
  $('send').textContent = tr('send'); $('back').textContent = tr('back'); $('hint').textContent = tr('hint');
  if (!data) return;
  $('notTipped').hidden = data.tipped; $('formCard').hidden = !data.tipped;
  $('monthName').textContent = monthLabel(data.month);
  $('total').textContent = money(data.summary.total);
  $('split').textContent = `${tr('cash')} ${money(data.summary.cashTips)}  |  ${tr('card')} ${money(data.summary.cardTips)}`;
  $('flag').textContent = tr(data.summary.reportToEmployer ? 'flagYes' : 'flagNo', { t: money(data.threshold) });
  $('list').innerHTML = data.data.map((r) => `<div class="row"><div><b>${esc(r.date)}</b><p class="s">${tr('cash')} ${money(r.cashTips)}${r.cardTips ? ` + ${money(r.cardTips)}` : ''}${r.note ? ' - ' + esc(r.note) : ''}</p></div>${r.cashTips ? `<button class="del" data-del="${esc(r.date)}">${tr('del')}</button>` : ''}</div>`).join('') || `<p class="s">${tr('none')}</p>`;
}
async function load() {
  data = await api('GET', `/me${month ? `?month=${month}` : ''}`); month = data.month;
  const f = $('form').elements; f.date.max = data.today; if (!f.date.value) f.date.value = data.today;
  paint();
}
document.querySelectorAll('.lang button').forEach((b) => b.addEventListener('click', () => { lang = b.dataset.l; try { localStorage.setItem('kylrx_lang', lang); } catch (_) {} paint(); }));
$('prev').addEventListener('click', () => { month = shiftMonth(month, -1); load().catch((e) => show('err', e.message)); });
$('next').addEventListener('click', () => { month = shiftMonth(month, 1); load().catch((e) => show('err', e.message)); });
$('form').addEventListener('submit', async (e) => {
  e.preventDefault(); const f = new FormData(e.target);
  try { await api('POST', '/me', { date: f.get('date'), cashTips: Number(f.get('cashTips')), note: f.get('note') }); show('ok', tr('saved')); e.target.elements.cashTips.value = ''; e.target.elements.note.value = ''; month = String(f.get('date')).slice(0, 7); await load(); }
  catch (err) { show('err', err.message); }
});
$('list').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-del]'); if (!b || !window.confirm(tr('confirmDel'))) return;
  try { await api('DELETE', `/me/${b.dataset.del}`); show('ok', tr('removed')); await load(); } catch (err) { show('err', err.message); }
});
$('back').addEventListener('click', (e) => { e.preventDefault(); window.history.back(); });
paint();
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.replace('login.html'); return; }
  try { await load(); } catch (err) { show('err', err.message); }
});
</script>
</body>
</html>
