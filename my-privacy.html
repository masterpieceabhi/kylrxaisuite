<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My privacy | Kylrx AI</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--bg:#f8fafc;--ok:#166534;--bad:#b91c1c}
*{box-sizing:border-box}body{margin:0;font:18px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#fff;border-bottom:1px solid var(--line);gap:8px}
h1{margin:0;font-size:22px}h2{margin:0 0 10px;font-size:19px}
.lang button{padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}.lang button.on{background:var(--ink);color:#fff}
main{max-width:560px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.item{border-top:1px solid var(--line);padding:12px 0}.item:first-child{border-top:0;padding-top:0}
.hint{color:var(--muted);font-size:15px}
label{display:grid;gap:4px;font-size:15px;color:var(--muted);font-weight:600;margin:10px 0}
select,textarea{padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;width:100%;color:var(--ink);background:#fff}
button.go{padding:12px 16px;border:0;border-radius:10px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button.soft{padding:10px 14px;border:0;border-radius:10px;background:#eef2ff;color:var(--blue);font:inherit;font-size:16px;font-weight:700;cursor:pointer}
button.no{padding:10px 14px;border:0;border-radius:10px;background:#fee2e2;color:var(--bad);font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tag{padding:2px 10px;border-radius:999px;font-size:14px;font-weight:700}.good{background:#dcfce7;color:var(--ok)}.wait{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:var(--bad)}.grey{background:#e2e8f0;color:#475569}
#msg{display:none;border-radius:10px;padding:12px}#msg.ok{display:block;background:#dcfce7;color:var(--ok)}#msg.err{display:block;background:#fee2e2;color:var(--bad)}
a.back{display:block;text-align:center;color:var(--blue);font-weight:700;padding:14px;text-decoration:none}
</style>
</head>
<body>
<header><h1 data-t="title"></h1><div class="lang"><button data-l="en">English</button> <button data-l="es">Español</button></div></header>
<main>
  <div id="msg" role="status"></div>
  <section class="card">
    <h2 data-t="ask"></h2>
    <p class="hint" id="intro"></p>
    <form id="form">
      <label><span data-t="want"></span><select name="type" id="type"></select></label>
      <label><span id="detailLabel"></span><textarea name="details" rows="3" maxlength="2000"></textarea></label>
      <p class="hint" id="deleteNote" hidden></p>
      <button class="go" type="submit" data-t="send"></button>
    </form>
  </section>
  <section class="card"><h2 data-t="mine"></h2><div id="list"></div></section>
  <a class="back" href="punch.html" data-t="back"></a>
</main>
<script type="module">
import { auth, onAuthStateChanged } from './firebase-config.js';
const $ = (id) => document.getElementById(id);
const T = {
  en: { title: 'My privacy', back: 'Back to the clock', ask: 'Ask about my personal data', intro: 'You can ask your employer for a copy of your data, to fix it, to delete it, or to limit how it is used. We answer within {d} days.', want: 'I want to', details: 'Details (optional)', detailsFix: 'What is wrong, and what should it be?', deleteNote: 'Your employer must keep some records by law, such as pay and tax records, for a number of years. Those are not deleted. You will see what was deleted and what was kept.', send: 'Send request', sent: 'Sent. We answer by {d}.', mine: 'My requests', none: 'No requests yet.', by: 'Answer by {d}', get: 'Download my data', getHint: 'You can download it until {d}.', expired: 'The download time ended. Send a new request to get another copy.', cancel: 'Cancel request', cancelled: 'Request cancelled.', said: 'Answer:', deleted: 'Deleted', kept: 'Kept by law', fail: 'Could not load. Try again.', extended: 'The deadline was extended: {r}',
    s_received: 'Received', s_in_progress: 'Being worked on', s_completed: 'Done', s_denied: 'Denied', s_cancelled: 'Cancelled' },
  es: { title: 'Mi privacidad', back: 'Volver al reloj', ask: 'Preguntar por mis datos personales', intro: 'Puede pedir a su empleador una copia de sus datos, corregirlos, eliminarlos o limitar cómo se usan. Respondemos en un máximo de {d} días.', want: 'Quiero', details: 'Detalles (opcional)', detailsFix: '¿Qué está mal y cómo debe quedar?', deleteNote: 'Su empleador debe guardar algunos registros por ley, como los de pago e impuestos, durante varios años. Esos no se eliminan. Usted verá qué se eliminó y qué se guardó.', send: 'Enviar solicitud', sent: 'Enviado. Respondemos antes del {d}.', mine: 'Mis solicitudes', none: 'Todavía no hay solicitudes.', by: 'Respuesta antes del {d}', get: 'Descargar mis datos', getHint: 'Puede descargarlos hasta el {d}.', expired: 'El tiempo de descarga terminó. Envíe una nueva solicitud para obtener otra copia.', cancel: 'Cancelar solicitud', cancelled: 'Solicitud cancelada.', said: 'Respuesta:', deleted: 'Eliminado', kept: 'Guardado por ley', fail: 'No se pudo cargar. Intente de nuevo.', extended: 'El plazo se extendió: {r}',
    s_received: 'Recibida', s_in_progress: 'En proceso', s_completed: 'Lista', s_denied: 'Negada', s_cancelled: 'Cancelada' }
};
let lang = (navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en';
try { lang = localStorage.getItem('kylrx_lang') || lang; } catch (_) {}
if (!T[lang]) lang = 'en';
const tr = (k, v = {}) => (T[lang][k] ?? T.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const say = (t, ok = true) => { const m = $('msg'); m.textContent = t; m.className = ok ? 'ok' : 'err'; window.scrollTo({ top: 0, behavior: 'smooth' }); };
const day = (i, time) => (i ? new Date(i).toLocaleString(lang === 'es' ? 'es-US' : 'en-US', time ? { dateStyle: 'long', timeStyle: 'short' } : { dateStyle: 'long' }) : '');
let types = null; let rows = [];

async function req(method, path, body, raw) {
  const token = await auth.currentUser.getIdToken();
  const res = await fetch(`/api/us/privacy${path}`, { method, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }, body: body ? JSON.stringify(body) : undefined });
  if (raw) { if (!res.ok) { const j = await res.json().catch(() => ({})); throw new Error(j.error || `Request failed (${res.status})`); } return res; }
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((json.errors && json.errors.join('; ')) || (typeof json.error === 'string' ? json.error : '') || `Request failed (${res.status})`);
  return json;
}
function paintForm() { const t = $('type').value; $('detailLabel').textContent = tr(t === 'correct' ? 'detailsFix' : 'details'); $('deleteNote').hidden = t !== 'delete'; $('deleteNote').textContent = tr('deleteNote'); }
function paint() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = tr(el.dataset.t); });
  document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.l === lang));
  if (!types) return;
  $('intro').textContent = tr('intro', { d: types.responseDays });
  const keep = $('type').value; $('type').innerHTML = types.types.map((t) => `<option value="${esc(t.key)}">${esc(t[lang] || t.en)}</option>`).join(''); if (keep) $('type').value = keep; paintForm();
  const cls = { received: 'wait', in_progress: 'wait', completed: 'good', denied: 'bad', cancelled: 'grey' };
  $('list').innerHTML = rows.map((r) => {
    const open = ['received', 'in_progress'].includes(r.status); const label = r.typeLabel ? r.typeLabel[lang] || r.typeLabel.en : r.type;
    const del = r.deletionResult ? `<br><span class="hint">${r.deletionResult.table.filter((t) => t.result !== 'none' && t.result !== 'nothing').map((t) => `${esc(t.label || t.key)}: ${esc(['deleted', 'anonymized', 'partially_deleted'].includes(t.result) ? tr('deleted') : tr('kept'))}`).join('<br>')}</span>` : '';
    return `<div class="item"><b>${esc(label)}</b> <span class="tag ${cls[r.status] || 'grey'}">${esc(tr(`s_${r.status}`))}</span><br><span class="hint">${esc(day(r.receivedAt))}${open ? ` · ${esc(tr('by', { d: day(r.dueAt) }))}` : ''}</span>${r.extensionReason && open ? `<br><span class="hint">${esc(tr('extended', { r: r.extensionReason }))}</span>` : ''}${r.resolution && r.resolution.note ? `<br><span class="hint">${esc(tr('said'))} ${esc(r.resolution.note)}</span>` : ''}${del}${r.export ? (r.export.available ? `<div class="row"><button class="go" data-dl="${esc(r.id)}">${esc(tr('get'))}</button></div><span class="hint">${esc(tr('getHint', { d: day(r.export.expiresAt, true) }))}</span>` : `<br><span class="hint">${esc(tr('expired'))}</span>`) : ''}${open ? `<div class="row"><button class="no" data-cancel="${esc(r.id)}">${esc(tr('cancel'))}</button></div>` : ''}</div>`;
  }).join('') || `<p class="hint">${esc(tr('none'))}</p>`;
}
async function load() { rows = (await req('GET', '/requests/mine')).data; paint(); }
$('type').addEventListener('change', paintForm);
$('form').addEventListener('submit', async (e) => {
  e.preventDefault(); const f = e.target.elements;
  try { const r = await req('POST', '/requests', { type: f.type.value, details: f.details.value }); f.details.value = ''; await load(); say(tr('sent', { d: day(r.request.dueAt) })); } catch (err) { say(err.message, false); }
});
document.addEventListener('click', async (e) => {
  const el = (k) => e.target.closest(`[data-${k}]`);
  let t;
  try {
    if ((t = el('l'))) { lang = t.dataset.l; try { localStorage.setItem('kylrx_lang', lang); } catch (_) {} paint(); } else if ((t = el('dl'))) { const res = await req('GET', `/requests/${t.dataset.dl}/export/download?format=html&lang=${lang}`, null, true); const a = document.createElement('a'); a.href = URL.createObjectURL(await res.blob()); a.download = 'my-data.html'; document.body.appendChild(a); a.click(); a.remove(); await load(); } else if ((t = el('cancel'))) { await req('POST', `/requests/${t.dataset.cancel}/cancel`, {}); await load(); say(tr('cancelled')); }
  } catch (err) { say(err.message, false); }
});
paint();
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'login.html'; return; }
  try { types = await req('GET', '/types'); await load(); } catch (_) { say(tr('fail'), false); }
});
</script>
</body>
</html>
