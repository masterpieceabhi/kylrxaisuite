<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0f172a">
<title>Clock in / out</title>
<style>
:root{--green:#16a34a;--red:#dc2626;--amber:#d97706;--ink:#0f172a;--muted:#64748b;--bg:#f1f5f9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font:18px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#fff;border-bottom:1px solid #e2e8f0}
header b{font-size:20px}
.lang{display:flex;gap:6px}.lang button{font:inherit;font-weight:700;padding:8px 14px;border-radius:999px;border:2px solid #cbd5e1;background:#fff;color:var(--ink)}
.lang button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:22px 16px}
#hello{font-size:24px;font-weight:700;text-align:center}
#state{font-size:22px;text-align:center;color:var(--muted);min-height:2.6em}
#state strong{color:var(--ink)}
#big{width:min(74vw,320px);aspect-ratio:1;border-radius:50%;border:0;color:#fff;font:800 clamp(28px,8vw,40px)/1.1 system-ui;letter-spacing:.02em;box-shadow:0 14px 34px rgba(15,23,42,.28);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;transition:transform .12s}
#big:active{transform:scale(.96)}#big:disabled{opacity:.6}
#big small{display:block;font-size:.42em;font-weight:600;opacity:.9;margin-top:6px}
.in{background:var(--green)}.out{background:var(--red)}
#breakBtn{min-width:min(74vw,320px);padding:18px 22px;border-radius:18px;border:0;font:700 22px system-ui;color:#fff;background:var(--amber);cursor:pointer;display:none}
#breakBtn.end{background:var(--green)}
.totals{display:flex;gap:14px;width:min(92vw,420px)}
.totals div{flex:1;background:#fff;border-radius:16px;padding:12px 14px;text-align:center;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.totals b{display:block;font-size:26px}.totals span{color:var(--muted);font-size:14px}
#banner{display:none;width:min(92vw,420px);background:#fef3c7;color:#92400e;border-radius:14px;padding:12px 14px;font-weight:600;text-align:center}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(30px);opacity:0;transition:.25s;padding:16px 24px;border-radius:16px;color:#fff;font-weight:700;font-size:20px;background:var(--ink);max-width:92vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}#toast.ok{background:var(--green)}#toast.bad{background:var(--red)}
footer{padding:14px;text-align:center}footer a{color:var(--muted);font-size:15px}
</style>
</head>
<body>
<header><b id="title">Clock in / out</b><div class="lang"><button data-l="en">EN</button><button data-l="es">ES</button></div></header>
<main>
  <div id="hello"></div>
  <div id="state"></div>
  <button id="big" type="button" disabled></button>
  <button id="breakBtn" type="button"></button>
  <div id="banner"></div>
  <a id="paper" href="us-onboarding.html" style="display:none;width:min(92vw,420px);background:#dbeafe;color:#1e3a8a;border-radius:14px;padding:14px;font-weight:700;text-align:center;text-decoration:none"></a>
  <div class="totals"><div><b id="today">-</b><span id="lblToday"></span></div><div><b id="week">-</b><span id="lblWeek"></span></div></div>
</main>
<footer><a href="timesheet.html" id="sheetLink" style="display:inline-block;margin:0 14px 10px;font-weight:700;font-size:18px"></a><a href="leave.html" id="leaveLink" style="display:inline-block;margin:0 14px 10px;font-weight:700;font-size:18px"></a><br><a href="#" id="backLink"></a></footer>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module">
import { auth, onAuthStateChanged } from './firebase-config.js';

const T = {
  en: { title: 'Clock in / out', hello: 'Hello, {n}', in: 'CLOCK IN', out: 'CLOCK OUT', tap: 'Tap here', brk: 'Start break', brkEnd: 'End break',
        offState: 'You are <strong>not clocked in</strong>', inState: 'Working since <strong>{t}</strong><br>{d}', brkState: 'On break since <strong>{t}</strong>',
        today: 'Today', week: 'This week', done_in: 'Clocked in at {t}', done_out: 'Clocked out at {t}. Thank you!', done_bs: 'Break started', done_be: 'Back to work',
        paper: 'Please finish your new-hire paperwork (tap here)', forgot: 'It looks like you forgot to clock out. Please tell your manager.', fail: 'Could not reach the server. Try again.', back: 'Back to my dashboard', leave: 'Time off', sheet: 'My hours',
        already_in: 'You are already clocked in.', not_in: 'You are not clocked in.', already_on_break: 'You are already on a break.', not_on_break: 'You are not on a break.' },
  es: { title: 'Entrada / salida', hello: 'Hola, {n}', in: 'ENTRAR', out: 'SALIR', tap: 'Toque aquí', brk: 'Empezar descanso', brkEnd: 'Terminar descanso',
        offState: '<strong>No ha registrado entrada</strong>', inState: 'Trabajando desde <strong>{t}</strong><br>{d}', brkState: 'En descanso desde <strong>{t}</strong>',
        today: 'Hoy', week: 'Esta semana', done_in: 'Entrada registrada a las {t}', done_out: 'Salida registrada a las {t}. ¡Gracias!', done_bs: 'Descanso iniciado', done_be: 'De vuelta al trabajo',
        paper: 'Por favor termine sus papeles de nuevo empleado (toque aquí)', forgot: 'Parece que olvidó registrar su salida. Avise a su supervisor.', fail: 'No se pudo conectar. Intente de nuevo.', back: 'Volver a mi panel', leave: 'Tiempo libre', sheet: 'Mis horas',
        already_in: 'Ya registró su entrada.', not_in: 'No ha registrado entrada.', already_on_break: 'Ya está en descanso.', not_on_break: 'No está en descanso.' }
};
let lang = (navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en';
try { lang = localStorage.getItem('kylrx_lang') || lang; } catch (_) {}
const $ = (id) => document.getElementById(id);
const tr = (k, v = {}) => (T[lang][k] || k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
let name = '', status = null, clockOffset = 0, busy = false, paperNeeded = false;

const fmtTime = (iso) => new Date(iso).toLocaleTimeString(lang === 'es' ? 'es-US' : 'en-US', { hour: 'numeric', minute: '2-digit', timeZone: status && status.timeZone });
const fmtDur = (min) => { const h = Math.floor(min / 60), m = min % 60; return h ? `${h}h ${String(m).padStart(2, '0')}m` : `${m}m`; };

function toast(text, kind) { const t = $('toast'); t.textContent = text; t.className = `show ${kind || ''}`; clearTimeout(toast.id); toast.id = setTimeout(() => { t.className = ''; }, 3200); }

async function api(method, path, body) {
  const token = await auth.currentUser.getIdToken();
  const res = await fetch(`/api/time${path}`, { method, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }, body: body ? JSON.stringify(body) : undefined });
  const json = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, json };
}

function render() {
  document.documentElement.lang = lang;
  $('title').textContent = tr('title'); document.title = tr('title');
  $('leaveLink').textContent = tr('leave'); $('sheetLink').textContent = tr('sheet'); $('lblToday').textContent = tr('today'); $('lblWeek').textContent = tr('week'); $('backLink').textContent = tr('back');
  document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.l === lang));
  $('hello').textContent = name ? tr('hello', { n: name.split(' ')[0] }) : '';
  if (!status) return;
  const s = status.state;
  const big = $('big');
  big.disabled = busy;
  big.className = s === 'out' ? 'in' : 'out';
  big.innerHTML = `${s === 'out' ? tr('in') : tr('out')}<small>${tr('tap')}</small>`;
  const brk = $('breakBtn');
  brk.style.display = s === 'out' ? 'none' : 'block';
  brk.className = s === 'break' ? 'end' : '';
  brk.textContent = s === 'break' ? tr('brkEnd') : tr('brk');
  tick();
  $('today').textContent = fmtDur(status.todayMinutes); $('week').textContent = fmtDur(status.weekMinutes);
  const banner = $('banner'); banner.style.display = status.forgottenClockOut ? 'block' : 'none'; banner.textContent = tr('forgot');
  const paper = $('paper'); paper.textContent = tr('paper'); if (!paperNeeded) paper.style.display = 'none'; else paper.style.display = 'block';
}

function tick() {
  if (!status) return;
  const s = status.state;
  if (s === 'out') { $('state').innerHTML = tr('offState'); return; }
  const since = new Date(status.shiftStartedAt || status.lastPunchAt);
  const mins = Math.max(0, Math.floor((Date.now() + clockOffset - since.getTime()) / 60000));
  $('state').innerHTML = s === 'break' ? tr('brkState', { t: fmtTime(status.lastPunchAt) }) : tr('inState', { t: fmtTime(status.shiftStartedAt), d: fmtDur(mins) });
}
setInterval(tick, 20000);

function here() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      (p) => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy }),
      () => resolve(null), { timeout: 4000, maximumAge: 60000 });
  });
}

async function punch(action) {
  if (busy) return; busy = true; render();
  const location = await here();
  try {
    const r = await api('POST', '/punch', { action, location });
    if (r.ok) {
      status = r.json.status; clockOffset = new Date(status.serverNow).getTime() - Date.now();
      toast(tr({ in: 'done_in', out: 'done_out', break_start: 'done_bs', break_end: 'done_be' }[action], { t: fmtTime(status.lastPunchAt) }), 'ok');
      if (navigator.vibrate) navigator.vibrate(60);
    } else {
      if (r.json.status) status = r.json.status;
      toast(T[lang][r.json.code] || r.json.error || tr('fail'), 'bad');
    }
  } catch (_) { toast(tr('fail'), 'bad'); }
  busy = false; render();
}

$('big').onclick = () => punch(status.state === 'out' ? 'in' : 'out');
$('breakBtn').onclick = () => punch(status.state === 'break' ? 'break_end' : 'break_start');
$('backLink').onclick = (e) => { e.preventDefault(); if (history.length > 1) history.back(); else location.href = 'login.html'; };
document.querySelectorAll('.lang button').forEach((b) => { b.onclick = () => { lang = b.dataset.l; try { localStorage.setItem('kylrx_lang', lang); } catch (_) {} render(); }; });
render();

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.replace('login.html'); return; }
  try {
    const r = await api('GET', '/status');
    if (!r.ok) throw new Error(r.json.error);
    name = r.json.name || user.displayName || ''; status = r.json.status; clockOffset = new Date(status.serverNow).getTime() - Date.now();
    render();
    if (r.json.country === 'US') {
      try {
        const token = await user.getIdToken();
        const f = await fetch(`/api/us/employees/${encodeURIComponent(user.uid)}/forms`, { headers: { Authorization: `Bearer ${token}` } });
        if (f.ok) { const j = await f.json(); paperNeeded = !j.forms.w4 || !j.forms.i9.section1; render(); }
      } catch (_) {}
    }
  } catch (_) { toast(tr('fail'), 'bad'); }
});
</script>
</body>
</html>
