<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My schedule | Kylrx AI</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--bg:#f8fafc;--ok:#166534;--bad:#b91c1c}
*{box-sizing:border-box}body{margin:0;font:18px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#fff;border-bottom:1px solid var(--line);gap:8px}
h1{margin:0;font-size:22px}h2{margin:0 0 10px;font-size:19px}
.lang button{padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}.lang button.on{background:var(--ink);color:#fff}
main{max-width:560px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.item{border-top:1px solid var(--line);padding:12px 0}.item:first-child{border-top:0;padding-top:0}
.when{font-weight:800;font-size:19px}.hint{color:var(--muted);font-size:15px}
button.go{padding:11px 14px;border:0;border-radius:10px;background:var(--blue);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
button.soft{padding:10px 14px;border:0;border-radius:10px;background:#eef2ff;color:var(--blue);font:inherit;font-size:16px;font-weight:700;cursor:pointer}
button.no{padding:10px 14px;border:0;border-radius:10px;background:#fee2e2;color:var(--bad);font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.tag{padding:2px 10px;border-radius:999px;font-size:14px;font-weight:700}.good{background:#dcfce7;color:var(--ok)}.wait{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:var(--bad)}.grey{background:#e2e8f0;color:#475569}
#msg{display:none;border-radius:10px;padding:12px}#msg.ok{display:block;background:#dcfce7;color:var(--ok)}#msg.err{display:block;background:#fee2e2;color:var(--bad)}
select,input{padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;color:var(--ink);background:#fff;max-width:100%}
.av{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.av:first-child{border-top:0}
.av .times{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.notice{background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:10px;margin-bottom:8px;font-size:16px}
a.back{display:block;text-align:center;color:var(--blue);font-weight:700;padding:14px;text-decoration:none}
</style>
</head>
<body>
<header><h1 data-t="title"></h1><div class="lang"><button data-l="en">English</button> <button data-l="es">Español</button></div></header>
<main>
  <div id="msg" role="status"></div>
  <div id="notices"></div>
  <section class="card" id="askCard" hidden><h2 data-t="asks"></h2><div id="askList"></div></section>
  <section class="card"><h2 data-t="mine"></h2><div id="mineList"></div></section>
  <section class="card"><h2 data-t="open"></h2><p class="hint" data-t="openHint"></p><div id="openList"></div></section>
  <section class="card" id="reqCard" hidden><h2 data-t="myReqs"></h2><div id="reqList"></div></section>
  <section class="card">
    <h2 data-t="avail"></h2>
    <p class="hint" data-t="availHint"></p>
    <div id="availList"></div>
    <div class="row"><button class="go" id="availSave" data-t="save"></button></div>
  </section>
  <a class="back" href="punch.html" data-t="back"></a>
</main>
<script type="module">
import { auth, onAuthStateChanged } from './firebase-config.js';
const $ = (id) => document.getElementById(id);
const T = {
  en: {
    title: 'My schedule', back: 'Back to the clock', mine: 'My shifts', none: 'No shifts planned for the next 4 weeks.', open: 'Open shifts', openHint: 'Shifts nobody has yet. Ask for one if you want more hours.', noOpen: 'No open shifts right now.', take: 'I want this shift', asked: 'You asked for this', taken: 'Someone else asked first',
    swap: 'Swap with a coworker', drop: 'I cannot work this', who: 'Choose a coworker', send: 'Send', cancel: 'Cancel', why: 'Reason (optional)', today: 'Today', tomorrow: 'Tomorrow', breakMin: '{n} min break',
    asks: 'Coworkers asking you', askText: '{n} asks you to work {d}, {t}.', yes: 'Yes, I will take it', no: 'No', myReqs: 'My requests', r_swap: 'Swap with {n}', r_drop: 'Give up the shift',
    s_pending_peer: 'Waiting for your coworker', s_pending_manager: 'Waiting for your manager', s_approved: 'Approved', s_denied: 'Not approved', s_declined: 'Coworker said no', s_cancelled: 'Cancelled', cancelReq: 'Cancel request',
    avail: 'When I can work', availHint: 'Tell your manager which days and hours you can work. This is a request, not a promise of hours.', canWork: 'I can work', from: 'from', to: 'to', allDay: 'Leave the times empty if any time is fine.', save: 'Save', saved: 'Saved.',
    sentPeer: 'Sent. Your coworker has to say yes first.', sentMgr: 'Sent to your manager.', gotIt: 'The shift is yours.', askedMgr: 'Sent. Your manager has to approve it.', fail: 'Could not load your schedule. Try again.', gotNotice: 'OK',
    d0: 'Sunday', d1: 'Monday', d2: 'Tuesday', d3: 'Wednesday', d4: 'Thursday', d5: 'Friday', d6: 'Saturday'
  },
  es: {
    title: 'Mi horario', back: 'Volver al reloj', mine: 'Mis turnos', none: 'No hay turnos planeados para las próximas 4 semanas.', open: 'Turnos disponibles', openHint: 'Turnos que nadie tiene todavía. Pida uno si quiere más horas.', noOpen: 'No hay turnos disponibles ahora.', take: 'Quiero este turno', asked: 'Usted pidió este turno', taken: 'Otra persona lo pidió primero',
    swap: 'Cambiar con un compañero', drop: 'No puedo trabajar este turno', who: 'Elija un compañero', send: 'Enviar', cancel: 'Cancelar', why: 'Motivo (opcional)', today: 'Hoy', tomorrow: 'Mañana', breakMin: 'descanso de {n} min',
    asks: 'Compañeros que le piden un favor', askText: '{n} le pide trabajar el {d}, {t}.', yes: 'Sí, lo tomo', no: 'No', myReqs: 'Mis solicitudes', r_swap: 'Cambio con {n}', r_drop: 'Dejar el turno',
    s_pending_peer: 'Esperando a su compañero', s_pending_manager: 'Esperando a su supervisor', s_approved: 'Aprobado', s_denied: 'No aprobado', s_declined: 'Su compañero dijo que no', s_cancelled: 'Cancelado', cancelReq: 'Cancelar solicitud',
    avail: 'Cuándo puedo trabajar', availHint: 'Diga a su supervisor qué días y horas puede trabajar. Es una solicitud, no una promesa de horas.', canWork: 'Puedo trabajar', from: 'de', to: 'a', allDay: 'Deje las horas vacías si cualquier hora está bien.', save: 'Guardar', saved: 'Guardado.',
    sentPeer: 'Enviado. Su compañero tiene que aceptar primero.', sentMgr: 'Enviado a su supervisor.', gotIt: 'El turno es suyo.', askedMgr: 'Enviado. Su supervisor tiene que aprobarlo.', fail: 'No se pudo cargar su horario. Intente de nuevo.', gotNotice: 'Entendido',
    d0: 'Domingo', d1: 'Lunes', d2: 'Martes', d3: 'Miércoles', d4: 'Jueves', d5: 'Viernes', d6: 'Sábado'
  }
};
let lang = (navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en';
try { lang = localStorage.getItem('kylrx_lang') || lang; } catch (_) {}
if (!T[lang]) lang = 'en';
const tr = (k, v = {}) => (T[lang][k] ?? T.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const say = (t, ok = true) => { const m = $('msg'); m.textContent = t; m.className = ok ? 'ok' : 'err'; window.scrollTo({ top: 0, behavior: 'smooth' }); };
const loc = () => (lang === 'es' ? 'es-US' : 'en-US');
const t12 = (t) => { const [h, m] = String(t || '').split(':').map(Number); if (Number.isNaN(h)) return ''; return new Date(2000, 0, 1, h, m).toLocaleTimeString(loc(), { hour: 'numeric', minute: '2-digit' }); };
const span = (a, b) => `${t12(a)} - ${t12(b)}`;
let data = null; let me = null; let acting = null; // acting: { id, type } while the swap or drop box is open
const addDay = (s, n) => { const d = new Date(`${s}T12:00:00`); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const dayText = (d) => { const long = new Date(`${d}T12:00:00`).toLocaleDateString(loc(), { weekday: 'long', month: 'long', day: 'numeric' }); return d === data.today ? `${tr('today')}, ${long}` : d === addDay(data.today, 1) ? `${tr('tomorrow')}, ${long}` : long; };

async function req(method, path, body) {
  const token = await auth.currentUser.getIdToken();
  const res = await fetch(`/api/us/schedule${path}`, { method, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }, body: body ? JSON.stringify(body) : undefined });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((json.errors && json.errors.join('; ')) || (typeof json.error === 'string' ? json.error : '') || `Request failed (${res.status})`);
  return json;
}
async function load() {
  const [mine, open, swaps, av, notices, people] = await Promise.all([req('GET', '/mine'), req('GET', '/open'), req('GET', '/swaps'), req('GET', '/availability'), req('GET', '/notices'), req('GET', '/coworkers')]);
  data = { today: mine.today, mine: mine.data, open: open.data, swaps: swaps.data, weekly: av.availability.weekly, exceptions: av.availability.exceptions, notices: notices.data.filter((n) => !n.read).slice(0, 5), people: people.data };
  paint(true);
}
function paint(resetAvail) {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = tr(el.dataset.t); });
  document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.l === lang));
  if (!data) return;
  $('notices').innerHTML = data.notices.map((n) => `<div class="notice"><b>${esc(n.title)}</b><br>${esc(n.message)}<div class="row"><button class="soft" data-read="${esc(n.id)}">${esc(tr('gotNotice'))}</button></div></div>`).join('');
  const pendingFor = (id) => data.swaps.find((s) => s.shiftId === id && s.requesterId === me && ['pending_peer', 'pending_manager'].includes(s.status));
  $('mineList').innerHTML = data.mine.map((s) => {
    const p = pendingFor(s.id); const box = acting && acting.id === s.id;
    return `<div class="item"><div class="when">${esc(dayText(s.date))}</div><div>${esc(span(s.startTime, s.endTime))} <span class="hint">${esc([s.role, s.breakMinutes ? tr('breakMin', { n: s.breakMinutes }) : '', s.notes].filter(Boolean).join(' · '))}</span></div>${p ? `<div class="row"><span class="tag wait">${esc(tr(`s_${p.status}`))}</span></div>` : box ? `<div class="row">${acting.type === 'swap' ? `<select id="swapWho"><option value="">${esc(tr('who'))}</option>${data.people.map((c) => `<option value="${esc(c.userId)}">${esc(c.name)}</option>`).join('')}</select>` : ''}<input id="swapNote" maxlength="300" placeholder="${esc(tr('why'))}"><button class="go" data-sendswap="1">${esc(tr('send'))}</button><button class="soft" data-closeswap="1">${esc(tr('cancel'))}</button></div>` : `<div class="row"><button class="soft" data-act="swap" data-id="${esc(s.id)}">${esc(tr('swap'))}</button><button class="soft" data-act="drop" data-id="${esc(s.id)}">${esc(tr('drop'))}</button></div>`}</div>`;
  }).join('') || `<p class="hint">${esc(tr('none'))}</p>`;
  $('openList').innerHTML = data.open.map((s) => `<div class="item"><div class="when">${esc(dayText(s.date))}</div><div>${esc(span(s.startTime, s.endTime))} <span class="hint">${esc(s.role || '')}</span></div><div class="row">${s.mineClaim ? `<span class="tag wait">${esc(tr('asked'))}</span>` : s.claimPending ? `<span class="tag grey">${esc(tr('taken'))}</span>` : `<button class="go" data-claim="${esc(s.id)}">${esc(tr('take'))}</button>`}</div></div>`).join('') || `<p class="hint">${esc(tr('noOpen'))}</p>`;
  const asks = data.swaps.filter((s) => s.targetUserId === me && s.status === 'pending_peer');
  $('askCard').hidden = asks.length === 0;
  $('askList').innerHTML = asks.map((s) => `<div class="item">${esc(tr('askText', { n: s.requesterName || '', d: dayText(s.shiftDate), t: span(...s.shiftTime.split('-')) }))}${s.note ? `<br><span class="hint">${esc(s.note)}</span>` : ''}<div class="row"><button class="go" data-answer="${esc(s.id)}" data-yes="1">${esc(tr('yes'))}</button><button class="no" data-answer="${esc(s.id)}" data-yes="">${esc(tr('no'))}</button></div></div>`).join('');
  const mineReqs = data.swaps.filter((s) => s.requesterId === me).slice(0, 10);
  $('reqCard').hidden = mineReqs.length === 0;
  const cls = { pending_peer: 'wait', pending_manager: 'wait', approved: 'good', denied: 'bad', declined: 'bad', cancelled: 'grey' };
  $('reqList').innerHTML = mineReqs.map((s) => `<div class="item"><b>${esc(s.type === 'drop' ? tr('r_drop') : tr('r_swap', { n: s.targetName || '' }))}</b> <span class="tag ${cls[s.status] || 'grey'}">${esc(tr(`s_${s.status}`))}</span><br><span class="hint">${esc(new Date(`${s.shiftDate}T12:00:00`).toLocaleDateString(loc(), { weekday: 'long', month: 'long', day: 'numeric' }))}, ${esc(span(...s.shiftTime.split('-')))}</span>${['pending_peer', 'pending_manager'].includes(s.status) ? `<div class="row"><button class="no" data-cancelswap="${esc(s.id)}">${esc(tr('cancelReq'))}</button></div>` : ''}</div>`).join('');
  if (resetAvail || !$('availList').children.length) {
    $('availList').innerHTML = [1, 2, 3, 4, 5, 6, 0].map((d) => { const w = data.weekly.find((x) => x.dow === d) || { available: true }; return `<div class="av" data-dow="${d}"><b data-dayname="${d}"></b><label class="hint"><input type="checkbox" data-can ${w.available !== false ? 'checked' : ''} style="width:22px;height:22px;vertical-align:middle"> <span data-t="canWork">${esc(tr('canWork'))}</span></label><div class="times"><span class="hint" data-t="from">${esc(tr('from'))}</span><input type="time" data-start value="${esc(w.start || '')}"><span class="hint" data-t="to">${esc(tr('to'))}</span><input type="time" data-end value="${esc(w.end || '')}"></div></div>`; }).join('') + `<p class="hint" data-t="allDay">${esc(tr('allDay'))}</p>`;
  }
  document.querySelectorAll('[data-dayname]').forEach((el) => { el.textContent = tr(`d${el.dataset.dayname}`); });
}
$('availSave').addEventListener('click', async () => {
  const weekly = [...document.querySelectorAll('.av')].map((row) => { const o = { dow: Number(row.dataset.dow), available: row.querySelector('[data-can]').checked }; const s = row.querySelector('[data-start]').value; const e = row.querySelector('[data-end]').value; if (o.available && s && e) { o.start = s; o.end = e; } return o; });
  try { const r = await req('PUT', '/availability', { weekly, exceptions: data.exceptions }); data.weekly = r.availability.weekly; say(tr('saved')); } catch (err) { say(err.message, false); }
});
document.addEventListener('click', async (e) => {
  const el = (k) => e.target.closest(`[data-${k}]`);
  let t;
  try {
    if ((t = el('l'))) { lang = t.dataset.l; try { localStorage.setItem('kylrx_lang', lang); } catch (_) {} paint(); } else if ((t = el('act'))) { acting = { id: t.dataset.id, type: t.dataset.act }; paint(); } else if (el('closeswap')) { acting = null; paint(); } else if (el('sendswap')) {
      const body = { type: acting.type, shiftId: acting.id, note: $('swapNote').value };
      if (acting.type === 'swap') { body.targetUserId = $('swapWho').value; if (!body.targetUserId) { say(tr('who'), false); return; } }
      await req('POST', '/swaps', body); const peer = acting.type === 'swap'; acting = null; await load(); say(tr(peer ? 'sentPeer' : 'sentMgr'));
    } else if ((t = el('claim'))) { const r = await req('POST', `/shifts/${t.dataset.claim}/claim`, {}); await load(); say(tr(r.status === 'assigned' ? 'gotIt' : 'askedMgr')); } else if ((t = el('answer'))) { await req('POST', `/swaps/${t.dataset.answer}/respond`, { accept: Boolean(t.dataset.yes) }); await load(); } else if ((t = el('cancelswap'))) { await req('POST', `/swaps/${t.dataset.cancelswap}/cancel`, {}); await load(); } else if ((t = el('read'))) { await req('POST', `/notices/${t.dataset.read}/read`, {}); data.notices = data.notices.filter((n) => n.id !== t.dataset.read); paint(); }
  } catch (err) { say(err.message, false); }
});
paint();
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'login.html'; return; }
  me = user.uid;
  try { await load(); } catch (_) { say(tr('fail'), false); }
});
</script>
</body>
</html>
