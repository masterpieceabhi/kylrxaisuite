<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time off</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--green:#16a34a;--red:#dc2626;--amber:#d97706;--bg:#f1f5f9}
*{box-sizing:border-box}body{margin:0;font:18px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#fff;border-bottom:1px solid var(--line)}
.lang button{font:inherit;font-weight:700;padding:6px 14px;border-radius:999px;border:2px solid #cbd5e1;background:#fff;margin-left:6px}.lang button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:640px;margin:0 auto;padding:18px 14px 60px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.bal{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0}.bal b{font-size:34px}.bal span{color:var(--muted)}
h2{margin:0 0 8px;font-size:20px}p.s{margin:0;color:var(--muted);font-size:15px}
label.f{display:grid;gap:6px;margin:12px 0;font-weight:600}
input,select,textarea{width:100%;max-width:100%;padding:14px;border:2px solid var(--line);border-radius:12px;font:inherit;background:#fff}
button.go{width:100%;padding:18px;border:0;border-radius:14px;background:var(--blue);color:#fff;font:700 20px system-ui;margin-top:8px;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.chip{padding:3px 10px;border-radius:999px;font-size:14px;font-weight:700}.pending{background:#fef3c7;color:#92400e}.approved{background:#dcfce7;color:#166534}.denied,.cancelled{background:#fee2e2;color:#b91c1c}
.cancel{border:0;background:#fee2e2;color:#b91c1c;border-radius:10px;padding:8px 12px;font:700 15px system-ui;cursor:pointer}
#msg{display:none;padding:14px;border-radius:12px;font-weight:600}#msg.ok{display:block;background:#dcfce7;color:#166534}#msg.err{display:block;background:#fee2e2;color:#b91c1c}
.back{display:block;text-align:center;color:var(--muted);padding:10px}
</style>
</head>
<body>
<header><b id="title">Time off</b><div class="lang"><button data-l="en">EN</button><button data-l="es">ES</button></div></header>
<main>
  <div id="msg" role="status"></div>
  <section class="card"><h2 id="hBal"></h2><div id="bals"></div></section>
  <section class="card">
    <h2 id="hReq"></h2>
    <form id="form">
      <label class="f"><span id="lType"></span><select name="policyId" id="policy"></select></label>
      <label class="f"><span id="lFrom"></span><input type="date" name="startDate" required></label>
      <label class="f"><span id="lTo"></span><input type="date" name="endDate" required></label>
      <label class="f"><span id="lLen"></span><select name="hoursPerDay"><option value="8" id="oFull"></option><option value="4" id="oHalf"></option><option value="2" id="oTwo"></option></select></label>
      <label class="f"><span id="lNote"></span><input type="text" name="reason" maxlength="200"></label>
      <button class="go" type="submit" id="send"></button>
    </form>
  </section>
  <section class="card"><h2 id="hMine"></h2><div id="mine"></div></section>
  <a class="back" href="#" id="back"></a>
</main>

<script type="module">
import { auth, onAuthStateChanged } from './firebase-config.js';

const T = {
  en: { title: 'Time off', hBal: 'My time off', hReq: 'Ask for time off', hMine: 'My requests', lType: 'What kind?', lFrom: 'First day off', lTo: 'Last day off', lLen: 'How long each day?', oFull: 'Full day (8 hours)', oHalf: 'Half day (4 hours)', oTwo: '2 hours',
    lNote: 'Note for your manager (optional)', send: 'Send request', hours: 'hours', avail: 'you can use', usable: 'You can use this from {d}', none: 'No requests yet.', cancel: 'Cancel',
    pending: 'Waiting', approved: 'Approved', denied: 'Not approved', cancelled: 'Cancelled', sent: 'Request sent. Your manager will answer soon.', cancelled_ok: 'Request cancelled.', back: 'Back', fail: 'Could not reach the server.', noPolicy: 'No time off is set up yet. Ask HR.', noStart: 'Your start date is missing. Ask HR.', sick: 'Sick', pto: 'Vacation' },
  es: { title: 'Tiempo libre', hBal: 'Mi tiempo libre', hReq: 'Pedir tiempo libre', hMine: 'Mis solicitudes', lType: '¿De qué tipo?', lFrom: 'Primer día libre', lTo: 'Último día libre', lLen: '¿Cuánto cada día?', oFull: 'Día completo (8 horas)', oHalf: 'Medio día (4 horas)', oTwo: '2 horas',
    lNote: 'Nota para su supervisor (opcional)', send: 'Enviar solicitud', hours: 'horas', avail: 'puede usar', usable: 'Puede usarlo desde {d}', none: 'Aún no hay solicitudes.', cancel: 'Cancelar',
    pending: 'En espera', approved: 'Aprobado', denied: 'No aprobado', cancelled: 'Cancelado', sent: 'Solicitud enviada. Su supervisor responderá pronto.', cancelled_ok: 'Solicitud cancelada.', back: 'Volver', fail: 'No se pudo conectar.', noPolicy: 'Aún no hay tiempo libre configurado. Pregunte a Recursos Humanos.', noStart: 'Falta su fecha de inicio. Pregunte a Recursos Humanos.', sick: 'Enfermedad', pto: 'Vacaciones' }
};
let lang = (navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en';
try { lang = localStorage.getItem('kylrx_lang') || lang; } catch (_) {}
const $ = (id) => document.getElementById(id);
const tr = (k, v = {}) => (T[lang][k] || k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
let balances = [], requests = [];

function show(kind, text) { const m = $('msg'); m.textContent = text; m.className = kind; window.scrollTo({ top: 0, behavior: 'smooth' }); }
async function api(method, path, body) {
  const token = await auth.currentUser.getIdToken();
  const res = await fetch(`/api/us/leave${path}`, { method, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }, body: body ? JSON.stringify(body) : undefined });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((json.errors && json.errors.join('\n')) || json.error || tr('fail'));
  return json;
}

function paint() {
  document.documentElement.lang = lang; document.title = tr('title'); $('title').textContent = tr('title');
  document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.l === lang));
  ['hBal', 'hReq', 'hMine', 'lType', 'lFrom', 'lTo', 'lLen', 'lNote', 'oFull', 'oHalf', 'oTwo'].forEach((k) => { $(k).textContent = tr(k); });
  $('send').textContent = tr('send'); $('back').textContent = tr('back');
  const typeName = (p) => p.name;
  $('bals').innerHTML = balances.length ? balances.map((r) => r.balance
    ? `<div class="bal"><div><div><b>${r.balance.availableBalance}</b> <span>${tr('hours')}</span></div><p class="s">${typeName(r.policy)}</p>${r.balance.eligibleToUse ? '' : `<p class="s">${tr('usable', { d: r.balance.usageEligibleOn })}</p>`}</div></div>`
    : `<p class="s">${typeName(r.policy)}: ${tr('noStart')}</p>`).join('') : `<p class="s">${tr('noPolicy')}</p>`;
  const sel = $('policy').value;
  $('policy').innerHTML = balances.filter((r) => r.balance).map((r) => `<option value="${r.policy.id}">${typeName(r.policy)}</option>`).join('');
  if (sel) $('policy').value = sel;
  $('mine').innerHTML = requests.length ? requests.map((r) => `<div class="row"><div><b>${r.startDate === r.endDate ? r.startDate : `${r.startDate} → ${r.endDate}`}</b><p class="s">${r.hours} ${tr('hours')} · ${r.policyName}</p></div><div><span class="chip ${r.status}">${tr(r.status)}</span>${['pending', 'approved'].includes(r.status) ? ` <button class="cancel" data-id="${r.id}">${tr('cancel')}</button>` : ''}</div></div>`).join('') : `<p class="s">${tr('none')}</p>`;
}

async function load() {
  balances = (await api('GET', '/balances')).data;
  requests = (await api('GET', '/requests?scope=mine')).data;
  paint();
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault(); const f = e.target;
  try {
    await api('POST', '/requests', { policyId: f.policyId.value, startDate: f.startDate.value, endDate: f.endDate.value, hoursPerDay: f.hoursPerDay.value, reason: f.reason.value });
    f.reset(); show('ok', tr('sent')); await load();
  } catch (err) { show('err', err.message); }
});
$('mine').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-id]'); if (!b) return;
  try { await api('POST', `/requests/${b.dataset.id}/cancel`); show('ok', tr('cancelled_ok')); await load(); } catch (err) { show('err', err.message); }
});
$('back').onclick = (e) => { e.preventDefault(); if (history.length > 1) history.back(); else location.href = 'punch.html'; };
document.querySelectorAll('.lang button').forEach((b) => { b.onclick = () => { lang = b.dataset.l; try { localStorage.setItem('kylrx_lang', lang); } catch (_) {} paint(); }; });
paint();
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.replace('login.html'); return; }
  try { await load(); } catch (err) { show('err', err.message); }
});
</script>
</body>
</html>
